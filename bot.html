<!DOCTYPE html>
<!-- ChewGumi Role Bot v1 · MedIT -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>AI 비서 | CHEWGUMI</title>
<script src="assets/guard.js" defer></script>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/pagelist.css">
<script src="assets/auth.js"></script>
<script src="assets/site.js"></script>
<script src="assets/pagelist.js" defer></script>
<style>
:root{
  --main:#D82558; --main2:#E95073; --pink:#FFBDCC; --pink-lt:#FFE4E6;
  --ok:#2AA060; --bad:#C0395C;
  --gray:#797979; --ink:#17171c;
  --line:rgba(255,255,255,.85); --glass:rgba(255,255,255,.68);
  --sp-s:clamp(0.75rem,0.7rem+0.24vw,1rem);
  --sp-m:clamp(1.3rem,1.1rem+0.5vw,1.9rem);
}
*,*::before,*::after{box-sizing:border-box}
*{margin:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'SUIT Variable','SUIT',-apple-system,BlinkMacSystemFont,
    "Apple SD Gothic Neo",sans-serif;
  color:var(--ink);font-size:clamp(0.94rem,0.9rem+0.2vw,1rem);line-height:1.7;
  min-height:100svh;display:flex;flex-direction:column;
  background:radial-gradient(900px 520px at 12% -8%,rgba(255,71,117,.11),transparent 60%),
    linear-gradient(180deg,#FFF9FB,#FDF3F5 45%,#FFFAF6);
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button,input,textarea{font-family:inherit;font-size:16px}
@media(min-width:1024px){button,input,textarea{font-size:14.5px}}

header{
  flex:0 0 auto;
  padding:16px var(--sp-s);
  background:rgba(255,255,255,.88);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(0,0,0,.05);
}
.hd{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.hd .ic{
  width:40px;height:40px;border-radius:13px;flex:none;
  background:linear-gradient(135deg,var(--main2),var(--main));
  color:#fff;font-size:18px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 5px 14px rgba(216,37,88,.26);
}
.hd .t{flex:1;min-width:0}
.hd h1{font-size:16px;font-weight:800;letter-spacing:-.03em}
.hd .s{font-size:12px;color:var(--gray);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd a{font-size:12.5px;color:var(--gray);flex:none}

main{
  flex:1 1 auto;overflow-y:auto;
  padding:var(--sp-m) var(--sp-s);
  -webkit-overflow-scrolling:touch;
}
.wrap{max-width:760px;margin:0 auto}

.intro{
  padding:22px 24px;border-radius:20px;margin-bottom:18px;
  background:var(--glass);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
}
.intro b{display:block;font-size:15px;font-weight:800;letter-spacing:-.02em}
.intro p{font-size:13.5px;color:#555;margin-top:7px;word-break:keep-all}
.tips{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}
.tips button{
  min-height:36px;padding:0 15px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:rgba(255,255,255,.85);
  font-size:12.5px;font-weight:600;color:#555;
}
.tips button:hover{background:var(--pink-lt);color:var(--main)}

.msg{margin-bottom:16px;display:flex;gap:11px;align-items:flex-start}
.msg.me{flex-direction:row-reverse}
.msg .av{
  width:32px;height:32px;border-radius:11px;flex:none;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:800;
}
.msg.bot .av{background:linear-gradient(135deg,var(--main2),var(--main));color:#fff}
.msg.me .av{background:rgba(0,0,0,.07);color:#555}
.msg .bd{
  max-width:min(80%,540px);padding:13px 17px;border-radius:18px;
  font-size:14px;line-height:1.8;white-space:pre-wrap;word-break:keep-all;
}
.msg.bot .bd{
  background:rgba(255,255,255,.88);border:1px solid var(--line);
  border-top-left-radius:6px;
  box-shadow:0 4px 14px rgba(0,0,0,.05);
}
.msg.me .bd{
  background:linear-gradient(135deg,var(--main2),var(--main));color:#fff;
  border-top-right-radius:6px;
}
.msg .w{font-size:10.5px;color:var(--gray);margin-top:5px}

.wait{display:flex;gap:5px;padding:15px 18px}
.wait i{
  width:7px;height:7px;border-radius:50%;background:var(--pink);
  animation:bounce 1.2s infinite;
}
.wait i:nth-child(2){animation-delay:.15s}
.wait i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}
  30%{transform:translateY(-5px);opacity:1}}

footer{
  flex:0 0 auto;
  padding:14px var(--sp-s) calc(16px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.9);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border-top:1px solid rgba(0,0,0,.06);
}
.ft{max-width:760px;margin:0 auto;display:flex;gap:9px;align-items:flex-end}
#q{
  flex:1;min-height:50px;max-height:130px;padding:13px 17px;
  border-radius:22px;resize:none;line-height:1.6;
  border:1px solid var(--line);background:rgba(255,255,255,.95);color:var(--ink);
}
#q:focus{outline:2px solid var(--main);outline-offset:-1px}
#send{
  width:50px;height:50px;flex:none;border:0;border-radius:50%;cursor:pointer;
  background:linear-gradient(135deg,var(--main2),var(--main));color:#fff;
  font-size:17px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 5px 16px rgba(216,37,88,.28);
}
#send:disabled{opacity:.45;cursor:default}
.err{font-size:12.5px;color:var(--bad);text-align:center;margin-top:8px;min-height:18px}
.hide{display:none}
</style>
<script src="assets/tok.js"></script>
</head>
<body>

<header>
  <div class="hd">
    <div class="ic" id="ic">✦</div>
    <div class="t">
      <h1 id="nm">AI 비서</h1>
      <div class="s" id="me">불러오는 중…</div>
    </div>
    <a href="hub.html">← 화면 모음</a>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="intro" id="intro">
      <b>안녕하세요</b>
      <p id="ip">잠시만 기다려 주세요…</p>
      <div class="tips" id="tips"></div>
    </div>
    <div id="log"></div>
  </div>
</main>

<footer>
  <div class="ft">
    <textarea id="q" rows="1" placeholder="무엇이든 물어보세요"></textarea>
    <button id="send" onclick="send()" aria-label="보내기">↑</button>
  </div>
  <div class="err" id="err"></div>
</footer>

<script src="assets/lite.js" defer></script>
<script>
const SB='https://psynvpuedzjvytsgdhgg.supabase.co';
const FN=SB+'/functions/v1/role-bot';
const KEY='sb_publishable_Tz7vgJXgYHQ3tyUfm87WTw_vV1Dxfuk';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);

let ROLE='', NAME='비서', busy=false;

const ICON={ceo:'♛',staff:'▣',dev:'⌘',design:'✎',qa:'✓'};

function tok(){
  try{
    const s=JSON.parse(localStorage.getItem('cg_sb')||'null');
    if(!s||!s.t) return '';
    var _ex = s.exp ? s.exp*1000 : (s.e||0); if (_ex && Date.now() > _ex) return '';
    return s.t;
  }catch(e){ return ''; }
}
function H(){ return {apikey:KEY,Authorization:'Bearer '+tok(),'Content-Type':'application/json'}; }
function call(p){
  return fetch(FN,{method:'POST',headers:H(),body:JSON.stringify(p)}).then(r=>r.json());
}
function when(){
  const t=new Date();
  return String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
}

function add(kind, text, w){
  const d=document.createElement('div');
  d.className='msg '+kind;
  d.innerHTML='<div class="av">'+(kind==='bot'?(ICON[ROLE]||'✦'):'나')+'</div>'
    +'<div><div class="bd">'+esc(text)+'</div>'
    +'<div class="w">'+(w||when())+'</div></div>';
  $('log').appendChild(d);
  d.scrollIntoView({behavior:'smooth',block:'end'});
  return d;
}

function waiting(){
  const d=document.createElement('div');
  d.className='msg bot';
  d.id='waitBox';
  d.innerHTML='<div class="av">'+(ICON[ROLE]||'✦')+'</div>'
    +'<div class="bd wait"><i></i><i></i><i></i></div>';
  $('log').appendChild(d);
  d.scrollIntoView({behavior:'smooth',block:'end'});
}

function hello(){
  call({action:'hello'}).then(function(d){
    if(!d.ok){ $('err').textContent=d.error||'불러오지 못했습니다.'; return; }
    ROLE=d.role; NAME=d.name;
    $('nm').textContent=d.name;
    $('me').textContent=d.me;
    $('ic').textContent=ICON[d.role]||'✦';
    $('ip').textContent=d.intro;
    $('tips').innerHTML=(d.tips||[]).map(function(t){
      return '<button onclick="fill(\''+t.replace(/'/g,"\\'")+'\')">'+esc(t)+'</button>';
    }).join('');

    (d.history||[]).forEach(function(h){
      const t=new Date(h.created_at);
      const w=String(t.getMonth()+1)+'/'+t.getDate()+' '
        +String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
      add('me', h.q, w);
      add('bot', h.a, w);
    });
  }).catch(function(){ $('err').textContent='불러오지 못했습니다.'; });
}

function fill(t){ $('q').value=t; $('q').focus(); grow(); }

function send(){
  const q=$('q').value.trim();
  if(!q||busy) return;
  busy=true; $('send').disabled=true; $('err').textContent='';
  $('intro').classList.add('hide');
  add('me', q);
  $('q').value=''; grow();
  waiting();

  call({action:'ask',q:q}).then(function(d){
    const w=$('waitBox'); if(w) w.remove();
    busy=false; $('send').disabled=false;
    if(!d.ok){ $('err').textContent=d.error||'답을 받지 못했습니다.'; return; }
    add('bot', d.a);
  }).catch(function(){
    const w=$('waitBox'); if(w) w.remove();
    busy=false; $('send').disabled=false;
    $('err').textContent='답을 받지 못했습니다.';
  });
}

function grow(){
  const t=$('q');
  t.style.height='auto';
  t.style.height=Math.min(t.scrollHeight,130)+'px';
}

$('q').addEventListener('input', grow);
$('q').addEventListener('keydown', function(e){
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});

hello();
</script>
</body>
</html>
