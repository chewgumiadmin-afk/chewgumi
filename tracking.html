<script>
const SB='https://psynvpuedzjvytsgdhgg.supabase.co';
const KEY='sb_publishable_Tz7vgJXgYHQ3tyUfm87WTw_vV1Dxfuk';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
let tab='order';

function setTab(t){
  tab=t;
  $('tOrder').classList.toggle('on',t==='order');
  $('tInv').classList.toggle('on',t==='inv');
  $('paneOrder').style.display = t==='order' ? 'block':'none';
  $('paneInv').style.display   = t==='inv'   ? 'block':'none';
  $('msg').textContent=''; $('res').classList.remove('on');
}

/* 주소로 바로 조회 가능: tracking.html?order=20260805-123456 */
(function(){
  const q=new URLSearchParams(location.search);
  if(q.get('order')) $('orderNo').value=q.get('order');
  if(q.get('invoice')){ setTab('inv'); $('invNo').value=q.get('invoice'); }
})();

function track(){
  const body={action:'trace'};
  if(tab==='order'){
    const no=$('orderNo').value.trim(), p4=$('phone4').value.replace(/[^0-9]/g,'');
    if(!no) return $('msg').textContent='주문번호를 입력해 주세요.';
    if(p4.length!==4) return $('msg').textContent='연락처 뒤 4자리를 입력해 주세요.';
    body.orderNo=no; body.phone4=p4;
  } else {
    const inv=$('invNo').value.replace(/[^0-9]/g,'');
    if(!inv) return $('msg').textContent='운송장 번호를 입력해 주세요.';
    body.invoice=inv;
  }
  $('go').disabled=true; $('msg').textContent='조회 중…'; $('res').classList.remove('on');

  fetch(SB+'/functions/v1/tracking',{method:'POST',
    headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify(body)})
  .then(r=>r.json().then(d=>({ok:r.ok,d})))
  .then(({ok,d})=>{
    $('go').disabled=false;
    if(!ok||!d.ok){ helpBox(d.error||'조회에 실패했습니다.'); return; }
      if(d.notYet){
        $('msg').className='msg';
        $('msg').innerHTML='<b>'+esc(d.message||'준비 중입니다.')+'</b><br>'
          +'<span style="font-size:11.5px">발송되면 문자와 알림으로 알려드립니다.</span>';
        return;
      }
    $('msg').textContent='';
    $('rCn').textContent=d.company||d.courier||'택배';
    $('rIv').textContent='운송장 '+(d.invoice||'');
    $('rSt').textContent=d.complete?'배송 완료':(d.levelName||d.last||'배송 중');
    $('rSt').className='st'+(d.complete?' done':'');
    const ds=d.steps||d.details||[];
    $('steps').innerHTML = ds.length ? ds.map((s,i)=>{
      const last=i===ds.length-1;
      return '<div class="step'+(last?(d.complete?' done':' last'):'')+'">'
        +'<span class="dot"></span><div class="c">'
        +'<div class="k">'+esc(s.kind||'-')+'</div>'
        +(s.where?'<div class="w">'+esc(s.where)+'</div>':'')
        +(s.time?'<div class="t">'+esc(s.time)+'</div>':'')
        +'</div></div>';
    }).join('') : '<div class="hint">아직 배송 정보가 등록되지 않았습니다. 발송 후 반영까지 시간이 걸릴 수 있습니다.</div>';
          /* 진행 단계 막대 */
      var lv = Number(d.level||0);
      var bar = document.getElementById('shipBar');
      if(bar){
        var NAMES=['접수','집화','이동 중','지점 도착','배송 출발','배송 완료'];
        bar.innerHTML = NAMES.map(function(n,i){
          var on = lv >= (i+1);
          return '<div class="sb-step'+(on?' on':'')+(lv===(i+1)?' now':'')+'">'
            +'<span class="sb-dot"></span><span class="sb-nm">'+n+'</span></div>';
        }).join('');
        bar.style.display='';
      }
      $('res').classList.add('on');
      nextSteps(d);
    $('res').scrollIntoView({behavior:'smooth',block:'nearest'});
  }).catch(()=>{ $('go').disabled=false;
    $('msg').textContent='네트워크 오류가 발생했습니다.'; helpBox('네트워크 오류'); });
}

/* ══════════════════════════════════════════════
   조회 뒤 다음에 할 일을 안내합니다.
   전에는 배송 상태만 보여주고 끝이라, 배송이 끝난 뒤
   반품을 신청하거나 후기를 쓰려면 다른 화면을 찾아가야 했습니다.
   ══════════════════════════════════════════════ */
function nextSteps(d){
  var box = document.getElementById('trkNext');
  if(!box){
    box = document.createElement('div');
    box.id = 'trkNext'; box.className = 'trk-next';
    $('res').appendChild(box);
  }
  var no = (tab==='order') ? $('orderNo').value.trim() : (d.orderNo || '');
  var h = '';

  if(d.complete){
    h += '<div class="tn-t">물건은 잘 받으셨나요?</div>';
    if(no){
      h += '<button type="button" class="tn-b warn" data-no="'+esc(no)+'"'
        +  ' onclick="cgOA.ret(this)">반품 · 교환 신청</button>'
        +  '<button type="button" class="tn-b rev" data-no="'+esc(no)+'"'
        +  ' onclick="cgOA.review(this)">후기 쓰고 적립금 받기</button>';
    }
    h += '<div class="tn-h">단순 변심은 받으신 날부터 7일 안에 신청하실 수 있습니다.</div>';
  } else {
    h += '<div class="tn-t">배송이 진행 중입니다</div>';
  }
  h += '<div class="tn-row">'
    +  (no ? '<a class="tn-b" href="order-lookup.html?no='+encodeURIComponent(no)+'">주문 상세 보기</a>' : '')
    +  '<a class="tn-b" href="'+csUrl()+'" target="_blank" rel="noopener">고객센터 문의</a>'
    +  '</div>';
  box.innerHTML = h;
  box.style.display = '';
}

/* 조회가 안 될 때 — 막다른 길로 두지 않습니다 */
function helpBox(why){
  var m = $('msg');
  if(!m) return;
  m.innerHTML = esc(why) + '<div class="tn-row" style="margin-top:10px">'
    + '<a class="tn-b" href="order-lookup.html">주문번호로 조회</a>'
    + '<a class="tn-b" href="' + csUrl() + '" target="_blank" rel="noopener">고객센터 문의</a>'
    + '</div>';
}

function csUrl(){
  try{ if(window.CG_CS_URL) return window.CG_CS_URL; }catch(e){}
  return 'https://pf.kakao.com/_lxjxjiX';
}
</script>

  <div class="cgbot-ft">
    <input id="cgbotIn" placeholder="메시지를 입력하세요"

  </div>
</div>
<script>
(function(){
  var SB='https://psynvpuedzjvytsgdhgg.supabase.co';
  var KEY='sb_publishable_Tz7vgJXgYHQ3tyUfm87WTw_vV1Dxfuk';
  var kakaoUrl='', started=false, hist=[];
  var sid=''; try{ sid=localStorage.getItem('cg_chat_sid')||'';
    if(!sid){ sid=Math.random().toString(36).slice(2)+Date.now().toString(36);
      localStorage.setItem('cg_chat_sid',sid);} }catch(e){}

  function el(id){return document.getElementById(id);}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function add(role,text){
    var d=document.createElement('div');
    d.className='cgbot-msg '+(role==='me'?'me':'bot');
    d.textContent=text; el('cgbotBody').appendChild(d);
    el('cgbotBody').scrollTop=el('cgbotBody').scrollHeight;
    return d;
  }
  function addKakao(){
    if(!kakaoUrl) return;
    var a=document.createElement('a');
    a.className='cgbot-kakao'; a.href=kakaoUrl; a.target='_blank'; a.rel='noopener';
    a.textContent='카카오톡으로 상담원 연결';
    el('cgbotBody').appendChild(a);
    el('cgbotBody').scrollTop=el('cgbotBody').scrollHeight;
  }
  function quick(){
    var qs=['배송 얼마나 걸리나요','배송비 얼마인가요','무통장 계좌 알려주세요','트래블잇이 뭔가요'];
    var w=document.createElement('div'); w.className='cgbot-quick';
    qs.forEach(function(q){
      var b=document.createElement('button'); b.textContent=q;
      b.onclick=function(){ el('cgbotIn').value=q; cgbotSend(); w.remove(); };
      w.appendChild(b);
    });
    el('cgbotBody').appendChild(w);
  }
  window.cgbotToggle=function(){
    var w=el('cgbotWin'); w.classList.toggle('on');
    if(w.classList.contains('on')){
      if(!started){
        started=true;
        add('bot','안녕하세요, 츄구미입니다.\n배송·상품·주문에 대해 물어보세요.');
        quick();
        fetch(SB+'/functions/v1/chat',{method:'POST',
          headers:{'Content-Type':'application/json',apikey:KEY},
          body:JSON.stringify({action:'config'})})
        .then(function(r){return r.json();})
        .then(function(d){ kakaoUrl=d.kakao||''; }).catch(function(){});
      }
      setTimeout(function(){el('cgbotIn').focus();},80);
    }
  };

  /* 대화 지우기 — index 에만 있던 것을 모든 화면에 넣습니다 */
  window.cgbotClear=function(){
    if(!confirm('지금까지의 대화를 지울까요?')) return;
    try{ hist = []; }catch(e){}
    try{ started = false; }catch(e){}
    var b=document.getElementById('cgbotBody');
    if(b) b.innerHTML='';
    try{
      sessionStorage.removeItem('cgbot_sid');
      localStorage.removeItem('cgbot_hist');
    }catch(e){}
    if(b){
      var d=document.createElement('div');
      d.className='cgbot-msg bot';
      d.textContent='대화를 지웠습니다. 무엇을 도와드릴까요?';
      b.appendChild(d);
    }
  };

  window.cgbotSend=function(){
    var v=el('cgbotIn').value.trim(); if(!v) return;
    el('cgbotIn').value=''; add('me',v);
    hist.push({role:'me',text:v});
    var t=add('bot','…'); el('cgbotBtn').disabled=true;
    fetch(SB+'/functions/v1/chat',{method:'POST',
      headers:{'Content-Type':'application/json',apikey:KEY},
      body:JSON.stringify({action:'ask',question:v,sessionId:sid,history:hist.slice(0,-1)})})
    .then(function(r){return r.json();})
    .then(function(d){
      el('cgbotBtn').disabled=false;
      t.textContent=d.answer||'답변을 가져오지 못했습니다.';
      hist.push({role:'bot',text:t.textContent});
      if(d.kakao) kakaoUrl=d.kakao;
      if(d.handoff) addKakao();
    }).catch(function(){
      el('cgbotBtn').disabled=false;
      t.textContent='연결에 실패했습니다. 잠시 후 다시 시도해 주세요.';
      addKakao();
    });
  };
})();
</script>
