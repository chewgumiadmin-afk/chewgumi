<!DOCTYPE html>
<!-- ChewGumi Delivery Tracking v1 · MedIT -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>배송 조회 | CHEWGUMI</title>
<meta name="description" content="츄구미 주문 배송 조회">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT/fonts/variable/woff2/SUIT-Variable.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--main:#D82558;--main2:#E95073;--sub:#FFE923;--ok:#2AA060;--ink:#1a1a1a;--gray:#797979;
  --line:rgba(255,255,255,.85);--glass:rgba(255,255,255,.62)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"SUIT Variable","SUIT","Noto Sans KR",sans-serif;color:var(--ink);min-height:100vh;padding-bottom:60px;
  background:radial-gradient(900px 500px at 12% -5%,rgba(236,94,134,.14),transparent 60%),
    linear-gradient(180deg,#FFF7FA,#FDF3F5 45%,#FFF9F4)}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--main2);outline-offset:3px;border-radius:8px}
.topbar{height:45px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(90deg,var(--main2),var(--main));color:#fff;font-size:14.5px;font-weight:600}
.head{max-width:620px;margin:0 auto;padding:22px 20px 0;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Poppins',sans-serif;font-weight:800;font-size:20px;color:var(--main)}
.head nav a{font-size:12.5px;color:var(--gray);margin-left:14px}
.wrap{max-width:620px;margin:0 auto;padding:20px}
h1{font-family:'Poppins',sans-serif;font-size:26px;font-weight:700;margin-bottom:5px}
.lead{font-size:13px;color:var(--gray);line-height:1.7;margin-bottom:20px}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:22px;margin-bottom:14px;
  backdrop-filter:blur(20px) saturate(120%);-webkit-backdrop-filter:blur(20px) saturate(120%);
  box-shadow:0 14px 34px rgba(0,0,0,.08),inset 0 1px 0 rgba(255,255,255,.9)}
.panel h2{font-size:11px;letter-spacing:2.5px;color:var(--gray);font-weight:700;margin-bottom:14px}
label{display:block;font-size:12.5px;font-weight:600;margin:11px 0 5px}
input{width:100%;padding:12px 14px;border-radius:13px;font-size:13.5px;font-family:inherit;color:var(--ink);
  border:1px solid var(--line);background:rgba(255,255,255,.8)}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;padding:11px 0;border-radius:999px;font-size:12.5px;font-weight:600;
  background:rgba(255,255,255,.6);border:1px solid var(--line);color:var(--gray)}
.tabs button.on{background:linear-gradient(135deg,var(--main2),var(--main));color:#fff;border-color:transparent}
.btn{width:100%;margin-top:16px;padding:15px 0;border:0;border-radius:999px;font-size:14px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--main2),var(--main));box-shadow:0 10px 24px rgba(216,37,88,.3)}
.btn:disabled{opacity:.5;box-shadow:none;cursor:not-allowed}
.msg{font-size:12.5px;color:var(--main);margin-top:11px;min-height:17px;line-height:1.7}
.hint{font-size:11.5px;color:var(--gray);margin-top:6px;line-height:1.7}
/* 결과 */
.res{display:none}.res.on{display:block}
.sum{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
  padding-bottom:14px;margin-bottom:6px;border-bottom:1px solid rgba(0,0,0,.09)}
.sum .cn{font-size:15px;font-weight:700}
.sum .iv{font-size:12px;color:var(--gray);margin-top:3px}
.st{font-size:11px;font-weight:700;padding:6px 13px;border-radius:999px;color:#fff;background:var(--main2)}
.st.done{background:var(--ok)}
.step{display:flex;gap:12px;padding:12px 2px;position:relative}
.step .dot{width:11px;height:11px;flex:none;margin-top:5px;border-radius:50%;background:#ddd;position:relative;z-index:2}
.step.last .dot{background:var(--main);box-shadow:0 0 0 4px rgba(216,37,88,.15)}
.step.done .dot{background:var(--ok)}
.step:not(:last-child)::before{content:"";position:absolute;left:5px;top:22px;bottom:-6px;width:1.5px;background:#e5e5e5}
.step .c{flex:1;min-width:0}
.step .k{font-size:13.5px;font-weight:600}
.step .w{font-size:12px;color:var(--gray);margin-top:3px}
.step .t{font-size:11.5px;color:#aaa;margin-top:2px}
.foot{max-width:620px;margin:26px auto 0;padding:20px;border-top:1px solid rgba(0,0,0,.07);
  display:flex;flex-wrap:wrap;gap:12px;justify-content:center;font-size:11.5px;color:var(--gray)}
.foot a{text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
<div class="topbar">배송 조회</div>
<div class="head">
  <a class="logo" href="index.html">CHEW GUMI</a>
  <nav><a href="mypage.html">마이페이지</a><a href="index.html">홈</a></nav>
</div>

<div class="wrap">
  <h1>Delivery</h1>
  <p class="lead">주문번호 또는 운송장 번호로 배송 상황을 확인하실 수 있습니다.</p>

  <div class="panel">
    <div class="tabs">
      <button class="on" id="tOrder" onclick="setTab('order')">주문번호로 조회</button>
      <button id="tInv" onclick="setTab('inv')">운송장으로 조회</button>
    </div>

    <div id="paneOrder">
      <label>주문번호</label>
      <input id="orderNo" placeholder="예) 20260805-123456">
      <label>연락처 뒤 4자리</label>
      <input id="phone4" inputmode="numeric" maxlength="4" placeholder="예) 1234">
      <div class="hint">주문 시 입력하신 휴대전화 뒤 4자리를 넣어주세요. 본인 확인용입니다.</div>
    </div>

    <div id="paneInv" style="display:none">
      <label>운송장 번호</label>
      <input id="invNo" inputmode="numeric" placeholder="숫자만 입력">
      <div class="hint">택배사는 운송장 번호로 자동 인식됩니다.</div>
    </div>

    <button class="btn" id="go" onclick="track()">배송 조회하기</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="panel res" id="res">
    <h2>배송 현황</h2>
    <div class="sum">
      <div><div class="cn" id="rCn"></div><div class="iv" id="rIv"></div></div>
      <span class="st" id="rSt"></span>
    </div>
    <div id="steps"></div>
  </div>
</div>

<div class="foot">
  <a href="faq.html">자주묻는질문</a>
  <a href="qna.html">문의하기</a>
  <a href="mypage.html">주문 내역</a>
  <a href="index.html">← 홈으로</a>
</div>

<script>
const SB='https://psynvpuedzjvytsgdhgg.supabase.co';
const KEY='sb_publishable_Tz7vgJXgYHQ3tyUfm87WTw_vV1Dxfuk';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
let tab='order';

function setTab(t){
  tab=t;
  $('tOrder').classList.toggle('on',t==='order');
  $('tInv').classList.toggle('on',t==='inv');
  $('paneOrder').style.display = t==='order' ? 'block':'none';
  $('paneInv').style.display   = t==='inv'   ? 'block':'none';
  $('msg').textContent=''; $('res').classList.remove('on');
}

/* 주소로 바로 조회 가능: tracking.html?order=20260805-123456 */
(function(){
  const q=new URLSearchParams(location.search);
  if(q.get('order')) $('orderNo').value=q.get('order');
  if(q.get('invoice')){ setTab('inv'); $('invNo').value=q.get('invoice'); }
})();

function track(){
  const body={action:'track'};
  if(tab==='order'){
    const no=$('orderNo').value.trim(), p4=$('phone4').value.replace(/[^0-9]/g,'');
    if(!no) return $('msg').textContent='주문번호를 입력해 주세요.';
    if(p4.length!==4) return $('msg').textContent='연락처 뒤 4자리를 입력해 주세요.';
    body.orderNo=no; body.phone4=p4;
  } else {
    const inv=$('invNo').value.replace(/[^0-9]/g,'');
    if(!inv) return $('msg').textContent='운송장 번호를 입력해 주세요.';
    body.invoice=inv;
  }
  $('go').disabled=true; $('msg').textContent='조회 중…'; $('res').classList.remove('on');

  fetch(SB+'/functions/v1/tracking',{method:'POST',
    headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify(body)})
  .then(r=>r.json().then(d=>({ok:r.ok,d})))
  .then(({ok,d})=>{
    $('go').disabled=false;
    if(!ok||!d.ok){ $('msg').textContent=d.error||'조회에 실패했습니다.'; return; }
    $('msg').textContent='';
    $('rCn').textContent=d.courier||'택배';
    $('rIv').textContent='운송장 '+(d.invoice||'');
    $('rSt').textContent=d.complete?'배송완료':(d.last||'배송중');
    $('rSt').className='st'+(d.complete?' done':'');
    const ds=d.details||[];
    $('steps').innerHTML = ds.length ? ds.map((s,i)=>{
      const last=i===ds.length-1;
      return '<div class="step'+(last?(d.complete?' done':' last'):'')+'">'
        +'<span class="dot"></span><div class="c">'
        +'<div class="k">'+esc(s.kind||'-')+'</div>'
        +(s.where?'<div class="w">'+esc(s.where)+'</div>':'')
        +(s.time?'<div class="t">'+esc(s.time)+'</div>':'')
        +'</div></div>';
    }).join('') : '<div class="hint">아직 배송 정보가 등록되지 않았습니다. 발송 후 반영까지 시간이 걸릴 수 있습니다.</div>';
    $('res').classList.add('on');
    $('res').scrollIntoView({behavior:'smooth',block:'nearest'});
  }).catch(()=>{ $('go').disabled=false; $('msg').textContent='네트워크 오류가 발생했습니다.'; });
}
</script>
</body>
</html>
