<!DOCTYPE html>
<!-- ChewGumi Admin Console v9 · MedIT -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>관리자 | CHEWGUMI</title>
<script src="assets/role.js"></script>
<script src="assets/guard.js" defer></script>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT/fonts/variable/woff2/SUIT-Variable.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/glass.css">
<link rel="stylesheet" href="assets/admin-ui.css">
<style>
:root{--main:#D82558;--main2:#E95073;--ok:#2AA060;--warn:#E9A23B;--bad:#C0395C;
  --ink:#17171c;--gray:#7a7a82;--line:rgba(255,255,255,.85);--glass:rgba(255,255,255,.64)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:"SUIT Variable","SUIT","Noto Sans KR",sans-serif;color:var(--ink);
  min-height:100vh;padding:24px 16px 40px;
  background:radial-gradient(900px 500px at 12% -5%,rgba(236,94,134,.13),transparent 60%),
    linear-gradient(180deg,#FFF7FA,#FDF3F5 45%,#FFF9F4)}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}
.wrap{max-width:920px;margin:0 auto}

.top{display:flex;justify-content:space-between;align-items:flex-end;
  flex-wrap:wrap;gap:12px;margin-bottom:20px}
.top h1{font-family:'Poppins',sans-serif}
.top .s{margin-top:2px;color:var(--gray)}
.top .me{font-size:12.5px;color:var(--gray)}
.top .me b{color:var(--ink)}

.panel{background:var(--glass);border:1px solid var(--line);border-radius:24px;
  backdrop-filter:blur(20px) saturate(120%);-webkit-backdrop-filter:blur(20px) saturate(120%);
  box-shadow:0 12px 30px rgba(0,0,0,.07),inset 0 1px 0 rgba(255,255,255,.9)}
input,select,textarea{border:1px solid var(--line);background:rgba(255,255,255,.88);
  color:var(--ink);font-family:inherit;width:100%}
.btn{border:0;color:#fff;background:linear-gradient(135deg,var(--main2),var(--main));
  box-shadow:0 8px 20px rgba(216,37,88,.28)}
.btn.ghost{background:rgba(255,255,255,.86);color:var(--ink);
  border:1px solid var(--line);box-shadow:none}
.mini{background:rgba(255,255,255,.86);border:1px solid var(--line);color:var(--ink)}
.msg{color:var(--gray);min-height:17px}
.msg.bad{color:var(--main)}.msg.ok{color:var(--ok)}
.empty{text-align:center;color:var(--gray)}
.hide{display:none}

/* 채팅 */
.chat{display:flex;flex-direction:column;gap:14px}
.log{display:flex;flex-direction:column;gap:12px;max-height:44vh;overflow-y:auto;
  padding-right:4px;scroll-behavior:smooth}
.bub{max-width:86%;padding:13px 16px;border-radius:18px;font-size:14px;line-height:1.8;
  white-space:pre-wrap;word-break:keep-all}
.bub.me{align-self:flex-end;background:linear-gradient(135deg,var(--main2),var(--main));
  color:#fff;border-bottom-right-radius:6px}
.bub.ai{align-self:flex-start;background:rgba(255,255,255,.92);
  border:1px solid var(--line);border-bottom-left-radius:6px;
  box-shadow:0 3px 10px rgba(0,0,0,.05)}
.bub.ai a{color:var(--main);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.th{display:inline-flex;gap:4px}
.th i{width:6px;height:6px;border-radius:50%;background:var(--main);opacity:.4;
  animation:bl 1.2s infinite}
.th i:nth-child(2){animation-delay:.2s}.th i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:.9}}

.ask{display:flex;gap:8px;align-items:flex-end}
.ask textarea{flex:1;min-height:52px;max-height:140px;resize:none;
  border-radius:18px;padding:15px 18px !important;font-size:14px;line-height:1.6}
.ask button{flex:none;width:52px;height:52px;border-radius:50%;padding:0 !important;
  display:flex;align-items:center;justify-content:center}
.ask button svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round}
.ask button:disabled{opacity:.45}

.sug{display:flex;gap:7px;flex-wrap:wrap}
.sug button{padding:9px 14px;border-radius:999px;font-size:12.5px;font-weight:600;
  background:rgba(255,255,255,.8);border:1px solid var(--line);color:#5a5a62}
.sug button:hover{background:#fff}

/* 할 일 */
.todo{display:flex;gap:11px;align-items:flex-start;padding:14px 4px;
  border-bottom:1px solid rgba(0,0,0,.06)}
.todo:last-child{border-bottom:0}
.todo .p{flex:none;width:24px;height:24px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff}
.todo .p.p1{background:var(--main)}.todo .p.p2{background:var(--warn)}
.todo .b{flex:1;min-width:0}
.todo .b b{display:block;font-size:14px;font-weight:700;line-height:1.45}
.todo .b span{display:block;margin-top:3px;font-size:12.5px;color:var(--gray);line-height:1.6}
.todo a{flex:none;align-self:center}

/* 메뉴 */
.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.menu a{display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:16px 8px;border-radius:16px;text-align:center;
  background:rgba(255,255,255,.72);border:1px solid var(--line);transition:.18s}
.menu a:hover{transform:translateY(-2px);background:#fff;
  box-shadow:0 8px 20px rgba(0,0,0,.08)}
.menu a svg{width:22px;height:22px;fill:none;stroke:var(--main);stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.menu a b{font-size:12px;font-weight:700;line-height:1.35}
.bd{min-width:18px;height:18px;padding:0 5px;border-radius:999px;
  background:var(--main);color:#fff;font-size:10px;font-weight:800;
  display:inline-flex;align-items:center;justify-content:center;margin-left:4px}

@media(max-width:768px){
  .menu{grid-template-columns:repeat(3,1fr)}
  .log{max-height:38vh}
  .bub{max-width:92%;font-size:13.5px}
}
@media(max-width:420px){ .menu{grid-template-columns:repeat(2,1fr)} }

  /* 모바일 — 긴 글자가 화면을 밀어내지 않도록 */
  @media(max-width:640px){
    body{overflow-x:hidden}
    .msg,.hint,p,li,td,th,.rb,.ib,.sb,.d{word-break:keep-all;overflow-wrap:anywhere}
    [style*="nowrap"],.nowrap{white-space:normal !important}
    .acts,.chips,.tabs,.sug,.eps,.kinds{overflow-x:auto;-webkit-overflow-scrolling:touch;
      scrollbar-width:none;padding-bottom:2px}
    .acts::-webkit-scrollbar,.chips::-webkit-scrollbar,
    .tabs::-webkit-scrollbar,.sug::-webkit-scrollbar{display:none}
    .out,pre,code{overflow-x:auto;word-break:break-all}
  }

.hrq{padding:12px 4px;border-bottom:1px solid rgba(0,0,0,.06)}
.hrq:last-child{border-bottom:0}
.hrq .q{font-size:13px;font-weight:600;line-height:1.5}
.hrq .m{margin-top:4px;font-size:11.5px;color:var(--gray);
  display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hrq .st{font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px;color:#fff}
.hrq .st.queued{background:var(--warn)}.hrq .st.answered{background:#9a9aa2}
.hrq .st.done{background:var(--ok)}

/* ══ 관리자 콘솔 UI 정돈 ══ */
/* 메뉴 15개 → 5열이면 3줄로 딱 맞습니다 */
@media (min-width:1000px){
  .menu{grid-template-columns:repeat(5,1fr) !important}
}
@media (min-width:769px) and (max-width:999px){
  .menu{grid-template-columns:repeat(4,1fr) !important}
}
/* 메뉴 칸 높이 통일 — 글자 수가 달라도 같은 크기 */
.menu a{
  min-height:92px;
  justify-content:center;
  padding:14px 6px !important;
}
.menu a b{
  display:flex;align-items:center;justify-content:center;gap:3px;
  min-height:32px;
  font-size:11.5px;
  word-break:keep-all;
}
.bd{
  position:relative;top:-1px;
  min-width:17px;height:17px;font-size:10.5px;
}
@media (max-width:640px){
  .menu a{min-height:86px;padding:12px 5px !important}
  .menu a b{font-size:11px;min-height:30px}
  .menu a svg{width:20px;height:20px}
}

/* 채팅 영역 — 화면이 클수록 여유 있게 */
@media (min-width:1000px){
  .log{max-height:50vh}
}
@media (max-height:700px){
  .log{max-height:34vh}
}

/* 할 일 목록 — 버튼이 밀리지 않도록 */
.todo{gap:12px}
.todo .b b{font-size:13.5px}
.todo a{min-width:60px;text-align:center}
@media (max-width:480px){
  .todo{flex-wrap:wrap}
  .todo .b{flex:1 1 calc(100% - 40px)}
  .todo a{margin-left:35px;margin-top:2px}
}

/* 제안 버튼 줄 — 가로 스크롤 */
.sug{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;padding-bottom:2px}
.sug::-webkit-scrollbar{display:none}
.sug button{flex:none;white-space:nowrap}
@media (min-width:769px){
  .sug{flex-wrap:wrap;overflow:visible}
}

/* ══ 관리자 화면 공통 · 글래스 버튼 ══ */
.btn{
  min-height:48px !important;
  padding:0 24px !important;
  border-radius:14px !important;
  font-weight:600 !important;
  letter-spacing:-.01em;
  display:inline-flex !important;
  align-items:center !important;
  justify-content:center !important;
  gap:7px;
  color:var(--ink) !important;
  background:rgba(255,255,255,.58) !important;
  border:1px solid rgba(255,255,255,.9) !important;
  backdrop-filter:blur(18px) saturate(140%);
  -webkit-backdrop-filter:blur(18px) saturate(140%);
  box-shadow:0 6px 18px rgba(0,0,0,.07),inset 0 1px 0 rgba(255,255,255,.95) !important;
  transition:background .18s ease, box-shadow .18s ease, transform .12s ease;
}
.btn:hover{
  background:rgba(255,255,255,.76) !important;
  box-shadow:0 8px 22px rgba(0,0,0,.09),inset 0 1px 0 rgba(255,255,255,1) !important;
}
.btn:active{ transform:translateY(1px) }
.btn.sub, .btn.ghost{
  background:rgba(255,255,255,.42) !important;
  color:#555 !important;
}
.btn.danger{
  color:#A32F4E !important;
  background:linear-gradient(135deg,rgba(208,96,124,.2),rgba(176,48,80,.15)) !important;
  border-color:rgba(255,255,255,.85) !important;
}
.btn:disabled{ opacity:.45 !important;box-shadow:none !important;cursor:default }

.btns{
  display:flex !important;
  justify-content:center !important;
  align-items:center;
  gap:9px;
  flex-wrap:wrap;
}
.btns > .btn{ flex:1;min-width:150px }

/* 체크박스 */
input[type=checkbox]{
  -webkit-appearance:none;appearance:none;
  width:20px;height:20px;margin:0;flex:none;
  border-radius:7px;
  border:1.5px solid rgba(0,0,0,.16);
  background:rgba(255,255,255,.9);
  cursor:pointer;position:relative;
  transition:background .18s ease,border-color .18s ease;
}
input[type=checkbox]:checked{
  background:linear-gradient(135deg,var(--main2),var(--main));
  border-color:transparent;
}
input[type=checkbox]:checked::after{
  content:"";position:absolute;left:6.5px;top:2.5px;
  width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;
  transform:rotate(43deg);
}
label:has(> input[type=checkbox]){
  display:inline-flex;align-items:center;gap:9px;
  min-height:44px;cursor:pointer;user-select:none;
}

@media (max-width:640px){
  .btn{ min-height:50px !important }
  .btns > .btn{ min-width:0 }
}

/* 물어보기 버튼 — 츄구미 로고 */
.ask .btn#send{
  width:52px !important;
  height:52px !important;
  min-width:52px !important;
  padding:0 !important;
  border:0 !important;
  border-radius:50% !important;
  cursor:pointer !important;
  background:linear-gradient(135deg,#FFE4E6,#FFBDCC) !important;
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  flex:none !important;
  overflow:hidden !important;
  box-shadow:0 5px 16px rgba(216,37,88,.22) !important;
  transition:transform .18s, box-shadow .18s !important;
}
.ask .btn#send:hover{
  transform:scale(1.06) !important;
  box-shadow:0 8px 22px rgba(216,37,88,.32) !important;
}
.ask .btn#send:active{ transform:scale(.97) !important }
.ask .btn#send:disabled{
  opacity:.5 !important;
  transform:none !important;
  cursor:default !important;
}
.send-logo{
  width:38px !important;
  height:38px !important;
  object-fit:contain !important;
  display:block !important;
  pointer-events:none !important;
}

/* 생각하는 동안 살짝 움직입니다 */
.ask .btn#send.busy .send-logo{
  animation:cg-think 1.1s ease-in-out infinite;
}
@keyframes cg-think{
  0%,100%{ transform:scale(1) rotate(0) }
  35%    { transform:scale(1.1) rotate(-7deg) }
  70%    { transform:scale(1.04) rotate(6deg) }
}
@media (prefers-reduced-motion:reduce){
  .ask .btn#send.busy .send-logo{ animation:none }
}

@media (max-width:640px){
  .ask .btn#send{ width:46px !important; height:46px !important; min-width:46px !important }
  .send-logo{ width:33px !important; height:33px !important }
}
</style>

<body>
<div class="wrap">
  <div class="top">
    <div><h1>Console</h1><div class="s">츄구미 관리자</div></div>
    <div class="me" id="me"></div>
  </div>

  <div class="panel" id="login">
    <h2>ADMIN LOGIN</h2>
    <label>이메일</label>
    <input id="em" type="email" autocomplete="email"
      onkeydown="if(event.key==='Enter')document.getElementById('pw').focus()">
    <label>비밀번호</label>
    <input id="pw" type="password" autocomplete="current-password"
      onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn" onclick="doLogin()" style="width:100%;margin-top:16px">로그인</button>
    <div class="msg" id="lmsg"></div>
  </div>

  <div id="area" class="hide">
    <div class="panel">
      <h2>무엇을 도와드릴까요</h2>
      <div class="msg" style="margin:-6px 0 12px">
        현황을 묻거나 <b>사용법</b>을 물어보셔도 됩니다.
        "입금 확인 어디서 하나요" 같은 질문에 화면과 버튼을 알려드립니다.
      </div>
      <div class="chat">
        <div class="log" id="log"></div>
        <div class="sug">
          <button onclick="ask('오늘 뭐부터 해야 해?')">오늘 할 일</button>
          <button onclick="ask('주문 현황 알려줘')">주문 현황</button>
          <button onclick="ask('재고 상태 어때?')">재고 상태</button>
          <button onclick="ask('문의 답변 남은 거 있어?')">답변 대기</button>
          <button onclick="ask('구독 현황 알려줘')">구독 현황</button>
          <button onclick="clearChat()" style="margin-left:auto;opacity:.7">대화 지우기</button>
          <button onclick="ask('입금 확인은 어디서 하나요?')">사용법</button>
        </div>
        <div class="ask">
          <textarea id="q" rows="1" placeholder="궁금한 것을 물어보세요"
            oninput="grow(this)"
            onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();ask()}"></textarea>
          <button class="btn" id="send" onclick="ask()" aria-label="물어보기" title="물어보기">
          <img src="logo.png" alt="" class="send-logo"
            onerror="this.onerror=null;this.src='assets/logo-rainbow.png'">
        </button>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>지금 처리할 일</h2>
      <div id="todos"><div class="empty">확인 중…</div></div>
    </div>

    <div class="panel">
      <h2>바로가기</h2>
      <div class="menu" id="menu"></div>
    </div>

    <div class="panel">
      <h2>휴대폰 알림</h2>
      <div class="msg" id="pshMsg" style="margin-top:0">확인 중…</div>
      <div class="acts" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
        <button class="btn" id="pshBtn" onclick="pshToggle()">내 아이디로 알림 받기</button>
        <button class="btn ghost" onclick="pshTest()">테스트 알림</button>
      </div>
      <div class="msg" id="pshRes"></div>
    </div>

    <div class="panel">
      <h2>브랜드 담당자 창구</h2>
      <div class="msg" style="margin-top:0">
        츄구미 담당자분들이 직접 물어보고 수정 요청하실 수 있는 화면입니다.
        요청이 들어오면 메일과 휴대폰 알림이 전달됩니다.
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
        <a class="btn ghost" href="help.html" style="display:inline-flex;
          align-items:center;padding:0 20px">도움말 창구 열기</a>
        <a class="btn ghost" href="dev.html" style="display:inline-flex;
          align-items:center;padding:0 20px">화면 수정</a>
      </div>
      <div class="msg" id="hlMsg" style="margin-top:12px">확인 중…</div>
      <div id="hlList" style="margin-top:8px"></div>
    </div>

    <div class="panel">
      <h2>계정</h2>
      <button class="btn ghost" onclick="doLogout()" style="max-width:150px">로그아웃</button>
    </div>
  </div>
</div>

  .then(r=>r.json().then(d=>({ok:r.ok,d})));

const MENU=[

 ['stock.html','재고 · 품절','M20 7 12 3 4 7v10l8 4 8-4z|M4 7l8 4 8-4M12 11v10','stock'],
 ['subs-admin.html','정기구독','M21 12a9 9 0 1 1-3-6.7|M21 4v5h-5|M12 8v4l2.5 2','subs'],

function sync(){
  if(window.CGAuth && CGAuth.isIn() && !window._cgChecked){
    window._cgChecked=1;
    CGAuth.token().then(function(t){
      if(t){ token=t; sync(); }
      else { token=null; sync(); }
    });
  }const on=!!token;
  $('login').classList.toggle('hide',on);$('area').classList.toggle('hide',!on);
  if(on){ $('me').innerHTML='<b>'+esc(who)+'</b> 님'; boot(); setTimeout(function(){try{if(typeof pshUI==='function')pshUI();if(typeof hlLoad==='function')hlLoad();}catch(e){}},600); }}
function doLogin(){
  const email=$('em').value.trim(),pw=$('pw').value;
  if(!email||!pw)return $('lmsg').textContent='이메일과 비밀번호를 입력해 주세요.';
  $('lmsg').className='msg'; $('lmsg').textContent='로그인 중…';
  CGAuth.login(email,pw).then(function(at){ var d={access_token:at};
    if(d.access_token){token=d.access_token;who=email.split('@')[0];
      
      $('lmsg').textContent='';sync();}
    else {$('lmsg').className='msg bad';
      $('lmsg').textContent='로그인 실패: 운영자 계정인지 확인해 주세요.';}
  }).catch(()=>{$('lmsg').className='msg bad';$('lmsg').textContent='네트워크 오류가 발생했습니다.';});
}
function doLogout(){token=null;who='';try{CGAuth.logout();}catch(e){}hist=[];
  try{localStorage.removeItem('cg_sb');}catch(e){}sync();}

function grow(t){ t.style.height='auto'; t.style.height=Math.min(140,t.scrollHeight)+'px'; }
function bub(role,text){
  const d=document.createElement('div');
  d.className='bub '+role;
  if(text==='…') d.innerHTML='<span class="th"><i></i><i></i><i></i></span>';
  else d.innerHTML=link(text);
  $('log').appendChild(d);
  $('log').scrollTop=$('log').scrollHeight;
  return d;
}
function ask(preset){
  if(busy) return;
  const q = preset || $('q').value.trim();
  if(!q) return;
  $('q').value=''; grow($('q'));
  bub('me',q);
  hist.push({role:'me',text:q});
  const t=bub('ai','…');
  busy=true; $('send').disabled=true;
  call({action:'ask',q,history:hist}).then(({ok,d})=>{
    busy=false; $('send').disabled=false;
    t.innerHTML = ok ? link(d.text) : esc(d.error||'답변을 불러오지 못했습니다.');
    if(ok) hist.push({role:'ai',text:d.text});
    $('log').scrollTop=$('log').scrollHeight;
  }).catch(()=>{busy=false;$('send').disabled=false;
    t.textContent='네트워크 오류가 발생했습니다.';});
}

function boot(){
  call({action:'snapshot'}).then(({ok,d})=>{
    if(!ok){ bub('ai','현황을 불러오지 못했습니다. '+(d.error||'')); return; }
    const s=d.snap, t=d.todos||[];
    const h=new Date().getHours();
    const greet = h<11?'좋은 아침입니다':(h<18?'안녕하세요':'수고 많으셨습니다');
    let msg = greet+', '+who+'님.\n\n';
    if(!t.length) msg += '지금 급히 처리할 일은 없습니다.\n필요하신 게 있으면 물어보세요.';
    else msg += '처리할 일이 '+t.length+'건 있습니다.\n\n'
      + t.slice(0,3).map((x,i)=>(i+1)+'. '+x.t).join('\n')
      + (t.length>3?'\n\n나머지는 아래 목록에서 확인하세요.':'');
    /* 지난 대화를 복원하고, 인사는 하루 한 번만 */
    var _day = new Date().toDateString();
    var _last = '';
    try{ _last = localStorage.getItem('cg_greet_day') || ''; }catch(e){}

    if(d.past && d.past.length){
      d.past.forEach(function(m){ bub(m.role, m.text); });
      hist = d.past.slice(-6);
      if(_last !== _day){
        try{ localStorage.setItem('cg_greet_day', _day); }catch(e){}
        bub('ai', msg);
      }
    } else {
      try{ localStorage.setItem('cg_greet_day', _day); }catch(e){}
      bub('ai', msg);
    }

    $('todos').innerHTML = t.length ? t.map(x=>
      '<div class="todo"><span class="p p'+x.p+'">'+x.p+'</span>'
      +'<span class="b"><b>'+esc(x.t)+'</b><span>'+esc(x.d)+'</span></span>'
      +'<a class="mini" href="'+esc(x.u)+'">처리</a></div>').join('')
      : '<div class="empty" style="padding:32px 0">처리할 일이 없습니다.</div>';

    const BD={orders:(s.orders.pending||0)+(s.orders.toShip||0),
      stock:(s.stock.soldOut||0)+(s.stock.low||0),
      subs:(s.subs.pending||0)+(s.subs.due||0),
      qna:s.qnaWaiting||0, issues:s.issuesOpen||0, cafe24:s.cafe24?0:1, help:0};
    $('menu').innerHTML = MENU.map(function(m){
      const c=BD[m[3]]||0;
      return '<a href="'+m[0]+'"><svg viewBox="0 0 24 24">'
        +m[2].split('|').map(function(d){return '<path d="'+d+'"/>';}).join('')+'</svg>'
        +'<b>'+m[1]+(c?'<span class="bd">'+c+'</span>':'')+'</b></a>';
    }).join('');
  }).catch(()=>{ bub('ai','현황을 불러오지 못했습니다.'); });
}
sync();
</script>

<script>
/* 웹 푸시 */
const FN_PUSH = SB + '/functions/v1/push';
function pshCall(p){
  return fetch(FN_PUSH,{method:'POST',headers:H(),body:JSON.stringify(p)})
    .then(r=>r.json().then(d=>({ok:r.ok,d})));
}
function pshUI(){
  var st = window.cgPushState ? cgPushState() : 'unsupported';
  var b = $('pshBtn'), m = $('pshMsg');
  if(!b||!m) return;
  if(st==='unsupported'){
    b.disabled=true; b.textContent='지원하지 않는 브라우저';
    m.textContent='이 브라우저는 알림을 지원하지 않습니다. 크롬이나 삼성 인터넷을 이용해 주세요.';
  } else if(st==='denied'){
    b.disabled=true; b.textContent='알림 차단됨';
    m.innerHTML='브라우저에서 알림이 차단되어 있습니다.<br>'
      +'주소창 왼쪽 자물쇠 → 알림 → 허용으로 바꿔주세요.';
  } else if(st==='on'){
    b.disabled=false; b.textContent='알림 끄기';
    b.className='btn ghost';
    m.innerHTML='<b style="color:var(--ok)">이 기기로 알림을 받고 있습니다.</b><br>'
      +'주문이 들어오면 휴대폰 화면에 바로 뜹니다. 비용은 들지 않습니다.';
  } else {
    b.disabled=false; b.textContent='내 아이디로 알림 받기';
    b.className='btn';
    m.innerHTML='주문 알림을 휴대폰으로 받으실 수 있습니다. <b>무료</b>입니다.<br>'
      +'<span style="font-size:11.5px">아이폰은 홈 화면에 추가한 뒤 열어야 작동합니다.</span>';
  }
}
function pshToggle(){
  $('pshRes').className='msg'; $('pshRes').textContent='처리 중…';
  cgPushToggle().then(function(){
    pshUI();
    $('pshRes').className='msg ok';
    $('pshRes').textContent = cgPushState()==='on'
      ? '알림이 켜졌습니다. 테스트를 눌러 확인해 보세요.' : '알림을 껐습니다.';
  }).catch(function(e){
    $('pshRes').className='msg bad';
    $('pshRes').textContent = e.message || '처리하지 못했습니다.';
    pshUI();
  });
}
function pshTest(){
  $('pshRes').className='msg'; $('pshRes').textContent='알림을 보내는 중…';
  pshCall({action:'test'}).then(({ok,d})=>{
    if(!ok){ $('pshRes').className='msg bad'; $('pshRes').textContent=d.error||'실패'; return; }
    $('pshRes').className='msg ok';
    $('pshRes').textContent='기기 '+d.sent+'대로 보냈습니다.'
      +(d.gone?' (만료된 구독 '+d.gone+'건 정리)':'');
  }).catch(()=>{$('pshRes').className='msg bad';$('pshRes').textContent='네트워크 오류가 발생했습니다.';});
}
document.addEventListener('cg-push-state', pshUI);

/* 담당자 요청 현황 */
function hlLoad(){
  fetch(SB+'/functions/v1/help',{method:'POST',headers:H(),
    body:JSON.stringify({action:'list'})})
  .then(r=>r.json().then(d=>({ok:r.ok,d})))
  .then(({ok,d})=>{
    if(!ok){ $('hlMsg').textContent='요청 목록을 불러오지 못했습니다.'; return; }
    var it=d.items||[];
    var q=it.filter(function(x){return x.status==='queued';});
    $('hlMsg').innerHTML = q.length
      ? '<b style="color:var(--main)">처리할 요청 '+q.length+'건</b>'
      : '대기 중인 요청이 없습니다.';
    $('hlList').innerHTML = it.slice(0,5).map(function(r){
      return '<div class="hrq"><div class="q">'
        +esc(r.question.split('\n')[0].slice(0,60))+'</div>'
        +'<div class="m">'
        +(r.kind!=='question'?'<span class="st '+r.status+'">'
          +(r.status==='queued'?'접수':r.status==='done'?'완료':'답변')+'</span>':'')
        +'<span>'+esc(r.asker_name||'')+'</span>'
        +'<span>'+new Date(r.created_at).toLocaleDateString('ko-KR')+'</span>'
        +'</div></div>';
    }).join('');
  }).catch(()=>{$('hlMsg').textContent='요청 목록을 불러오지 못했습니다.';});
}
</script>

    $('log').innerHTML=''; hist=[];
    bub('ai','대화를 지웠습니다. 새로 시작할게요.');
  }).catch(function(){});
  });

<script>
/* 물어보는 동안 로고가 살짝 움직입니다 */
(function(){
  var b = document.getElementById('send');
  if (!b || b.dataset.busy) return;
  b.dataset.busy = '1';

  var real = window.ask;
  if (typeof real !== 'function') return;

  window.ask = function(){
    b.classList.add('busy');
    var r;
    try { r = real.apply(this, arguments); }
    catch(e){ b.classList.remove('busy'); throw e; }

    if (r && typeof r.finally === 'function') {
      r.finally(function(){ b.classList.remove('busy'); });
    } else {
      setTimeout(function(){ b.classList.remove('busy'); }, 4000);
    }
    return r;
  };
})();
</script>
