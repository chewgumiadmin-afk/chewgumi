<!DOCTYPE html>
<!-- ChewGumi Checkout v1 · 자체 결제 · MedIT -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주문/결제 | CHEWGUMI</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT/fonts/variable/woff2/SUIT-Variable.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://js.tosspayments.com/v2/standard"></script>
<script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<style>
:root{--main:#D82558;--main2:#E95073;--light:#FFE4E6;--sub:#FFE923;--ink:#000;--gray:#797979;
  --line:rgba(255,255,255,.85);--glass:rgba(255,255,255,.62)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"SUIT Variable","SUIT","Noto Sans KR",sans-serif;color:var(--ink);min-height:100vh;padding-bottom:70px;
  background:radial-gradient(900px 500px at 12% -5%,rgba(236,94,134,.14),transparent 60%),
    linear-gradient(180deg,#FFF7FA,#FDF3F5 45%,#FFF9F4)}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--main2);outline-offset:3px;border-radius:8px}
.topbar{height:45px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(90deg,var(--main2),var(--main));color:#fff;font-size:14.5px;font-weight:600}
.head{max-width:960px;margin:0 auto;padding:22px 20px 0;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Poppins',sans-serif;font-weight:800;font-size:20px;color:var(--main)}
.wrap{max-width:960px;margin:0 auto;padding:20px}
h1{font-family:'Poppins',sans-serif;font-size:28px;font-weight:700;margin-bottom:20px}
.cols{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:start}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:16px;
  backdrop-filter:blur(20px) saturate(120%);-webkit-backdrop-filter:blur(20px) saturate(120%);
  box-shadow:0 12px 30px rgba(0,0,0,.07),inset 0 1px 0 rgba(255,255,255,.9)}
.panel h2{font-size:11px;letter-spacing:2.5px;color:var(--gray);font-weight:700;margin-bottom:14px}
label{display:block;font-size:12.5px;font-weight:600;margin:12px 0 6px}
label span{color:var(--main)}
input,textarea{width:100%;padding:12px 14px;border-radius:13px;font-size:13.5px;font-family:inherit;color:var(--ink);
  border:1px solid var(--line);background:rgba(255,255,255,.8)}
textarea{resize:vertical;min-height:70px}
.row2{display:flex;gap:8px}
.row2 input{flex:1}
.btn-sm{flex:none;padding:0 16px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.9);
  font-size:12.5px;font-weight:700}
.item{display:flex;gap:11px;align-items:center;padding:11px 0;border-bottom:1px solid rgba(0,0,0,.06)}
.item:last-of-type{border-bottom:0}
.item .th{width:52px;height:52px;flex:none;border-radius:11px;overflow:hidden;background:var(--light)}
.item .th img{width:100%;height:100%;object-fit:cover;display:block}
.item .c{flex:1;min-width:0}
.item .n{font-size:12.5px;font-weight:600;line-height:1.4}
.item .p{margin-top:3px;font-size:11.5px;color:var(--gray)}
.sum{display:flex;justify-content:space-between;padding:8px 0;font-size:13px;color:var(--gray)}
.sum b{color:var(--ink);font-weight:700;font-size:14px}
.sum.total{margin-top:6px;padding-top:14px;border-top:1.5px solid rgba(0,0,0,.12);font-size:15px;color:var(--ink);font-weight:600}
.sum.total b{font-size:25px;font-weight:800;color:var(--main)}
#payment-method,#agreement{margin-top:6px}
.pay{width:100%;height:56px;margin-top:14px;border:0;border-radius:999px;font-size:15px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,var(--main2),var(--main));box-shadow:0 10px 24px rgba(216,37,88,.32)}
.pay:disabled{opacity:.5;box-shadow:none;cursor:not-allowed}
.msg{font-size:12.5px;color:var(--main);margin-top:10px;min-height:17px;line-height:1.6}
.note{font-size:11.5px;color:var(--gray);line-height:1.8;margin-top:12px}
.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:1px;color:#fff;background:#3182F6;
  padding:4px 11px;border-radius:999px;margin-bottom:10px}
.done{text-align:center;padding:50px 20px}
.done h2{font-size:22px;font-weight:700;margin-bottom:10px;letter-spacing:0;color:var(--ink)}
.done p{font-size:13.5px;color:var(--gray);line-height:1.9}
.done .no{display:inline-block;margin-top:14px;padding:12px 22px;border-radius:14px;background:rgba(255,255,255,.85);
  border:1px solid var(--line);font-weight:700;font-size:14px}
.done a.home{display:inline-block;margin-top:22px;padding:14px 30px;border-radius:999px;font-size:13.5px;font-weight:700;
  color:#fff;background:linear-gradient(135deg,var(--main2),var(--main))}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="topbar">주문/결제</div>
<div class="head"><a class="logo" href="index.html">CHEW GUMI</a><a href="cart.html" style="font-size:12.5px;color:var(--gray)">← 장바구니</a></div>

<div class="wrap">
  <div id="main">
    <h1>Checkout</h1>
    <div class="cols">
      <div>
        <div class="panel">
          <h2>ORDERER · 주문자 정보</h2>
          <label>이름 <span>*</span></label><input id="fName" autocomplete="name">
          <label>휴대전화 <span>*</span></label><input id="fPhone" inputmode="tel" placeholder="010-0000-0000" autocomplete="tel">
          <label>이메일</label><input id="fEmail" type="email" autocomplete="email">
        </div>
        <div class="panel">
          <h2>SHIPPING · 배송지</h2>
          <label>우편번호</label>
          <div class="row2"><input id="fZip" readonly><button class="btn-sm" onclick="findAddr()">주소 찾기</button></div>
          <label>주소</label><input id="fAddr1" readonly>
          <label>상세주소</label><input id="fAddr2" autocomplete="address-line2">
          <label>배송 메모</label><textarea id="fMemo" placeholder="예) 부재 시 경비실에 맡겨주세요"></textarea>
        </div>
      </div>
      <div>
        <div class="panel">
          <h2>ORDER · 주문 상품</h2>
          <div id="items"></div>
          <div class="sum"><span>총 상품금액</span><b id="sGoods">₩0</b></div>
          <div class="sum"><span>배송비</span><b>무료</b></div>
          <div class="sum total"><span>결제 예정 금액</span><b id="sPay">₩0</b></div>
        </div>
        <div class="panel">
          <span class="badge" id="envBadge">TEST</span>
          <h2>PAYMENT · 결제수단</h2>
          <div id="payment-method"></div>
          <div id="agreement"></div>
          <button class="pay" id="payBtn" disabled>결제하기</button>
          <div class="msg" id="msg"></div>
          <div class="note">결제 정보는 토스페이먼츠를 통해 안전하게 처리되며, 주문 내역은 츄구미 서버에 저장됩니다.
            결제 금액은 서버에서 재계산되어 위·변조가 차단됩니다.</div>
        </div>
      </div>
    </div>
  </div>

  <div id="done" style="display:none">
    <div class="panel done">
      <h2>주문이 완료되었습니다</h2>
      <p>결제가 정상적으로 승인되었습니다.<br>주문 내역은 입력하신 연락처로 안내드립니다.</p>
      <div class="no" id="doneNo"></div>
      <br><a class="home" href="mypage.html">주문 내역 보기</a>
      <a class="home" href="index.html" style="background:rgba(255,255,255,.8);color:var(--ink);border:1px solid var(--line);margin-left:8px">쇼핑 계속하기</a>
    </div>
  </div>
</div>

<script>
const SB='https://psynvpuedzjvytsgdhgg.supabase.co';
const KEY='sb_publishable_Tz7vgJXgYHQ3tyUfm87WTw_vV1Dxfuk';
const FN=SB+'/functions/v1/order';
const CDN='https://chewgumi.com/web/product/medium/';
/* 토스 테스트 키 — 계약 후 발급받은 라이브 클라이언트 키로 교체하세요 */
const TOSS_CLIENT_KEY='test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm';

const won=v=>'₩'+Number(v).toLocaleString();
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const $=id=>document.getElementById(id);

let CART=[]; try{CART=JSON.parse(localStorage.getItem('cg_cart')||'[]');}catch(e){}
let PRODS={}, amount=0, widgets=null;

function matchId(name){
  const s=String(name||'');
  if(s.includes('트래블잇')||s.toLowerCase().includes('travel')){
    const m=s.match(/\[(\d+)봉\]/); const map={'1':15,'3':11,'5':12,'10':13,'20':14};
    return (m&&map[m[1]])||11;}
  if(s.includes('레몬민트'))return 16;
  if(s.includes('그레이프'))return 17;
  const m2=s.match(/(\d+)개입/); const map2={'4':18,'6':19,'10':20,'20':21};
  return (m2&&map2[m2[1]])||18;
}

function findAddr(){
  if(!window.daum||!daum.Postcode){$('fAddr1').readOnly=false;return;}
  new daum.Postcode({oncomplete:d=>{$('fZip').value=d.zonecode;
    $('fAddr1').value=d.roadAddress||d.jibunAddress;$('fAddr2').focus();}}).open();
}

async function fillProfile(){
  let tk=null; try{const s=JSON.parse(localStorage.getItem('cg_sb')||'null'); if(s)tk=s.t;}catch(e){}
  if(!tk)return;
  try{
    const r=await fetch(SB+'/rest/v1/profiles?select=name,phone,zipcode,addr1,addr2&limit=1',
      {headers:{apikey:KEY,Authorization:'Bearer '+tk}});
    const [p]=await r.json();
    if(!p)return;
    if(p.name)$('fName').value=p.name;
    if(p.phone)$('fPhone').value=p.phone;
    if(p.zipcode)$('fZip').value=p.zipcode;
    if(p.addr1)$('fAddr1').value=p.addr1;
    if(p.addr2)$('fAddr2').value=p.addr2;
  }catch(e){}
}
async function init(){
  fillProfile();
  if(!CART.length){$('items').innerHTML='<div style="padding:26px 0;text-align:center;color:var(--gray);font-size:13px">장바구니가 비어 있습니다</div>';return;}
  const r=await fetch(SB+'/rest/v1/products?select=id,name,price_sale,image,stock,active',
    {headers:{apikey:KEY,Authorization:'Bearer '+KEY}});
  const list=await r.json();
  list.forEach(p=>PRODS[p.id]=p);

  let goods=0;
  $('items').innerHTML=CART.map(it=>{
    const id=matchId(it.name), p=PRODS[id];
    if(!p)return '';
    goods+=p.price_sale*it.qty;
    return '<div class="item"><div class="th"><img src="'+CDN+p.image+'" alt=""></div>'
      +'<div class="c"><div class="n">'+esc(p.name)+'</div>'
      +'<div class="p">'+won(p.price_sale)+' × '+it.qty+'개'
      +(p.stock<it.qty?' <b style="color:#c0395c">· 재고부족</b>':'')+'</div></div></div>';
  }).join('');
  amount=goods;
  $('sGoods').textContent=won(goods);
  $('sPay').textContent=won(goods);

  const toss=TossPayments(TOSS_CLIENT_KEY);
  widgets=toss.widgets({customerKey:TossPayments.ANONYMOUS});
  await widgets.setAmount({currency:'KRW',value:amount});
  await Promise.all([
    widgets.renderPaymentMethods({selector:'#payment-method',variantKey:'DEFAULT'}),
    widgets.renderAgreement({selector:'#agreement',variantKey:'AGREEMENT'})
  ]);
  $('envBadge').textContent=TOSS_CLIENT_KEY.startsWith('test_')?'TEST':'LIVE';
  $('payBtn').disabled=false;
}

$('payBtn').addEventListener('click',async()=>{
  const buyer={name:$('fName').value.trim(),phone:$('fPhone').value.trim(),email:$('fEmail').value.trim(),
    zipcode:$('fZip').value.trim(),addr1:$('fAddr1').value.trim(),addr2:$('fAddr2').value.trim(),memo:$('fMemo').value.trim()};
  if(!buyer.name||!buyer.phone){$('msg').textContent='이름과 휴대전화를 입력해 주세요.';return;}
  if(!buyer.addr1){$('msg').textContent='배송지 주소를 입력해 주세요.';return;}
  $('payBtn').disabled=true;$('msg').textContent='주문서를 생성하는 중…';

  const items=CART.map(it=>({id:matchId(it.name),qty:it.qty}));
  let od;
  try{
    let tk=null; try{const s=JSON.parse(localStorage.getItem('cg_sb')||'null'); if(s)tk=s.t;}catch(e){}
    const hd={'Content-Type':'application/json',apikey:KEY};
    if(tk)hd.Authorization='Bearer '+tk;
    const res=await fetch(FN,{method:'POST',headers:hd,
      body:JSON.stringify({action:'create',buyer,items})});
    od=await res.json();
    if(!res.ok){$('msg').textContent=od.error||'주문 생성에 실패했습니다.';$('payBtn').disabled=false;return;}
  }catch(e){$('msg').textContent='서버 연결에 실패했습니다.';$('payBtn').disabled=false;return;}

  $('msg').textContent='';
  try{
    await widgets.requestPayment({
      orderId:od.orderNo,
      orderName:CART[0].name+(CART.length>1?' 외 '+(CART.length-1)+'건':''),
      customerName:buyer.name,
      customerMobilePhone:buyer.phone.replace(/[^0-9]/g,''),
      successUrl:location.origin+location.pathname+'?ok=1',
      failUrl:location.origin+location.pathname+'?fail=1'
    });
  }catch(e){$('payBtn').disabled=false;$('msg').textContent='결제가 취소되었습니다.';}
});

/* 결제 인증 후 리턴 → 서버 승인 */
(async function(){
  const q=new URLSearchParams(location.search);
  if(q.get('fail')){$('msg').textContent='결제에 실패했습니다. 다시 시도해 주세요.';}
  if(!q.get('ok'))return init();
  const paymentKey=q.get('paymentKey'),orderId=q.get('orderId'),amt=q.get('amount');
  $('main').style.display='none';
  try{
    const res=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},
      body:JSON.stringify({action:'confirm',paymentKey,orderId,amount:Number(amt)})});
    const d=await res.json();
    if(res.ok&&d.ok){
      try{localStorage.removeItem('cg_cart');}catch(e){}
      $('done').style.display='block';
      $('doneNo').textContent='주문번호 '+d.orderNo;
    }else{
      $('done').style.display='block';
      $('done').innerHTML='<div class="panel done"><h2>결제 승인에 실패했습니다</h2><p>'
        +esc(d.error||'')+'<br>결제가 진행되었다면 고객센터로 문의해 주세요.</p>'
        +'<a class="home" href="cart.html">장바구니로</a></div>';
    }
  }catch(e){
    $('done').style.display='block';
    $('done').innerHTML='<div class="panel done"><h2>서버 연결 실패</h2><p>잠시 후 다시 시도해 주세요.</p>'
      +'<a class="home" href="cart.html">장바구니로</a></div>';
  }
})();
</script>
</body>
</html>
