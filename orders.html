<!DOCTYPE html>
<!-- ChewGumi Order Dashboard v1 · MedIT -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>주문 관리 | CHEWGUMI ADMIN</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT/fonts/variable/woff2/SUIT-Variable.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--main:#D82558;--main2:#E95073;--light:#FFE4E6;--ink:#000;--gray:#797979;
  --line:rgba(255,255,255,.85);--glass:rgba(255,255,255,.62)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"SUIT Variable","SUIT","Noto Sans KR",sans-serif;color:var(--ink);min-height:100vh;padding:26px 16px 70px;
  background:radial-gradient(900px 500px at 12% -5%,rgba(236,94,134,.14),transparent 60%),
    linear-gradient(180deg,#FFF7FA,#FDF3F5 45%,#FFF9F4)}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--main2);outline-offset:3px;border-radius:8px}
.wrap{max-width:1080px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:10px;margin-bottom:20px}
.top h1{font-family:'Poppins',sans-serif;font-size:26px}
.top .s{font-size:11px;letter-spacing:3px;color:var(--gray)}
.top a{font-size:12px;color:var(--gray);text-decoration:underline;text-underline-offset:3px}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:16px;
  backdrop-filter:blur(20px) saturate(120%);-webkit-backdrop-filter:blur(20px) saturate(120%);
  box-shadow:0 12px 30px rgba(0,0,0,.07),inset 0 1px 0 rgba(255,255,255,.9)}
.panel h2{font-size:11px;letter-spacing:2.5px;color:var(--gray);font-weight:700;margin-bottom:14px}
input,select{width:100%;padding:12px 14px;margin-bottom:9px;border-radius:13px;font-size:13.5px;font-family:inherit;
  border:1px solid var(--line);background:rgba(255,255,255,.8)}
.btn{padding:13px 22px;border:0;border-radius:999px;font-size:13px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--main2),var(--main));box-shadow:0 8px 20px rgba(216,37,88,.3)}
.btn.ghost{background:rgba(255,255,255,.8);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.msg{font-size:12px;color:var(--gray);margin-top:8px;min-height:16px}
/* 통계 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:16px;padding:16px}
.stat .l{font-size:11.5px;color:var(--gray)}
.stat .v{margin-top:6px;font-size:22px;font-weight:800;color:var(--main)}
.stat .u{font-size:11px;color:var(--gray);margin-left:3px;font-weight:500}
/* 필터 */
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.65);
  font-size:12px;font-weight:600;color:var(--gray)}
.tabs button.on{background:linear-gradient(135deg,var(--main2),var(--main));color:#fff;border-color:transparent}
/* 주문 카드 */
.o{border-bottom:1px solid rgba(0,0,0,.07);padding:15px 2px}
.o:last-child{border-bottom:0}
.o-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.o-no{font-family:'Poppins',sans-serif;font-weight:700;font-size:13.5px}
.o-d{font-size:11.5px;color:var(--gray)}
.st{font-size:10.5px;font-weight:700;letter-spacing:.5px;padding:5px 11px;border-radius:999px;color:#fff}
.st.pending{background:#999}.st.paid{background:#3182F6}.st.preparing{background:#E9A23B}
.st.shipping{background:#7B61FF}.st.delivered{background:#2AA060}
.st.cancelled,.st.refunded{background:#C0395C}
.o-b{margin-top:9px;font-size:12.5px;line-height:1.75;color:#444}
.o-b b{color:var(--ink)}
.o-amt{font-size:15px;font-weight:800;color:var(--main)}
.o-act{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap;align-items:center}
.o-act select,.o-act input{width:auto;margin:0;padding:9px 12px;font-size:12px;border-radius:11px}
.o-act .mini{padding:9px 15px;border-radius:999px;font-size:11.5px;font-weight:700;
  background:rgba(255,255,255,.85);border:1px solid var(--line);color:var(--ink)}
.empty{padding:44px 0;text-align:center;color:var(--gray);font-size:13px}
.hide{display:none}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}

.mini.rf{color:#C0395C;border-color:rgba(192,57,92,.35)}
.rdim{position:fixed;inset:0;background:rgba(20,10,14,.45);backdrop-filter:blur(5px);z-index:1400;
  display:none;align-items:center;justify-content:center;padding:20px}
.rdim.on{display:flex}
.rbox{width:100%;max-width:400px;border-radius:22px;padding:24px;background:rgba(255,255,255,.92);
  border:1px solid var(--line);box-shadow:0 22px 54px rgba(0,0,0,.2)}
.rbox h3{font-size:19px;font-weight:700;margin-bottom:5px}
.rsub{font-size:12px;color:var(--gray);margin-bottom:14px;line-height:1.6}
.rbox label{display:block;font-size:12px;font-weight:600;margin:10px 0 5px}
.rhint{font-size:11px;color:var(--gray);margin-top:-4px;line-height:1.6}
.racc{margin-top:12px;font-size:12px;color:var(--gray)}
.racc summary{cursor:pointer;padding:8px 0;font-weight:600}
.ract{display:flex;gap:8px;margin-top:16px}
.ract .btn{flex:1;padding:13px 0}
.btn.danger{background:linear-gradient(135deg,#D9536F,#C0395C);box-shadow:0 8px 20px rgba(192,57,92,.3)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.mini.sh{color:#2AA060;border-color:rgba(42,160,96,.35)}
.o-act a.mini{display:inline-flex;align-items:center;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>Order Dashboard</h1><div class="s">CHEWGUMI ADMIN</div></div>
    <div><a href="admin.html">게시판 관리</a> · <a href="index.html">사이트</a></div>
  </div>

  <!-- 로그인 -->
  <div class="panel" id="login">
    <h2>ADMIN LOGIN</h2>
    <input id="em" type="email" placeholder="운영자 이메일" autocomplete="email">
    <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
    <button class="btn" onclick="doLogin()">로그인</button>
    <div class="msg" id="lmsg"></div>
  </div>

  <div id="area" class="hide">
    <div class="panel">
      <h2>매출 현황</h2>
      <div class="stats">
        <div class="stat"><div class="l">오늘 결제</div><div class="v"><span id="tAmt">0</span><span class="u">원</span></div><div class="l"><span id="tCnt">0</span>건</div></div>
        <div class="stat"><div class="l">이번 달 결제</div><div class="v"><span id="mAmt">0</span><span class="u">원</span></div><div class="l"><span id="mCnt">0</span>건</div></div>
        <div class="stat"><div class="l">배송 준비</div><div class="v" id="cPrep">0</div><div class="l">건</div></div>
        <div class="stat"><div class="l">배송 중</div><div class="v" id="cShip">0</div><div class="l">건</div></div>
      </div>
    </div>

    <div class="panel">
      <h2>주문 목록</h2>
      <div class="tabs">
        <button class="on" data-s="all" onclick="setS('all')">전체</button>
        <button data-s="paid" onclick="setS('paid')">결제완료</button>
        <button data-s="preparing" onclick="setS('preparing')">배송준비</button>
        <button data-s="shipping" onclick="setS('shipping')">배송중</button>
        <button data-s="delivered" onclick="setS('delivered')">배송완료</button>
        <button data-s="pending" onclick="setS('pending')">미결제</button>
      </div>
      <div class="panel" style="margin-bottom:16px">
      <h2>무통장입금 계좌</h2>
      <div class="msg" id="bkMsg" style="margin-top:0">주문서에 표시되는 계좌 정보입니다.</div>
      <div style="display:grid;grid-template-columns:1fr 1.6fr 1fr .7fr;gap:9px;margin-top:10px">
        <input id="bkName" placeholder="은행명">
        <input id="bkNo" placeholder="계좌번호">
        <input id="bkHolder" placeholder="예금주">
        <input id="bkDays" type="number" min="1" placeholder="입금기한(일)">
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
        <button class="mini" onclick="bankSave()">저장</button>
        <button class="mini" onclick="bankSync()">공식몰에서 가져오기</button>
      </div>
    </div>
    <div class="panel" style="margin-bottom:16px">
      <h2>CAFE24 · 공식몰 주문</h2>
      <div id="c24Status" class="msg" style="margin-top:0">연동 상태 확인 중…</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px">
        <button class="mini" onclick="c24Sync(30)">최근 30일 가져오기</button>
        <button class="mini" onclick="c24Sync(90)">최근 90일</button>
        <button class="mini" onclick="c24List()">가져온 주문 보기</button>
        <a class="mini" id="c24Auth" href="#" target="_blank" rel="noopener" style="display:none">카페24 연동하기</a>
      </div>
      <div id="c24List" style="margin-top:12px"></div>
    </div>
    <div id="list"><div class="empty">불러오는 중…</div></div>
    </div>

    <div class="panel">
      <h2>계정</h2>
      <div class="msg" id="who" style="margin-top:0"></div>
      <button class="btn ghost" onclick="doLogout()" style="max-width:150px">로그아웃</button>
    </div>
  </div>
</div>

<div class="rdim" id="rdim" onclick="if(event.target===this)closeRefund()">
  <div class="rbox">
    <h3>환불 처리</h3>
    <div class="rsub" id="rSub"></div>
    <label>환불 금액 (원)</label>
    <input id="rAmt" inputmode="numeric">
    <div class="rhint">전액 환불하려면 그대로 두고, 부분 환불은 금액을 줄여서 입력하세요.</div>
    <label>환불 사유</label>
    <input id="rReason" placeholder="예) 고객 변심, 상품 불량">
    <details class="racc">
      <summary>환불 계좌 입력 (가상계좌·계좌이체 결제일 때만)</summary>
      <input id="rBank" placeholder="은행코드 (예: 국민 04, 신한 88, 우리 20)">
      <input id="rAccNo" placeholder="계좌번호 (숫자만)">
      <input id="rHolder" placeholder="예금주">
    </details>
    <div class="ract">
      <button class="btn ghost" onclick="closeRefund()">닫기</button>
      <button class="btn danger" id="rGo" onclick="doRefund()">환불 실행</button>
    </div>
    <div class="msg" id="rMsg"></div>
  </div>
</div>

<script>
const SB='https://psynvpuedzjvytsgdhgg.supabase.co';
const KEY='sb_publishable_Tz7vgJXgYHQ3tyUfm87WTw_vV1Dxfuk';
const ST={pending:'미결제',paid:'결제완료',preparing:'배송준비',shipping:'배송중',
  delivered:'배송완료',cancelled:'취소',refunded:'환불'};
let token=null,who='',filt='all',ORD=[];
try{const s=JSON.parse(localStorage.getItem('cg_sb')||'null');if(s){token=s.t;who=s.u;}}catch(e){}
const $=id=>document.getElementById(id);
const won=v=>Number(v||0).toLocaleString();
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);

function sync(){const on=!!token;
  $('login').classList.toggle('hide',on);$('area').classList.toggle('hide',!on);
  if(on){$('who').textContent=who+' 님으로 로그인 중입니다.';c24Status();bankLoad();load();}}

function doLogin(){
  const email=$('em').value.trim(),pw=$('pw').value;
  if(!email||!pw)return $('lmsg').textContent='이메일과 비밀번호를 입력해 주세요.';
  fetch(SB+'/auth/v1/token?grant_type=password',{method:'POST',
    headers:{apikey:KEY,'Content-Type':'application/json'},
    body:JSON.stringify({email,password:pw})})
  .then(r=>r.json()).then(d=>{
    if(d.access_token){token=d.access_token;who=email.split('@')[0];
      try{localStorage.setItem('cg_sb',JSON.stringify({t:token,u:who}));}catch(e){}
      $('lmsg').textContent='';sync();}
    else $('lmsg').textContent='로그인 실패: 계정을 확인하거나 가입 메일 인증을 완료해 주세요.';
  }).catch(()=>$('lmsg').textContent='네트워크 오류가 발생했습니다.');
}
function doLogout(){token=null;who='';try{localStorage.removeItem('cg_sb');}catch(e){}sync();}

function load(){
  fetch(SB+'/rest/v1/orders?select=*,order_items(product_name,qty,unit_price),refunds(amount,reason,created_at)&order=created_at.desc&limit=200',
    {headers:{apikey:KEY,Authorization:'Bearer '+token}})
  .then(r=>r.ok?r.json():Promise.reject(r.status))
  .then(rows=>{ORD=rows;stats();render();})
  .catch(s=>{$('list').innerHTML='<div class="empty">'+(s===401?'로그인이 만료되었습니다. 다시 로그인해 주세요.':'주문을 불러오지 못했습니다. 운영자 계정인지 확인해 주세요.')+'</div>';});
}

function stats(){
  const today=new Date().toISOString().slice(0,10);
  const month=today.slice(0,7);
  const paidL=['paid','preparing','shipping','delivered'];
  let ta=0,tc=0,ma=0,mc=0,cp=0,cs=0;
  ORD.forEach(o=>{
    const d=(o.paid_at||o.created_at||'').slice(0,10);
    if(paidL.includes(o.status)){
      if(d===today){ta+=o.pay_amount;tc++;}
      if(d.slice(0,7)===month){ma+=o.pay_amount;mc++;}
    }
    if(o.status==='preparing'||o.status==='paid')cp++;
    if(o.status==='shipping')cs++;
  });
  $('tAmt').textContent=won(ta);$('tCnt').textContent=tc;
  $('mAmt').textContent=won(ma);$('mCnt').textContent=mc;
  $('cPrep').textContent=cp;$('cShip').textContent=cs;
}

function setS(s){filt=s;
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.s===s));
  render();}

function render(){
  const rows=ORD.filter(o=>filt==='all'||o.status===filt);
  if(!rows.length){$('list').innerHTML='<div class="empty">주문 내역이 없습니다.</div>';return;}
  $('list').innerHTML=rows.map(o=>{
    const its=(o.order_items||[]).map(i=>esc(i.product_name)+' × '+i.qty).join(', ');
    return '<div class="o"><div class="o-h">'
      +'<div><span class="o-no">'+esc(o.order_no)+'</span> '
      +'<span class="st '+o.status+'">'+(ST[o.status]||o.status)+'</span><br>'
      +'<span class="o-d">'+new Date(o.created_at).toLocaleString('ko-KR')+'</span></div>'
      +'<div class="o-amt">₩'+won(o.pay_amount)+'</div></div>'
      +'<div class="o-b"><b>'+esc(o.buyer_name)+'</b> · '+esc(o.buyer_phone)
      +(o.buyer_email?' · '+esc(o.buyer_email):'')+'<br>'
      +(o.addr1?'['+esc(o.zipcode)+'] '+esc(o.addr1)+' '+esc(o.addr2)+'<br>':'')
      +(o.memo?'메모: '+esc(o.memo)+'<br>':'')
      +'상품: '+its+(o.pay_method?'<br>결제수단: '+esc(o.pay_method):'')
      +(o.tracking_no?'<br>운송장: '+esc(o.courier)+' '+esc(o.tracking_no):'')
      +(o.track_status?'<br>배송상태: <b>'+esc(o.track_status)+'</b>'
        +(o.track_checked_at?' ('+new Date(o.track_checked_at).toLocaleString('ko-KR')+' 확인)':''):'')
      +(o.cash_receipt_no?'<br>현금영수증 발급됨':'')
      +(o.refund_amount>0?'<br><b style="color:#C0395C">환불 ₩'+won(o.refund_amount)+'</b>'
        +(o.refund_amount<o.pay_amount?' (부분) · 잔액 ₩'+won(o.pay_amount-o.refund_amount):' (전액)')
        +(o.refund_reason?' · '+esc(o.refund_reason):''):'')+'</div>'
      +'<div class="o-act">'
      +'<select id="st'+o.id+'">'+Object.keys(ST).map(k=>'<option value="'+k+'"'+(k===o.status?' selected':'')+'>'+ST[k]+'</option>').join('')+'</select>'
      +'<select id="cc'+o.id+'" style="width:118px">'+COURIERS.map(c=>'<option value="'+c.c+'"'+(c.c===o.courier_code?' selected':'')+'>'+c.n+'</option>').join('')+'</select>'
      +'<input id="tn'+o.id+'" placeholder="운송장번호" value="'+esc(o.tracking_no)+'" style="width:150px">'
      +'<button class="mini" onclick="save('+o.id+')">저장</button>'
      +'<button class="mini" onclick="editAddr(\''+o.order_no+'\')">배송지수정</button>'
      +'<button class="mini" onclick="showLogs(\''+o.order_no+'\')">수정이력</button>'
      +(['pending','paid','preparing'].includes(o.status)
        ?'<button class="mini rf" onclick="doCancel(\''+o.order_no+'\')">주문취소</button>':'')
      +'<button class="mini sh" onclick="ship(\''+o.order_no+'\','+o.id+')">발송처리+알림</button>'
      +(o.tracking_no?'<button class="mini" onclick="track(\''+o.order_no+'\')">배송조회</button>':'')
      +(['paid','preparing','shipping','delivered'].includes(o.status)&&!o.cash_receipt_no
        ?'<button class="mini" onclick="openCash(\''+o.order_no+'\')">현금영수증</button>':'')
      +(o.cash_receipt_url?'<a class="mini" href="'+esc(o.cash_receipt_url)+'" target="_blank" rel="noopener">영수증 보기</a>':'')
      +(['paid','preparing','shipping','delivered'].includes(o.status)&&(o.pay_amount-(o.refund_amount||0))>0
        ?'<button class="mini rf" onclick="openRefund(\''+o.order_no+'\','+(o.pay_amount-(o.refund_amount||0))+')">환불</button>':'')
      +'</div></div>';
  }).join('');
}

function save(id){
  /* 운송장·택배사 변경은 서버에 이력이 함께 기록됩니다 */
  const cc=$('cc'+id).value;
  const body={status:$('st'+id).value,courier_code:cc,
    courier:(COURIERS.find(c=>c.c===cc)||{}).n||'',tracking_no:$('tn'+id).value.trim()};
  fetch(SB+'/rest/v1/orders?id=eq.'+id,{method:'PATCH',
    headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json',Prefer:'return=minimal'},
    body:JSON.stringify(body)})
  .then(r=>{if(r.ok)load();
    else alert(r.status===401?'로그인이 만료되었습니다.':'저장 권한이 없습니다. 운영자 계정으로 로그인해 주세요.');})
  .catch(()=>alert('네트워크 오류가 발생했습니다.'));
}
const COURIERS=[{c:'',n:'택배사 선택'},{c:'04',n:'CJ대한통운'},{c:'05',n:'한진택배'},
  {c:'08',n:'롯데택배'},{c:'01',n:'우체국택배'},{c:'06',n:'로젠택배'},{c:'11',n:'일양로지스'},
  {c:'46',n:'CU 편의점'},{c:'23',n:'경동택배'}];
const FNU=SB+'/functions/v1/order';
function call(payload){
  return fetch(FNU,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,
    Authorization:'Bearer '+token},body:JSON.stringify(payload)})
    .then(r=>r.json().then(d=>({ok:r.ok,d})));
}
function ship(no,id){
  const cc=$('cc'+id).value, tn=$('tn'+id).value.trim();
  if(!tn)return alert('운송장 번호를 입력해 주세요.');
  if(!confirm('발송 처리하고 고객에게 알림을 보냅니다. 진행할까요?'))return;
  call({action:'ship',orderId:no,courierCode:cc,
    courier:(COURIERS.find(c=>c.c===cc)||{}).n||'택배',trackingNo:tn})
  .then(({ok,d})=>{if(ok&&d.ok){alert('발송 처리되었습니다.');load();}else alert(d.error||'처리에 실패했습니다.');})
  .catch(()=>alert('네트워크 오류가 발생했습니다.'));
}
function track(no){
  call({action:'track',orderId:no}).then(({ok,d})=>{
    if(!ok)return alert(d.error||'배송 조회에 실패했습니다.');
    const lines=(d.details||[]).map(x=>'· '+(x.timeString||'')+' '+(x.where||'')+' '+(x.kind||'')).join('\n');
    alert('배송 상태: '+(d.last||'-')+(d.complete?' (배송완료)':'')+'\n\n'+lines);
    load();
  }).catch(()=>alert('네트워크 오류가 발생했습니다.'));
}
function openCash(no){
  const num=prompt('현금영수증 발급 번호를 입력하세요.\n(개인: 휴대폰번호 / 사업자: 사업자등록번호)');
  if(!num)return;
  const biz=confirm('사업자 지출증빙으로 발급할까요?\n[확인] 지출증빙  /  [취소] 소득공제');
  call({action:'cashReceipt',orderId:no,registrationNumber:num,type:biz?'business':'person'})
  .then(({ok,d})=>{if(ok&&d.ok){alert('현금영수증이 발급되었습니다.');load();}
    else alert(d.error||'발급에 실패했습니다.');})
  .catch(()=>alert('네트워크 오류가 발생했습니다.'));
}
let rOrder=null;
function bankLoad(){
  fetch(SB_URL+'/rest/v1/shop_settings?select=key,value&key=in.(bank_name,bank_account,bank_holder,deposit_days)',
    {headers:{apikey:SB_KEY,Authorization:'Bearer '+token}})
  .then(r=>r.ok?r.json():[]).then(rows=>{
    const o={}; (rows||[]).forEach(r=>o[r.key]=r.value);
    $('bkName').value=o.bank_name||''; $('bkNo').value=o.bank_account||'';
    $('bkHolder').value=o.bank_holder||''; $('bkDays').value=o.deposit_days||3;
  }).catch(()=>{});
}
function bankSave(){
  $('bkMsg').textContent='저장 중…';
  c24Call({action:'bankSave',bank_name:$('bkName').value.trim(),
    bank_account:$('bkNo').value.trim(),bank_holder:$('bkHolder').value.trim(),
    deposit_days:$('bkDays').value||3}).then(({ok,d})=>{
    $('bkMsg').textContent=ok?'저장되었습니다. 주문서에 바로 반영됩니다.':(d.error||'저장에 실패했습니다.');
  }).catch(()=>{$('bkMsg').textContent='네트워크 오류가 발생했습니다.';});
}
function bankSync(){
  $('bkMsg').textContent='공식몰에서 계좌 정보를 가져오는 중…';
  c24Call({action:'bankSync'}).then(({ok,d})=>{
    if(!ok){
      if(d.needAuth){ $('bkMsg').innerHTML='카페24 연동이 필요합니다. 아래 [카페24 연동하기]를 먼저 눌러주세요.'; return; }
      $('bkMsg').textContent=d.error||'가져오지 못했습니다.'; return;
    }
    if(!d.found){ $('bkMsg').textContent=d.message||'공식몰에 등록된 계좌를 찾지 못했습니다. 직접 입력해 주세요.'; return; }
    $('bkName').value=d.bank_name||''; $('bkNo').value=d.bank_account||'';
    $('bkHolder').value=d.bank_holder||'';
    $('bkMsg').textContent='공식몰 계좌 정보를 가져왔습니다.'+(d.count>1?' (등록된 계좌 '+d.count+'개 중 첫 번째)':'');
  }).catch(()=>{$('bkMsg').textContent='네트워크 오류가 발생했습니다.';});
}
const FN_C24 = SB_URL + '/functions/v1/cafe24';
function c24Call(p){
  return fetch(FN_C24,{method:'POST',
    headers:{apikey:SB_KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},
    body:JSON.stringify(p)}).then(r=>r.json().then(d=>({ok:r.ok,d})));
}
function c24Status(){
  c24Call({action:'status'}).then(({ok,d})=>{
    const s=$('c24Status'), a=$('c24Auth');
    if(!ok) { s.textContent='연동 상태를 확인하지 못했습니다.'; return; }
    if(d.connected){
      s.innerHTML='공식몰과 연동되어 있습니다. 가져온 주문 <b>'+(d.orderCount||0)+'건</b>';
      a.style.display='none';
    } else {
      s.innerHTML='아직 연동되지 않았습니다. <b>[카페24 연동하기]</b>를 눌러 승인해 주세요.';
      a.href=d.authUrl||FN_C24; a.style.display='inline-flex';
    }
  }).catch(()=>{$('c24Status').textContent='연동 상태를 확인하지 못했습니다.';});
}
function c24Sync(days){
  $('c24Status').textContent='공식몰 주문을 가져오는 중…';
  c24Call({action:'sync',days}).then(({ok,d})=>{
    if(!ok){
      if(d.needAuth){ $('c24Status').innerHTML='연동이 필요합니다. <b>[카페24 연동하기]</b>를 눌러주세요.';
        $('c24Auth').href=d.authUrl||FN_C24; $('c24Auth').style.display='inline-flex'; return; }
      $('c24Status').textContent=d.error||'가져오기에 실패했습니다.'; return;
    }
    $('c24Status').innerHTML='최근 '+d.days+'일 주문 <b>'+d.saved+'건</b>을 가져왔습니다.';
    c24List();
  }).catch(()=>{$('c24Status').textContent='네트워크 오류가 발생했습니다.';});
}
function c24List(){
  c24Call({action:'list'}).then(({ok,d})=>{
    const box=$('c24List');
    if(!ok||!d.ok){ box.innerHTML='<div class="empty">불러오지 못했습니다.</div>'; return; }
    if(!d.orders.length){ box.innerHTML='<div class="empty">가져온 공식몰 주문이 없습니다.</div>'; return; }
    box.innerHTML=d.orders.map(o=>{
      const its=(o.items||[]).map(i=>esc(i.name)+' × '+i.qty).join(', ');
      return '<div class="o"><div class="o-h">'
        +'<div><span class="o-no">'+esc(o.order_id)+'</span> '
        +'<span class="st">'+esc(o.order_status||'-')+'</span><br>'
        +'<span class="o-d">'+(o.order_date?new Date(o.order_date).toLocaleString('ko-KR'):'')+'</span></div>'
        +'<div class="o-amt">₩'+won(o.payment_amount)+'</div></div>'
        +'<div class="o-b"><b>'+esc(o.receiver_name||o.buyer_name)+'</b> · '+esc(o.receiver_phone||o.buyer_phone)+'<br>'
        +(o.address?'['+esc(o.zipcode)+'] '+esc(o.address)+'<br>':'')
        +(o.memo?'메모: '+esc(o.memo)+'<br>':'')
        +'상품: '+its+(o.pay_method?'<br>결제수단: '+esc(o.pay_method):'')
        +(o.tracking_no?'<br>운송장: '+esc(o.courier)+' '+esc(o.tracking_no):'')+'</div>'
        +'<div class="o-act">'
        +'<input id="c24t'+esc(o.order_id)+'" placeholder="운송장번호" value="'+esc(o.tracking_no)+'" style="width:150px">'
        +'<input id="c24c'+esc(o.order_id)+'" placeholder="택배사코드" value="'+esc(o.courier)+'" style="width:110px">'
        +'<button class="mini" onclick="c24Ship(\''+esc(o.order_id)+'\')">송장 등록</button>'
        +'</div></div>';
    }).join('');
  }).catch(()=>{$('c24List').innerHTML='<div class="empty">네트워크 오류</div>';});
}
function c24Ship(id){
  const t=$('c24t'+id).value.trim(), c=$('c24c'+id).value.trim();
  if(!t) return alert('운송장 번호를 입력해 주세요.');
  $('c24Status').textContent='송장 등록 중…';
  c24Call({action:'ship',orderId:id,trackingNo:t,shippingCompany:c}).then(({ok,d})=>{
    if(ok&&d.ok){ $('c24Status').textContent='공식몰에 송장이 등록되었습니다.'; c24List(); }
    else $('c24Status').textContent=d.error||'등록에 실패했습니다.';
  }).catch(()=>{$('c24Status').textContent='네트워크 오류가 발생했습니다.';});
}
const FN_EDIT = SB_URL + '/functions/v1/order-edit';
function omsg(t){ const e=$('msg')||$('omsg'); if(e) e.textContent=t; else alert(t); }
function callEdit(payload){
  return fetch(FN_EDIT,{method:'POST',
    headers:{apikey:SB_KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},
    body:JSON.stringify(payload)}).then(r=>r.json().then(d=>({ok:r.ok,d})));
}
function doCancel(no){
  const r=prompt('주문 '+no+' 취소\n취소 사유를 입력해 주세요.','고객 요청');
  if(r===null) return;
  if(!confirm('정말 취소할까요?\n재고·적립금·쿠폰이 원상 복구되고 고객에게 안내 문자가 발송됩니다.')) return;
  omsg('취소 처리 중…');
  callEdit({action:'cancel',orderId:no,reason:r}).then(({ok,d})=>{
    if(ok&&d.ok){ omsg('주문이 취소되었습니다.'); load(); }
    else omsg(d.error||'취소에 실패했습니다.');
  }).catch(()=>omsg('네트워크 오류가 발생했습니다.'));
}
function editAddr(no){
  const o=(ORD||[]).find(x=>x.order_no===no); if(!o) return;
  const name=prompt('받는 분 이름', o.buyer_name||''); if(name===null)return;
  const phone=prompt('연락처', o.buyer_phone||''); if(phone===null)return;
  const zip=prompt('우편번호', o.zipcode||''); if(zip===null)return;
  const a1=prompt('주소', o.addr1||''); if(a1===null)return;
  const a2=prompt('상세주소', o.addr2||''); if(a2===null)return;
  const memo=prompt('배송 메모', o.memo||''); if(memo===null)return;
  omsg('변경 중…');
  callEdit({action:'editAddress',orderId:no,buyer_name:name,buyer_phone:phone,
    zipcode:zip,addr1:a1,addr2:a2,memo:memo}).then(({ok,d})=>{
    if(ok&&d.ok){ omsg('배송지가 변경되었습니다.'); load(); }
    else omsg(d.error||'변경에 실패했습니다.');
  }).catch(()=>omsg('네트워크 오류가 발생했습니다.'));
}
function showLogs(no){
  callEdit({action:'logs',orderId:no}).then(({ok,d})=>{
    if(!ok||!d.ok) return omsg(d.error||'이력을 불러오지 못했습니다.');
    if(!d.logs.length) return alert('수정 이력이 없습니다.');
    const A={cancel:'주문취소',address:'배송지변경',shipping:'운송장수정'};
    alert('주문 '+no+' 수정 이력\n\n'+d.logs.map(l=>
      new Date(l.created_at).toLocaleString('ko-KR')+'  '+(A[l.action]||l.action)
      +(l.before_val?'\n  이전: '+l.before_val:'')
      +(l.after_val?'\n  변경: '+l.after_val:'')
      +'\n  처리자: '+l.actor).join('\n\n'));
  }).catch(()=>omsg('네트워크 오류가 발생했습니다.'));
}
function openRefund(no,remain){
  rOrder=no;
  document.getElementById('rSub').textContent='주문 '+no+' · 환불 가능 잔액 ₩'+won(remain);
  document.getElementById('rAmt').value=remain;
  document.getElementById('rReason').value='';
  document.getElementById('rMsg').textContent='';
  document.getElementById('rGo').disabled=false;
  document.getElementById('rdim').classList.add('on');
}
function closeRefund(){document.getElementById('rdim').classList.remove('on');rOrder=null;}
function doRefund(){
  if(!rOrder)return;
  const amt=parseInt(String(document.getElementById('rAmt').value).replace(/[^0-9]/g,''),10);
  const reason=document.getElementById('rReason').value.trim();
  if(!amt||amt<=0)return document.getElementById('rMsg').textContent='환불 금액을 확인해 주세요.';
  if(!confirm('₩'+won(amt)+'을 환불합니다. 되돌릴 수 없습니다. 진행할까요?'))return;
  const btn=document.getElementById('rGo');btn.disabled=true;
  document.getElementById('rMsg').textContent='환불 처리 중…';
  const acc={bank:document.getElementById('rBank').value.trim(),
    accountNumber:document.getElementById('rAccNo').value.replace(/[^0-9]/g,''),
    holderName:document.getElementById('rHolder').value.trim()};
  fetch(SB+'/functions/v1/order',{method:'POST',
    headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+token},
    body:JSON.stringify({action:'cancel',orderId:rOrder,amount:amt,reason,
      refundAccount:acc.accountNumber?acc:undefined})})
  .then(r=>r.json().then(d=>({ok:r.ok,d})))
  .then(({ok,d})=>{
    if(ok&&d.ok){document.getElementById('rMsg').textContent=
      (d.full?'전액':'부분')+' 환불이 완료되었습니다.';setTimeout(()=>{closeRefund();load();},900);}
    else{document.getElementById('rMsg').textContent=d.error||'환불에 실패했습니다.';btn.disabled=false;}
  }).catch(()=>{document.getElementById('rMsg').textContent='네트워크 오류가 발생했습니다.';btn.disabled=false;});
}
sync();
</script>
