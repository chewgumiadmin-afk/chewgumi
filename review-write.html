<!DOCTYPE html>
<!-- ChewGumi Review Write v1 · MedIT -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>후기 남기기 | CHEWGUMI</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fastly.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://fastly.jsdelivr.net/gh/sunn-us/SUIT/fonts/variable/woff2/SUIT-Variable.css">
<link rel="stylesheet" href="assets/cgui.css">
<style>
:root{
  --main:#D82558; --main2:#E95073; --pink:#FFBDCC; --pink-lt:#FFE4E6;
  --ok:#2AA060; --bad:#C0395C; --star:#FFB800;
  --gray:#797979; --ink:#17171c; --line:rgba(255,255,255,.85);
  --sp-s:clamp(0.8rem,0.7rem+0.3vw,1.1rem);
  --sp-m:clamp(1.3rem,1.1rem+0.6vw,2rem);
}
*,*::before,*::after{box-sizing:border-box}
*{margin:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'SUIT Variable','SUIT',-apple-system,BlinkMacSystemFont,
    "Apple SD Gothic Neo",sans-serif;
  color:var(--ink);font-size:clamp(0.94rem,0.9rem+0.2vw,1rem);line-height:1.7;
  min-height:100svh;
  padding:0 0 calc(4rem + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,#FFF9FB,#FDF3F5 45%,#FFFAF6);
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button,input,textarea{font-family:inherit;font-size:16px}
@media(min-width:1024px){button,input,textarea{font-size:14.5px}}
.wrap{max-width:600px;margin:0 auto;padding:0 var(--sp-s)}

.topbar{
  height:45px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(90deg,var(--main2),var(--main));
  color:#fff;font-size:14px;font-weight:500;padding:0 16px;text-align:center;
}
.topbar b{font-weight:800;color:#FFE923}

.hd{padding:var(--sp-m) 0 var(--sp-s);text-align:center}
.hd .eb{font-family:'Poppins','SUIT Variable',sans-serif;
  font-size:11px;letter-spacing:2.6px;color:var(--main);font-weight:700}
.hd h1{font-size:clamp(24px,4vw,32px);font-weight:800;
  letter-spacing:-.04em;margin-top:8px}
.hd p{font-size:14px;color:var(--gray);margin-top:10px;word-break:keep-all}

.panel{
  background:rgba(255,255,255,.72);border:1px solid var(--line);
  border-radius:22px;padding:var(--sp-m);margin-bottom:var(--sp-s);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  box-shadow:0 12px 30px rgba(0,0,0,.07);
}

/* 상품 */
.pr{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.pr img{
  width:64px;height:64px;border-radius:14px;flex:none;
  object-fit:contain;background:#FFF6F8;border:1px solid rgba(0,0,0,.05);
}
.pr b{font-size:15px;font-weight:700;letter-spacing:-.02em;line-height:1.5}

/* 별점 */
.stars{display:flex;gap:5px;justify-content:center;margin:6px 0 4px}
.stars button{
  width:44px;height:44px;border:0;background:transparent;cursor:pointer;
  font-size:30px;line-height:1;color:rgba(0,0,0,.14);
  transition:transform .15s,color .15s;padding:0;
}
.stars button.on{color:var(--star)}
.stars button:active{transform:scale(.9)}
.stars-t{text-align:center;font-size:13px;color:var(--gray);min-height:20px}

label{display:block;font-size:12.5px;font-weight:600;color:#555;margin:16px 0 7px}
textarea{
  width:100%;min-height:110px;padding:14px 16px;border-radius:14px;
  line-height:1.8;resize:vertical;
  border:1px solid var(--line);background:rgba(255,255,255,.94);color:var(--ink);
}
textarea:focus{outline:2px solid var(--main);outline-offset:-1px}
.cnt{text-align:right;font-size:11.5px;color:var(--gray);margin-top:5px}

/* 사진 */
.photo{
  display:flex;align-items:center;gap:12px;
  margin-top:14px;padding:15px 17px;border-radius:16px;
  background:rgba(255,228,230,.5);border:1px solid rgba(255,189,204,.7);
}
.photo .t{flex:1;min-width:0}
.photo .t b{display:block;font-size:13px;font-weight:700;color:var(--main)}
.photo .t span{display:block;font-size:11.5px;color:#8A3350;margin-top:2px}
.photo input{
  width:100%;min-height:42px;padding:10px 13px;border-radius:11px;margin-top:9px;
  border:1px solid rgba(255,255,255,.9);background:#fff;
}

.btn{
  width:100%;min-height:54px;margin-top:20px;border:0;border-radius:999px;
  cursor:pointer;font-size:15px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,var(--main2),var(--main));
  display:inline-flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(216,37,88,.24);
}
.btn:disabled{opacity:.5;cursor:default}
.msg{margin-top:12px;font-size:13.5px;line-height:1.7;min-height:20px;
  color:var(--gray);text-align:center}
.msg.bad{color:var(--bad)}
.msg.ok{color:var(--ok)}

.hint{font-size:12.5px;color:var(--gray);line-height:1.9;margin-top:16px;
  padding:14px 16px;border-radius:14px;background:rgba(0,0,0,.03)}
.hint b{color:var(--ink)}

/* 다 쓴 뒤 */
.done{text-align:center;padding:20px 4px}
.done .ic{
  width:64px;height:64px;margin:0 auto 18px;border-radius:50%;
  background:linear-gradient(135deg,#3FBF7A,#2AA060);
  color:#fff;font-size:30px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 22px rgba(42,160,96,.28);
}
.done h2{font-size:20px;font-weight:800;letter-spacing:-.03em}
.done p{font-size:14px;color:#555;margin-top:10px;word-break:keep-all}
.done a{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:50px;margin-top:22px;padding:0 26px;border-radius:999px;
  background:linear-gradient(135deg,var(--main2),var(--main));
  color:#fff;font-size:14px;font-weight:700;
}
.hide{display:none}
.foot{margin-top:var(--sp-m);text-align:center}
.foot p{font-size:12px;color:var(--gray);line-height:1.9}
</style>
<script src="assets/tok.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/navauth.js" defer></script>
</head>
<body>

<div class="topbar">후기를 남겨주시면 <b>&nbsp;적립금&nbsp;</b> 을 드립니다</div>

<div class="wrap">
  <div class="hd">
    <span class="eb">REVIEW</span>
    <h1>좀 어떠셨나요?</h1>
    <p id="lead">불러오는 중…</p>
  </div>

  <div id="form"></div>

  <div class="panel hide" id="doneBox">
    <div class="done">
      <div class="ic">✓</div>
      <h2>고맙습니다</h2>
      <p>남겨주신 후기는 확인 후 올라갑니다.<br>적립금은 확인이 끝나면 넣어드립니다.</p>
      <a href="index.html">쇼핑하러 가기</a>
    </div>
  </div>

  <div class="foot">
    <p>문의 · chewgumi24@gmail.com</p>
  </div>
</div>

<script src="assets/lite.js" defer></script>
<script>
const SB='https://psynvpuedzjvytsgdhgg.supabase.co';
const FN=SB+'/functions/v1/review-ask';
const KEY='sb_publishable_Tz7vgJXgYHQ3tyUfm87WTw_vV1Dxfuk';
const H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const won=n=>Number(n||0).toLocaleString('ko-KR');

const TK=new URLSearchParams(location.search).get('t')||'';
let ITEMS=[], RATE={};

const WORD={1:'아쉬웠어요',2:'그저 그래요',3:'괜찮아요',4:'좋아요',5:'아주 좋아요'};

function call(p){
  return fetch(FN,{method:'POST',headers:H,body:JSON.stringify(p)}).then(r=>r.json());
}

function load(){
  if(!TK){ $('lead').textContent='주소가 올바르지 않습니다.'; return; }
  call({action:'open',token:TK}).then(function(d){
    if(!d.ok){ $('lead').textContent=d.error||'불러오지 못했습니다.'; return; }
    ITEMS=d.items||[];
    $('lead').innerHTML = esc(d.buyer)+'님, 짧은 한 줄이라도 남겨주시면<br>'
      +'다른 분들께 큰 도움이 됩니다.';
    draw(d);
  }).catch(function(){ $('lead').textContent='불러오지 못했습니다.'; });
}

function draw(d){
  $('form').innerHTML = ITEMS.map(function(it,i){
    RATE[i]=5;
    return '<div class="panel">'
      +'<div class="pr">'
        +(it.image?'<img src="'+esc(it.image)+'" alt="" onerror="this.style.display=\'none\'">':'')
        +'<b>'+esc(it.name)+'</b></div>'
      +'<div class="stars" id="st'+i+'">'
        +[1,2,3,4,5].map(function(n){
          return '<button type="button" onclick="setStar('+i+','+n+')" '
            +'aria-label="'+n+'점">★</button>';
        }).join('')
      +'</div>'
      +'<div class="stars-t" id="sw'+i+'">아주 좋아요</div>'
      +'<label>어떠셨나요</label>'
      +'<textarea id="tx'+i+'" placeholder="맛은 어땠는지, 언제 드셨는지 편하게 적어주세요"'
      +' oninput="cnt('+i+')"></textarea>'
      +'<div class="cnt" id="cn'+i+'">0자</div>'
      +'<div class="photo">'
        +'<div class="t"><b>사진을 넣으시면 '+won(d.reward_photo)+'원</b>'
        +'<span>인스타그램이나 블로그에 올린 사진 주소를 넣어주세요</span>'
        +'<input id="im'+i+'" placeholder="https://..." autocomplete="off"></div>'
      +'</div>'
    +'</div>';
  }).join('')
  + '<button class="btn" onclick="send()" id="btn">후기 남기기</button>'
  + '<div class="msg" id="msg"></div>'
  + '<div class="hint"><b>적립금</b> 글만 '+won(d.reward)+'원 · 사진까지 '+won(d.reward_photo)+'원<br>'
  + '확인 후 넣어드리며, 다음 구매 때 쓰실 수 있습니다.<br><br>'
  + '<b>솔직하게 적어주세요.</b> 아쉬웠던 점도 괜찮습니다.<br>'
  + '있는 그대로가 다른 분들께 도움이 됩니다.</div>';

  ITEMS.forEach(function(_,i){ setStar(i,5); });
}

function setStar(i,n){
  RATE[i]=n;
  const bs=$('st'+i).querySelectorAll('button');
  for(let k=0;k<5;k++) bs[k].classList.toggle('on', k<n);
  $('sw'+i).textContent=WORD[n];
}

function cnt(i){
  const v=$('tx'+i).value.length;
  $('cn'+i).textContent=v+'자'+(v<10?' (10자 이상)':'');
}

function send(){
  const list=[];
  ITEMS.forEach(function(it,i){
    const t=$('tx'+i).value.trim();
    if(t.length>=10) list.push({
      product_id:it.product_id, rating:RATE[i],
      body:t, image_url:$('im'+i).value.trim()
    });
  });
  if(!list.length){ say('후기를 10자 이상 적어주세요.','bad'); return; }

  $('btn').disabled=true; say('보내는 중…');
  call({action:'submit',token:TK,reviews:list}).then(function(d){
    $('btn').disabled=false;
    if(!d.ok){ say(d.error||'보내지 못했습니다.','bad'); return; }
    $('form').classList.add('hide');
    $('doneBox').classList.remove('hide');
    document.querySelector('.hd').classList.add('hide');
    window.scrollTo({top:0,behavior:'smooth'});
  }).catch(function(){ $('btn').disabled=false; say('보내지 못했습니다.','bad'); });
}

function say(t,k){
  const m=$('msg'); if(!m) return;
  m.className='msg'+(k?' '+k:''); m.textContent=t;
}

load();
</script>
<!-- 챗봇 상담 — 공용 (assets/bot.css + assets/bot.js) -->
<link rel="stylesheet" href="assets/bot.css">
<script src="assets/bot.js" defer></script>
</body>
</html>
