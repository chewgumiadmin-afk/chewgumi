<!DOCTYPE html>
<!-- ChewGumi Drive Assets · MedIT -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>드라이브 자료 | CHEWGUMI</title>
<script src="assets/guard.js" defer></script>
<script src="assets/drive.js" defer></script>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<script src="assets/auth.js"></script>
<script src="assets/site.js"></script>
<style>
:root{
  --main:#D82558; --main2:#E95073; --ok:#2AA060; --bad:#C0395C;
  --gray:#7a7a82; --ink:#17171c; --line:rgba(255,255,255,.85); --glass:rgba(255,255,255,.66);
  --sp-s:clamp(0.7rem,0.65rem+0.24vw,1rem);
  --sp-m:clamp(1.2rem,1.1rem+0.5vw,1.8rem);
}
*,*::before,*::after{box-sizing:border-box}
*{margin:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;
  color:var(--ink);font-size:clamp(0.94rem,0.9rem+0.2vw,1rem);line-height:1.65;
  min-height:100svh;
  padding:var(--sp-m) var(--sp-s) calc(3rem + env(safe-area-inset-bottom));
  background:radial-gradient(900px 520px at 12% -8%,rgba(236,94,134,.13),transparent 60%),
    linear-gradient(180deg,#FFF7FA,#FDF3F5 45%,#FFF9F4);
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
img{max-width:100%;height:auto;display:block}
button,input,select{font-family:inherit;font-size:16px}
@media(min-width:1024px){button,input,select{font-size:14.5px}}
.wrap{max-width:900px;margin:0 auto}

.top{margin-bottom:var(--sp-m);display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.top h1{font-size:clamp(1.35rem,1.2rem+0.7vw,1.9rem);font-weight:800;letter-spacing:-.04em}
.top .s{margin-top:3px;color:var(--gray);font-size:13px}
.top a{margin-left:auto;font-size:12.5px;color:var(--gray)}

.panel{
  background:var(--glass);border:1px solid var(--line);border-radius:22px;
  padding:var(--sp-m);margin-bottom:var(--sp-s);
  backdrop-filter:blur(20px) saturate(120%);
  -webkit-backdrop-filter:blur(20px) saturate(120%);
  box-shadow:0 12px 30px rgba(0,0,0,.07),inset 0 1px 0 rgba(255,255,255,.9);
}
.panel h2{
  font-size:10.5px;letter-spacing:1.8px;color:var(--gray);font-weight:700;
  text-transform:uppercase;margin-bottom:14px;padding-bottom:9px;
  border-bottom:1px solid rgba(0,0,0,.055);display:flex;align-items:center;gap:8px;
}
.panel h2 .n{margin-left:auto;font-size:11px;letter-spacing:0;color:var(--main);
  background:rgba(216,37,88,.09);padding:2px 9px;border-radius:999px}

label{display:block;font-size:12px;font-weight:600;color:#555;margin:12px 0 6px}
label:first-of-type{margin-top:0}
input,select{width:100%;min-height:46px;padding:12px 14px;border-radius:12px;
  border:1px solid var(--line);background:rgba(255,255,255,.85);color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--main);outline-offset:-1px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:130px}

.btn{min-height:47px;padding:0 20px;border:0;border-radius:999px;cursor:pointer;
  font-size:13.5px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--main2),var(--main));
  display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.sub{background:rgba(255,255,255,.88);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btns>*{flex:1;min-width:140px}

.msg{margin-top:11px;font-size:13px;line-height:1.7;min-height:20px;color:var(--gray)}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}

.list{display:flex;flex-direction:column;gap:2px}
.it{display:flex;gap:11px;align-items:center;padding:11px 2px;
  border-bottom:1px solid rgba(0,0,0,.05)}
.it:last-child{border-bottom:0}
.it .th{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:none;
  background:#FFF1F4}
.it .ic{width:52px;height:52px;border-radius:10px;flex:none;background:#FFF1F4;
  display:flex;align-items:center;justify-content:center;font-size:19px}
.it .t{flex:1;min-width:0}
.it b{display:block;font-size:13px;font-weight:600;letter-spacing:-.02em}
.it .m{font-size:11.5px;color:var(--gray);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .x{width:32px;height:32px;border:1px solid var(--line);border-radius:8px;
  background:rgba(255,255,255,.85);cursor:pointer;flex:none;font-size:14px}

.prev{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(140px,100%),1fr));
  margin-top:12px}
.prev img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;background:#FFF1F4}

.hint{font-size:12px;color:var(--gray);line-height:1.85;margin-top:12px;
  padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.5)}
.hint b{color:var(--ink)}
.hint code{font-family:ui-monospace,Menlo,monospace;font-size:11px;
  background:rgba(0,0,0,.05);padding:2px 6px;border-radius:5px}

/* ══ 관리자 화면 공통 · 글래스 버튼 ══ */
.btn{
  min-height:48px !important;
  padding:0 24px !important;
  border-radius:14px !important;
  font-weight:600 !important;
  letter-spacing:-.01em;
  display:inline-flex !important;
  align-items:center !important;
  justify-content:center !important;
  gap:7px;
  color:var(--ink) !important;
  background:rgba(255,255,255,.58) !important;
  border:1px solid rgba(255,255,255,.9) !important;
  backdrop-filter:blur(18px) saturate(140%);
  -webkit-backdrop-filter:blur(18px) saturate(140%);
  box-shadow:0 6px 18px rgba(0,0,0,.07),inset 0 1px 0 rgba(255,255,255,.95) !important;
  transition:background .18s ease, box-shadow .18s ease, transform .12s ease;
}
.btn:hover{
  background:rgba(255,255,255,.76) !important;
  box-shadow:0 8px 22px rgba(0,0,0,.09),inset 0 1px 0 rgba(255,255,255,1) !important;
}
.btn:active{ transform:translateY(1px) }
.btn.sub, .btn.ghost{
  background:rgba(255,255,255,.42) !important;
  color:#555 !important;
}
.btn.danger{
  color:#A32F4E !important;
  background:linear-gradient(135deg,rgba(208,96,124,.2),rgba(176,48,80,.15)) !important;
  border-color:rgba(255,255,255,.85) !important;
}
.btn:disabled{ opacity:.45 !important;box-shadow:none !important;cursor:default }

.btns{
  display:flex !important;
  justify-content:center !important;
  align-items:center;
  gap:9px;
  flex-wrap:wrap;
}
.btns > .btn{ flex:1;min-width:150px }

/* 체크박스 */
input[type=checkbox]{
  -webkit-appearance:none;appearance:none;
  width:20px;height:20px;margin:0;flex:none;
  border-radius:7px;
  border:1.5px solid rgba(0,0,0,.16);
  background:rgba(255,255,255,.9);
  cursor:pointer;position:relative;
  transition:background .18s ease,border-color .18s ease;
}
input[type=checkbox]:checked{
  background:linear-gradient(135deg,var(--main2),var(--main));
  border-color:transparent;
}
input[type=checkbox]:checked::after{
  content:"";position:absolute;left:6.5px;top:2.5px;
  width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;
  transform:rotate(43deg);
}
label:has(> input[type=checkbox]){
  display:inline-flex;align-items:center;gap:9px;
  min-height:44px;cursor:pointer;user-select:none;
}

@media (max-width:640px){
  .btn{ min-height:50px !important }
  .btns > .btn{ min-width:0 }
}
</style>
<link rel="stylesheet" href="assets/pagelist.css">
<script src="assets/pagelist.js" defer></script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>드라이브 자료</h1>
      <div class="s">원본 그대로 화면에 씁니다. 옮기거나 줄이지 않습니다</div>
    </div>
    <a href="console.html">← 관리자 홈</a>
  </div>

  <div class="panel">
    <h2>자료 추가</h2>

    <label>드라이브 주소를 붙여넣으세요</label>
    <input id="url" placeholder="https://drive.google.com/file/d/... 또는 /drive/folders/..." autocomplete="off">

    <div class="row" style="margin-top:12px">
      <div>
        <label>어떤 자료인가요</label>
        <select id="kind">
          <option value="image">사진</option>
          <option value="video">영상</option>
          <option value="folder">폴더</option>
        </select>
      </div>
      <div>
        <label>어느 제품</label>
        <select id="line">
          <option value="doit">듀잇</option>
          <option value="travel">트래블잇</option>
          <option value="brand">브랜드 공통</option>
        </select>
      </div>
      <div>
        <label>어디에 쓰나요</label>
        <select id="purpose">
          <option value="detail">상세페이지</option>
          <option value="hero">메인 배너</option>
          <option value="film">고객 영상</option>
          <option value="photo">사진 보관</option>
        </select>
      </div>
    </div>

    <label>이름</label>
    <input id="title" placeholder="예) 듀잇 포도 상세 01" autocomplete="off">

    <div class="btns">
      <button class="btn" onclick="add()" id="addBtn">추가하기</button>
      <button class="btn sub" onclick="preview()">미리 보기</button>
    </div>
    <div class="msg" id="m1"></div>
    <div class="prev" id="prev"></div>

    <div class="hint">
      <b>주소만 붙여넣으시면</b> 파일 번호를 알아서 찾습니다.<br><br>
      <b>공유 설정</b>이 <code>링크가 있는 모든 사용자</code>여야 화면에 나옵니다.
      드라이브에서 파일 오른쪽 클릭 → 공유 → 일반 액세스에서 바꾸실 수 있습니다.<br><br>
      <b>폴더를 넣으시면</b> 안의 파일을 하나씩 등록하셔야 합니다.
      드라이브가 폴더 목록을 밖에서 못 읽게 막아두었습니다.
    </div>
  </div>

  <div class="panel">
    <h2>등록된 자료 <span class="n" id="cnt">—</span></h2>
    <div class="row" style="margin-bottom:12px">
      <select id="fLine" onchange="load()">
        <option value="">전체 제품</option>
        <option value="doit">듀잇</option>
        <option value="travel">트래블잇</option>
        <option value="brand">브랜드</option>
      </select>
      <select id="fPurpose" onchange="load()">
        <option value="">전체 용도</option>
        <option value="detail">상세페이지</option>
        <option value="hero">메인 배너</option>
        <option value="film">고객 영상</option>
        <option value="photo">사진 보관</option>
      </select>
    </div>
    <div class="list" id="list"></div>
  </div>
</div>

<script src="assets/lite.js" defer></script>
<script>
const SB='https://psynvpuedzjvytsgdhgg.supabase.co';
const KEY='sb_publishable_Tz7vgJXgYHQ3tyUfm87WTw_vV1Dxfuk';
const H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
function say(t,k){ const m=$('m1'); m.className='msg'+(k?' '+k:''); m.textContent=t; }
function tok(){ try{ return (JSON.parse(localStorage.getItem('cg_sb')||'{}')).t||''; }catch(e){ return ''; } }

/* 주소에서 아이디 뽑기 */
function pickId(u){
  u=String(u||'').trim();
  let m=u.match(/\/file\/d\/([\w-]{20,})/);         if(m) return {kind:'file',id:m[1]};
  m=u.match(/\/drive\/folders\/([\w-]{20,})/);      if(m) return {kind:'folder',id:m[1]};
  m=u.match(/[?&]id=([\w-]{20,})/);                 if(m) return {kind:'file',id:m[1]};
  m=u.match(/^([\w-]{25,})$/);                      if(m) return {kind:'file',id:m[1]};
  return null;
}

function preview(){
  const p=pickId($('url').value);
  if(!p){ say('드라이브 주소를 확인해 주세요.','bad'); $('prev').innerHTML=''; return; }
  if(p.kind==='folder'){
    say('폴더는 미리 볼 수 없습니다. 안의 파일 주소를 넣어주세요.','bad');
    $('prev').innerHTML=''; return;
  }
  say('불러오는 중…');
  $('prev').innerHTML='<img src="https://drive.google.com/thumbnail?id='+p.id
    +'&sz=w800" alt="미리 보기" referrerpolicy="no-referrer" '
    +'onload="say(\'정상입니다. 이대로 추가하시면 됩니다.\',\'ok\')" '
    +'onerror="say(\'못 불러왔습니다. 공유 설정을 확인해 주세요.\',\'bad\');this.style.display=\'none\'">';
}

function add(){
  const p=pickId($('url').value);
  if(!p){ say('드라이브 주소를 확인해 주세요.','bad'); return; }
  const t=tok();
  if(!t){ say('로그인이 필요합니다.','bad'); return; }
  $('addBtn').disabled=true; say('추가하는 중…');

  const row={
    kind: p.kind==='folder' ? 'folder' : $('kind').value,
    line: $('line').value,
    purpose: $('purpose').value,
    file_id: p.kind==='file' ? p.id : '',
    folder_id: p.kind==='folder' ? p.id : '',
    title: $('title').value.trim() || '이름 없음',
    sort_order: 99
  };
  fetch(SB+'/rest/v1/drive_assets',{method:'POST',
    headers:{...H,Authorization:'Bearer '+t,Prefer:'return=minimal'},
    body:JSON.stringify(row)})
  .then(r=>{
    $('addBtn').disabled=false;
    if(!r.ok) throw new Error();
    say('추가했습니다.','ok');
    $('url').value=''; $('title').value=''; $('prev').innerHTML='';
    load();
  })
  .catch(()=>{ $('addBtn').disabled=false; say('추가하지 못했습니다. 이미 있는 파일일 수 있습니다.','bad'); });
}

const KN={image:'사진',video:'영상',folder:'폴더'};
const LN={doit:'듀잇',travel:'트래블잇',brand:'브랜드'};
const PN={detail:'상세페이지',hero:'메인 배너',film:'고객 영상',photo:'사진 보관'};

function load(){
  let q='/rest/v1/drive_assets?select=*&order=sort_order,id';
  const l=$('fLine').value, p=$('fPurpose').value;
  if(l) q+='&line=eq.'+l;
  if(p) q+='&purpose=eq.'+p;
  fetch(SB+q,{headers:H}).then(r=>r.ok?r.json():[]).then(rows=>{
    $('cnt').textContent=rows.length+'개';
    if(!rows.length){ $('list').innerHTML='<p style="font-size:13px;color:var(--gray)">없습니다.</p>'; return; }
    $('list').innerHTML=rows.map(v=>{
      const id=v.file_id||v.folder_id;
      const thumb = (v.kind==='image'&&v.file_id)
        ? '<img class="th" src="https://drive.google.com/thumbnail?id='+esc(v.file_id)
          +'&sz=w200" alt="" loading="lazy" referrerpolicy="no-referrer" '
          +'onerror="this.outerHTML=\'<span class=&quot;ic&quot;>🖼</span>\'">'
        : '<span class="ic">'+(v.kind==='video'?'▶':(v.kind==='folder'?'📁':'🖼'))+'</span>';
      const link = v.folder_id
        ? 'https://drive.google.com/drive/folders/'+v.folder_id
        : 'https://drive.google.com/file/d/'+v.file_id+'/view';
      return '<div class="it">'+thumb
        +'<span class="t"><b>'+esc(v.title)+'</b>'
        +'<span class="m">'+esc(KN[v.kind]||v.kind)+' · '+esc(LN[v.line]||v.line)
        +' · '+esc(PN[v.purpose]||v.purpose)+(v.note?' · '+esc(v.note):'')+'</span></span>'
        +'<a class="x" href="'+link+'" target="_blank" rel="noopener" '
        +'style="display:flex;align-items:center;justify-content:center" title="열기">↗</a>'
        +'<button class="x" onclick="del('+v.id+')" title="삭제">✕</button></div>';
    }).join('');
  }).catch(()=>{ $('list').innerHTML='<p style="font-size:13px;color:var(--bad)">불러오지 못했습니다.</p>'; });
}

function del(id){
  const t=tok();
  if(!t){ say('로그인이 필요합니다.','bad'); return; }
  fetch(SB+'/rest/v1/drive_assets?id=eq.'+id,{method:'DELETE',
    headers:{...H,Authorization:'Bearer '+t}})
  .then(r=>{ if(!r.ok) throw new Error(); load(); say('지웠습니다.','ok'); })
  .catch(()=>say('지우지 못했습니다.','bad'));
}

load();
</script>
</body>
</html>
