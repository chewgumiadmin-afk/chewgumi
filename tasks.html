<style>
:root{--main:#D82558;--main2:#E95073;--ok:#2AA060;--warn:#E9A23B;--bad:#C0395C;
  --ink:#1a1a1a;--gray:#797979;--line:rgba(255,255,255,.85);--glass:rgba(255,255,255,.66);
  --ease:cubic-bezier(.32,.72,0,1)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:"SUIT Variable","SUIT","Noto Sans KR",sans-serif;color:var(--ink);
  min-height:100vh;padding-bottom:calc(60px + env(safe-area-inset-bottom));
  background:radial-gradient(760px 440px at 12% -5%,rgba(236,94,134,.15),transparent 60%),
    linear-gradient(180deg,#FFF7FA,#FDF3F5 45%,#FFF9F4)}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}
a:focus-visible,button:focus-visible{outline:2px solid var(--main2);outline-offset:3px;border-radius:10px}

.hd{position:sticky;top:0;z-index:50;
  padding:calc(15px + env(safe-area-inset-top)) 18px 12px;
  background:linear-gradient(180deg,rgba(255,255,255,.86),rgba(255,255,255,.72));
  backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);
  border-bottom:.5px solid rgba(0,0,0,.06)}
.hd h1{font-family:'Poppins',sans-serif;font-size:19px;color:var(--main)}
.hd .s{margin-top:2px;font-size:11px;letter-spacing:2.5px;color:var(--gray)}
.hd .pg{margin-top:11px;height:6px;border-radius:99px;background:rgba(0,0,0,.07);overflow:hidden}
.hd .pg i{display:block;height:100%;border-radius:99px;width:0;
  background:linear-gradient(90deg,var(--main2),var(--main));transition:width .6s var(--ease)}
.hd .pgt{margin-top:6px;font-size:11.5px;color:var(--gray)}

.wrap{max-width:620px;margin:0 auto;padding:14px 16px 0}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:10px 15px;border-radius:999px;font-size:12.5px;font-weight:700;
  white-space:nowrap;color:var(--gray);
  border:.5px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.72));
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95);
  transition:transform .3s var(--ease),background .3s,color .3s}
.tabs button:active{transform:scale(.95)}
.tabs button.on{background:linear-gradient(135deg,var(--main2),var(--main));
  color:#fff;border-color:transparent;
  box-shadow:0 6px 18px rgba(216,37,88,.26)}

.card{background:linear-gradient(180deg,rgba(255,255,255,.78),var(--glass));
  border:.5px solid var(--line);border-radius:20px;padding:16px 17px;margin-bottom:11px;
  backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  box-shadow:0 1px 2px rgba(0,0,0,.04),0 10px 26px rgba(0,0,0,.07),
    inset 0 1px 0 rgba(255,255,255,.9);
  transition:opacity .4s var(--ease)}
.card.done{opacity:.55}
.ch{display:flex;gap:11px;align-items:flex-start}
.ch input{width:23px;height:23px;flex:none;margin-top:2px;appearance:none;border-radius:8px;
  border:1.8px solid rgba(0,0,0,.16);background:#fff;position:relative;cursor:pointer;
  transition:background .25s,border-color .25s}
.ch input:checked{background:linear-gradient(135deg,var(--main2),var(--main));border-color:transparent}
.ch input:checked::after{content:"";position:absolute;left:7.5px;top:3px;width:6px;height:12px;
  border:solid #fff;border-width:0 2.6px 2.6px 0;transform:rotate(45deg)}
.bd{flex:1;min-width:0}
.tt{font-size:14.5px;font-weight:700;line-height:1.45;word-break:keep-all}
.card.done .tt{text-decoration:line-through;color:var(--gray)}
.ds{margin-top:7px;font-size:12.5px;line-height:1.85;color:#555;word-break:keep-all;
  white-space:pre-line}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.tag{font-size:10px;font-weight:700;padding:4px 9px;border-radius:999px}
.tag.hot{background:rgba(216,37,88,.1);color:var(--main)}
.tag.t{background:rgba(0,0,0,.055);color:#666}
.tag.ok{background:rgba(42,160,96,.12);color:var(--ok)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.acts a,.acts button{display:inline-flex;align-items:center;height:36px;padding:0 14px;
  border-radius:999px;font-size:11.5px;font-weight:700;
  border:.5px solid var(--line);color:var(--ink);
  background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.74));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95)}
.acts a.go{background:linear-gradient(135deg,var(--main2),var(--main));
  color:#fff;border-color:transparent}
.acts a.tel{background:linear-gradient(135deg,#37B26B,#2AA060);color:#fff;border-color:transparent}
.acts a:active,.acts button:active{transform:scale(.95)}

.grp{margin:20px 4px 10px;font-size:11px;letter-spacing:2.5px;font-weight:700;color:var(--gray)}
.note{padding:22px 6px 16px;font-size:11.5px;line-height:1.9;color:var(--gray)}
.lead{padding:2px 6px 14px;font-size:12.5px;line-height:1.85;color:#555;word-break:keep-all}
.hide{display:none}
</style>

var filt='now', done={};
try{ done=JSON.parse(localStorage.getItem('cg_task')||'{}'); }catch(e){}
function save(){ try{ localStorage.setItem('cg_task',JSON.stringify(done)); }catch(e){} }

document.querySelectorAll('#tabs button').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('#tabs button').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on'); filt=b.dataset.f; render();
    window.scrollTo({top:0,behavior:'smooth'});
  };
});
window.toggle=function(id){ done[id]=!done[id]; save(); render(); };

function render(){
  var todo=T.filter(function(x){ return x.f==='now'||x.f==='week'; });
  var fin=todo.filter(function(x){ return done[x.id]; }).length;
  var pct=todo.length?Math.round(fin/todo.length*100):0;
  $('pgBar').style.width=pct+'%';
  $('pgTxt').textContent='대표님 할 일 '+fin+' / '+todo.length+'건 완료 ('+pct+'%)';
  $('lead').textContent=LEAD[filt]||'';

  var rows=T.filter(function(x){ return x.f===filt; });
  if(filt==='now'||filt==='week'){
    rows=rows.slice().sort(function(a,b){ return (done[a.id]?1:0)-(done[b.id]?1:0); });
  }
  var can=(filt==='now'||filt==='week'||filt==='later'||filt==='wait');

  $('list').innerHTML=rows.map(function(x){
    var d=!!done[x.id];
    return '<div class="card'+(d?' done':'')+'"><div class="ch">'
      +(can?'<input type="checkbox" '+(d?'checked':'')+' onchange="toggle(\''+x.id+'\')">':'')
      +'<div class="bd"><div class="tt">'+esc(x.t)+'</div>'
      +'<div class="ds">'+esc(x.d)+'</div>'
      +'<div class="tags">'+(x.tags||[]).map(function(t){
          var c=(t==='가장 급함'||t==='매출 직결'||t==='돈 관련'||t==='보안')?'hot'
               :(t==='완료'||t==='자동'||t==='무료')?'ok':'t';
          return '<span class="tag '+c+'">'+esc(t)+'</span>';
        }).join('')+'</div>'
      +((x.url||x.tel)?'<div class="acts">'
        +(x.tel?'<a class="tel" href="tel:'+x.tel+'">전화 걸기</a>':'')
        +(x.url?'<a class="go" href="'+esc(x.url)+'" target="_blank" rel="noopener">열기</a>':'')
        +'</div>':'')
      +'</div></div></div>';
  }).join('')||'<div class="note">해당 항목이 없습니다.</div>';

  $('foot').innerHTML='마지막 확인 '+new Date().toLocaleDateString('ko-KR')
    +'<br>체크 상태는 이 기기에만 저장됩니다.'
    +'<br><br><a href="'+SITE+'console.html" style="text-decoration:underline">관리자 홈</a>'
    +' · <a href="'+SITE+'" style="text-decoration:underline">사이트</a>'
    +' · <a href="https://github.com/hyunjeongshin83/chewgumi/issues" target="_blank" rel="noopener"'
    +' style="text-decoration:underline">이슈 게시판</a>'
    +'<br><br>문의 · MedIT';
}
render();
</script>
