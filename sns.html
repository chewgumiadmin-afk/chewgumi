<!DOCTYPE html>
<!-- ChewGumi SNS Reviews · MedIT -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>SNS 후기 | CHEWGUMI</title>
<script src="assets/qa-on.js"></script>
<script src="assets/guard.js" defer></script>
<script src="assets/drive.js" defer></script>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<script src="assets/auth.js"></script>
<script src="assets/site.js"></script>
<style>
:root{
  --main:#D82558; --main2:#E95073; --ok:#2AA060; --bad:#C0395C;
  --gray:#7a7a82; --ink:#17171c; --line:rgba(255,255,255,.85); --glass:rgba(255,255,255,.66);
  --sp-s:clamp(0.7rem,0.65rem+0.24vw,1rem);
  --sp-m:clamp(1.2rem,1.1rem+0.5vw,1.8rem);
}
*,*::before,*::after{box-sizing:border-box}
*{margin:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;
  color:var(--ink);font-size:clamp(0.94rem,0.9rem+0.2vw,1rem);line-height:1.65;
  min-height:100svh;
  padding:var(--sp-m) var(--sp-s) calc(3rem + env(safe-area-inset-bottom));
  background:radial-gradient(900px 520px at 12% -8%,rgba(236,94,134,.13),transparent 60%),
    linear-gradient(180deg,#FFF7FA,#FDF3F5 45%,#FFF9F4);
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
img{max-width:100%;height:auto;display:block}
button,input,select,textarea{font-family:inherit;font-size:16px}
@media(min-width:1024px){button,input,select,textarea{font-size:14.5px}}
.wrap{max-width:940px;margin:0 auto}

.top{margin-bottom:var(--sp-m);display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.top h1{font-size:clamp(1.35rem,1.2rem+0.7vw,1.9rem);font-weight:800;letter-spacing:-.04em}
.top .s{margin-top:3px;color:var(--gray);font-size:13px}
.top a{margin-left:auto;font-size:12.5px;color:var(--gray)}

.panel{
  background:var(--glass);border:1px solid var(--line);border-radius:22px;
  padding:var(--sp-m);margin-bottom:var(--sp-s);
  backdrop-filter:blur(20px) saturate(120%);
  -webkit-backdrop-filter:blur(20px) saturate(120%);
  box-shadow:0 12px 30px rgba(0,0,0,.07),inset 0 1px 0 rgba(255,255,255,.9);
}
.panel h2{
  font-size:10.5px;letter-spacing:1.8px;color:var(--gray);font-weight:700;
  text-transform:uppercase;margin-bottom:14px;padding-bottom:9px;
  border-bottom:1px solid rgba(0,0,0,.055);display:flex;align-items:center;gap:8px;
}
.panel h2 .n{margin-left:auto;font-size:11px;letter-spacing:0;color:var(--main);
  background:rgba(216,37,88,.09);padding:2px 9px;border-radius:999px}

label{display:block;font-size:12px;font-weight:600;color:#555;margin:12px 0 6px}
label:first-of-type{margin-top:0}
input,select,textarea{width:100%;min-height:46px;padding:12px 14px;border-radius:12px;
  border:1px solid var(--line);background:rgba(255,255,255,.85);color:var(--ink)}
textarea{min-height:76px;line-height:1.7;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--main);outline-offset:-1px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:130px}

.btn{min-height:47px;padding:0 20px;border:0;border-radius:999px;cursor:pointer;
  font-size:13.5px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--main2),var(--main));
  display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.sub{background:rgba(255,255,255,.88);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btns>*{flex:1;min-width:140px}
.msg{margin-top:11px;font-size:13px;line-height:1.7;min-height:20px;color:var(--gray)}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}

/* 채널 탭 */
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;min-height:38px;padding:0 15px;border-radius:999px;
  border:1px solid var(--line);background:rgba(255,255,255,.75);
  font-size:12.5px;font-weight:600;color:#666;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px}
.tabs button.on{background:var(--ink);color:#fff;border-color:transparent}
.tabs .dot{width:7px;height:7px;border-radius:50%;flex:none}

/* 카드 격자 */
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(160px,100%),1fr))}
.card{position:relative;border-radius:14px;overflow:hidden;background:#FFF1F4;
  border:1px solid var(--line);cursor:pointer}
.card .th{width:100%;display:block;object-fit:cover;background:#FFF1F4}
.card.r11 .th{aspect-ratio:1/1}
.card.r916 .th{aspect-ratio:9/16}
.card.r43 .th{aspect-ratio:4/3}
.card.r169 .th{aspect-ratio:16/9}
.card .tag{position:absolute;top:8px;left:8px;z-index:2;
  font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;
  color:#fff;letter-spacing:.3px}
.card .x{position:absolute;top:8px;right:8px;z-index:2;width:26px;height:26px;
  border:0;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;
  cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}
.card .cap{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:22px 10px 9px;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.62));color:#fff}
.card .cap b{display:block;font-size:11.5px;font-weight:600}
.card .cap span{font-size:10.5px;opacity:.85;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.5}

.hint{font-size:12px;color:var(--gray);line-height:1.85;margin-top:12px;
  padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.5)}
.hint b{color:var(--ink)}
.hint code{font-family:ui-monospace,Menlo,monospace;font-size:11px;
  background:rgba(0,0,0,.05);padding:2px 6px;border-radius:5px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>SNS 후기</h1>
      <div class="s">블로그 · 인스타 · 릴스 · 틱톡을 메인 화면에 소개합니다</div>
    </div>
    <a href="console.html">← 관리자 홈</a>
  </div>

  <div class="panel">
    <h2>후기 추가</h2>

    <div class="row">
      <div>
        <label>어느 채널인가요</label>
        <select id="channel" onchange="onChan()">
          <option value="blog">네이버 블로그</option>
          <option value="instagram">인스타그램</option>
          <option value="reels">인스타 릴스</option>
          <option value="tiktok">틱톡</option>
          <option value="youtube">유튜브</option>
          <option value="etc">기타</option>
        </select>
      </div>
      <div>
        <label>어느 제품</label>
        <select id="line">
          <option value="doit">듀잇</option>
          <option value="travel">트래블잇</option>
        </select>
      </div>
    </div>

    <label>사진 · 영상 (드라이브 주소)</label>
    <input id="media" placeholder="https://drive.google.com/file/d/..." autocomplete="off">

    <label>원문 주소 (블로그·인스타 게시물)</label>
    <input id="link" placeholder="https://blog.naver.com/... 또는 https://instagram.com/p/..." autocomplete="off">

    <div class="row" style="margin-top:12px">
      <div>
        <label>작성자</label>
        <input id="author" placeholder="닉네임" autocomplete="off">
      </div>
      <div>
        <label>계정</label>
        <input id="handle" placeholder="@아이디" autocomplete="off">
      </div>
    </div>

    <label>내용 요약</label>
    <textarea id="caption" placeholder="한두 줄로 적어주세요"></textarea>

    <div class="btns">
      <button class="btn" onclick="add()" id="addBtn">추가하기</button>
      <button class="btn sub" onclick="preview()">미리 보기</button>
    </div>
    <div class="msg" id="m1"></div>
    <div id="prev" style="margin-top:12px"></div>

    <div class="hint">
      <b>드라이브 주소</b>를 붙여넣으시면 파일 번호를 알아서 찾습니다.
      공유 설정이 <code>링크가 있는 모든 사용자</code>여야 화면에 나옵니다.<br><br>
      <b>비율은 채널에 맞춰</b> 자동으로 정해집니다.
      릴스·틱톡은 세로(9:16), 인스타는 정사각, 블로그는 가로(4:3)입니다.<br><br>
      <b>원문 주소</b>를 넣으시면 고객이 눌러서 원글을 볼 수 있습니다.
    </div>
  </div>

  <div class="panel">
    <h2>등록된 후기 <span class="n" id="cnt">—</span></h2>
    <div class="tabs" id="tabs">
      <button class="on" data-c="">전체</button>
    </div>
    <div class="grid" id="list"></div>
  </div>
</div>

<script src="assets/lite.js" defer></script>
<script src="assets/qa-pad.js" defer></script>
<script>
const SB='https://psynvpuedzjvytsgdhgg.supabase.co';
const KEY='sb_publishable_Tz7vgJXgYHQ3tyUfm87WTw_vV1Dxfuk';
const H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
function say(t,k){ const m=$('m1'); m.className='msg'+(k?' '+k:''); m.textContent=t; }
function tok(){ try{ return (JSON.parse(localStorage.getItem('cg_sb')||'{}')).t||''; }catch(e){ return ''; } }

let CHS=[], ALL=[];

function pickId(u){
  u=String(u||'').trim();
  let m=u.match(/\/file\/d\/([\w-]{20,})/);   if(m) return m[1];
  m=u.match(/[?&]id=([\w-]{20,})/);           if(m) return m[1];
  m=u.match(/^([\w-]{25,})$/);                if(m) return m[1];
  return '';
}
function ratioClass(r){
  return r==='9/16'?'r916':(r==='4/3'?'r43':(r==='16/9'?'r169':'r11'));
}
function chanOf(c){ return CHS.find(x=>x.code===c) || {name:c,ratio:'1/1',color:'#7a7a82',icon:'·'}; }

function onChan(){
  const c=chanOf($('channel').value);
  say('비율은 '+c.ratio.replace('/',':')+' 로 저장됩니다.');
}

function preview(){
  const id=pickId($('media').value);
  if(!id){ say('드라이브 주소를 확인해 주세요.','bad'); $('prev').innerHTML=''; return; }
  const c=chanOf($('channel').value);
  say('불러오는 중…');
  $('prev').innerHTML='<div class="card '+ratioClass(c.ratio)+'" style="max-width:220px">'
    +'<img class="th" src="https://drive.google.com/thumbnail?id='+id+'&sz=w600" '
    +'alt="미리 보기" referrerpolicy="no-referrer" '
    +'onload="say(\'정상입니다.\',\'ok\')" '
    +'onerror="say(\'못 불러왔습니다. 공유 설정을 확인해 주세요.\',\'bad\')"></div>';
}

function add(){
  const id=pickId($('media').value);
  if(!id){ say('드라이브 주소를 확인해 주세요.','bad'); return; }
  const t=tok();
  if(!t){ say('로그인이 필요합니다.','bad'); return; }
  const ch=$('channel').value, c=chanOf(ch);
  $('addBtn').disabled=true; say('추가하는 중…');

  fetch(SB+'/rest/v1/user_films',{method:'POST',
    headers:{...H,Authorization:'Bearer '+t,Prefer:'return=minimal'},
    body:JSON.stringify({
      kind: (ch==='reels'||ch==='tiktok'||ch==='youtube') ? 'video' : 'image',
      channel: ch,
      ratio: c.ratio,
      drive_id: id,
      thumb_url: 'https://drive.google.com/thumbnail?id='+id+'&sz=w800',
      media_url: 'https://drive.google.com/thumbnail?id='+id+'&sz=w1600',
      link_url: $('link').value.trim(),
      author: $('author').value.trim() || '고객님',
      author_handle: $('handle').value.trim(),
      caption: $('caption').value.trim(),
      product_line: $('line').value,
      rating: 5, likes: 0, featured: false,
      status: 'approved', sort_order: 0
    })})
  .then(r=>{
    $('addBtn').disabled=false;
    if(!r.ok) throw new Error();
    say('추가했습니다.','ok');
    ['media','link','author','handle','caption'].forEach(k=>$(k).value='');
    $('prev').innerHTML=''; load();
  })
  .catch(()=>{ $('addBtn').disabled=false; say('추가하지 못했습니다.','bad'); });
}

function loadChannels(){
  return fetch(SB+'/rest/v1/sns_channels?select=*&order=sort_order',{headers:H})
  .then(r=>r.ok?r.json():[]).then(rows=>{
    CHS=rows||[];
    $('tabs').innerHTML='<button class="on" data-c="">전체</button>'
      +CHS.map(c=>'<button data-c="'+esc(c.code)+'">'
        +'<span class="dot" style="background:'+esc(c.color)+'"></span>'
        +esc(c.name)+'</button>').join('');
    $('tabs').onclick=e=>{
      const b=e.target.closest('button'); if(!b) return;
      $('tabs').querySelectorAll('button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on'); draw(b.dataset.c);
    };
    onChan();
  });
}

function load(){
  fetch(SB+'/rest/v1/user_films?select=*&status=eq.approved&order=created_at.desc&limit=60',
    {headers:H})
  .then(r=>r.ok?r.json():[]).then(rows=>{ ALL=rows||[]; draw(''); })
  .catch(()=>{ $('list').innerHTML='<p style="font-size:13px;color:var(--bad)">불러오지 못했습니다.</p>'; });
}

function draw(f){
  const v=f?ALL.filter(x=>x.channel===f):ALL;
  $('cnt').textContent=v.length+'개';
  if(!v.length){ $('list').innerHTML='<p style="font-size:13px;color:var(--gray)">없습니다.</p>'; return; }
  $('list').innerHTML=v.map(x=>{
    const c=chanOf(x.channel);
    return '<div class="card '+ratioClass(x.ratio||c.ratio)+'">'
      +'<span class="tag" style="background:'+esc(c.color)+'">'+esc(c.name)+'</span>'
      +'<button class="x" onclick="del('+x.id+')" title="삭제">✕</button>'
      +'<img class="th" src="'+esc(x.thumb_url||'')+'" alt="" loading="lazy" '
      +'referrerpolicy="no-referrer" onerror="this.style.opacity=.25">'
      +'<span class="cap"><b>'+esc(x.author||'고객님')+'</b>'
      +'<span>'+esc(x.caption||'')+'</span></span></div>';
  }).join('');
}

function del(id){
  const t=tok();
  if(!t){ say('로그인이 필요합니다.','bad'); return; }
  fetch(SB+'/rest/v1/user_films?id=eq.'+id,{method:'DELETE',
    headers:{...H,Authorization:'Bearer '+t}})
  .then(r=>{ if(!r.ok) throw new Error(); load(); say('지웠습니다.','ok'); })
  .catch(()=>say('지우지 못했습니다.','bad'));
}

loadChannels().then(load);
</script>
</body>
</html>
