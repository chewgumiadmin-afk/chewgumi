<!DOCTYPE html>
<!-- ChewGumi Ops Console · MedIT -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>유지보수 관제 | CHEWGUMI</title>
<link rel="icon" href="favicon.ico" sizes="any">
<style>
:root{
  --main:#D82558; --main2:#E95073;
  --ok:#2AA060; --warn:#E9A23B; --bad:#C0395C; --gray:#7a7a82;
  --ink:#17171c; --line:rgba(255,255,255,.85); --glass:rgba(255,255,255,.66);
  --step-0:clamp(0.94rem,0.9rem+0.2vw,1rem);
  --step-1:clamp(1.1rem,1.03rem+0.35vw,1.3rem);
  --step-2:clamp(1.35rem,1.2rem+0.7vw,1.9rem);
  --sp-s:clamp(0.7rem,0.65rem+0.24vw,1rem);
  --sp-m:clamp(1.2rem,1.1rem+0.5vw,1.8rem);
}
*,*::before,*::after{box-sizing:border-box}
*{margin:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;
  color:var(--ink); font-size:var(--step-0); line-height:1.65;
  min-height:100svh;
  padding:var(--sp-m) var(--sp-s) calc(3rem + env(safe-area-inset-bottom));
  background:
    radial-gradient(900px 520px at 10% -8%,rgba(236,94,134,.13),transparent 60%),
    linear-gradient(180deg,#FFF7FA,#FDF3F5 45%,#FFF9F4);
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
img{max-width:100%;height:auto;display:block}
button,input,select,textarea{font-family:inherit;font-size:16px}
@media(min-width:1024px){button,input,select,textarea{font-size:14.5px}}

.wrap{max-width:1000px;margin:0 auto}

.top{margin-bottom:var(--sp-m)}
.top h1{font-size:var(--step-2);font-weight:800;letter-spacing:-.04em}
.top .s{margin-top:4px;color:var(--gray);font-size:13px}

.panel{
  background:var(--glass); border:1px solid var(--line); border-radius:22px;
  padding:var(--sp-m); margin-bottom:var(--sp-s);
  backdrop-filter:blur(20px) saturate(120%);
  -webkit-backdrop-filter:blur(20px) saturate(120%);
  box-shadow:0 12px 30px rgba(0,0,0,.07),inset 0 1px 0 rgba(255,255,255,.9);
}
.panel h2{
  font-size:10.5px;letter-spacing:1.8px;color:var(--gray);font-weight:700;
  text-transform:uppercase;margin-bottom:14px;padding-bottom:9px;
  border-bottom:1px solid rgba(0,0,0,.055);
  display:flex;align-items:center;gap:8px;
}
.panel h2 .n{
  margin-left:auto;font-size:11px;letter-spacing:0;color:var(--main);
  background:rgba(216,37,88,.09);padding:2px 9px;border-radius:999px;
}

/* 자산 카드 */
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr))}
.card{
  background:rgba(255,255,255,.72); border:1px solid var(--line);
  border-radius:16px; padding:14px 16px; display:flex; gap:11px; align-items:flex-start;
}
.card .dot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:6px}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)}
.dot.down{background:var(--bad)} .dot.expiring{background:var(--warn)}
.card .t{flex:1;min-width:0}
.card b{display:block;font-size:13.5px;font-weight:700;letter-spacing:-.02em}
.card .m{font-size:11.5px;color:var(--gray);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .n{font-size:11.5px;color:#666;line-height:1.6;margin-top:5px;word-break:keep-all}
.card .go{font-size:11px;color:var(--main);margin-top:6px;display:inline-block}

.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  flex:none;min-height:38px;padding:0 15px;border-radius:999px;
  border:1px solid var(--line);background:rgba(255,255,255,.75);
  font-size:12.5px;font-weight:600;color:#666;cursor:pointer;
}
.tabs button.on{background:var(--ink);color:#fff;border-color:transparent}

/* 리포트 */
.row{
  display:flex;gap:11px;align-items:flex-start;padding:13px 2px;
  border-bottom:1px solid rgba(0,0,0,.055);cursor:pointer;
}
.row:last-child{border-bottom:0}
.row .badge{
  flex:none;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;
  background:rgba(0,0,0,.05);color:#666;margin-top:2px;
}
.badge.open{background:rgba(233,162,59,.14);color:#9C6B12}
.badge.doing{background:rgba(27,127,168,.13);color:#12617F}
.badge.done{background:rgba(42,160,96,.13);color:#1B6B3F}
.row .t{flex:1;min-width:0}
.row b{display:block;font-size:13.5px;font-weight:600;letter-spacing:-.02em}
.row p{font-size:12px;color:var(--gray);margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .d{font-size:11px;color:var(--gray);flex:none;margin-top:3px}

/* 입력 */
label{display:block;font-size:12px;font-weight:600;color:#555;margin:12px 0 6px}
label:first-of-type{margin-top:0}
input,select,textarea{
  width:100%;min-height:46px;padding:12px 14px;border-radius:12px;
  border:1px solid var(--line);background:rgba(255,255,255,.82);color:var(--ink);
}
textarea{min-height:110px;line-height:1.7;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--main);outline-offset:-1px}

.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{
  flex:1;min-width:140px;min-height:48px;padding:0 20px;border:0;border-radius:999px;
  cursor:pointer;font-size:14px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--main2),var(--main));
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
}
.btn.sub{background:rgba(255,255,255,.88);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}

.msg{margin-top:11px;font-size:13px;line-height:1.7;min-height:20px;color:var(--gray)}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}

/* 대화창 */
.chat{
  position:fixed;inset:0;z-index:900;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(20,12,16,.42);backdrop-filter:blur(6px);
}
.chat.hide{display:none}
.chat-box{
  width:min(100%,640px);max-height:88svh;background:#fff;
  border-radius:24px 24px 0 0;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);
}
@media(min-width:720px){
  .chat{align-items:center}
  .chat-box{border-radius:24px;max-height:82svh}
}
.chat-top{
  padding:18px 20px 14px;border-bottom:1px solid rgba(0,0,0,.06);
  display:flex;align-items:flex-start;gap:10px;
}
.chat-top b{flex:1;font-size:15px;font-weight:700;letter-spacing:-.02em}
.chat-top button{
  width:34px;height:34px;border:0;border-radius:50%;background:rgba(0,0,0,.05);
  cursor:pointer;font-size:15px;flex:none;
}
.chat-body{flex:1;overflow-y:auto;padding:16px 20px;min-height:180px}
.bub{margin-bottom:12px;max-width:82%}
.bub .who{font-size:11px;color:var(--gray);margin-bottom:3px}
.bub .msgbox{
  padding:11px 14px;border-radius:14px;font-size:13.5px;line-height:1.7;
  background:rgba(0,0,0,.045);word-break:keep-all;white-space:pre-wrap;
}
.bub.me{margin-left:auto}
.bub.me .who{text-align:right}
.bub.me .msgbox{background:linear-gradient(135deg,#FFE9EF,#FFDCE6)}
.chat-in{padding:14px 20px 18px;border-top:1px solid rgba(0,0,0,.06);display:flex;gap:8px}
.chat-in textarea{min-height:46px;max-height:120px;flex:1}
.chat-in button{
  min-width:64px;border:0;border-radius:12px;cursor:pointer;font-weight:700;
  color:#fff;background:linear-gradient(135deg,var(--main2),var(--main));
}
.hide{display:none}

/* 사용량 막대 */
.use{padding:11px 0;border-bottom:1px solid rgba(0,0,0,.05)}
.use:last-child{border-bottom:0}
.use .h{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.use b{font-size:13px;font-weight:600;letter-spacing:-.02em}
.use .sv{font-size:10.5px;color:var(--gray);padding:1px 7px;border-radius:999px;
  background:rgba(0,0,0,.05)}
.use .v{margin-left:auto;font-size:12px;color:var(--gray);white-space:nowrap}
.use .v b{font-size:13px;color:var(--ink)}
.bar{height:7px;border-radius:999px;background:rgba(0,0,0,.06);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;transition:width .5s ease}
.bar i.ok{background:linear-gradient(90deg,#3FBF7F,#2AA060)}
.bar i.warn{background:linear-gradient(90deg,#F2BC5C,#E9A23B)}
.bar i.bad{background:linear-gradient(90deg,#E0637F,#C0395C)}
.use .nt{font-size:11.5px;color:var(--gray);margin-top:5px;line-height:1.6}
.use.unknown .bar{background:repeating-linear-gradient(90deg,
  rgba(0,0,0,.05) 0 6px,transparent 6px 12px)}

/* ══ 관리자 화면 공통 · 글래스 버튼 ══ */
.btn{
  min-height:48px !important;
  padding:0 24px !important;
  border-radius:14px !important;
  font-weight:600 !important;
  letter-spacing:-.01em;
  display:inline-flex !important;
  align-items:center !important;
  justify-content:center !important;
  gap:7px;
  color:var(--ink) !important;
  background:rgba(255,255,255,.58) !important;
  border:1px solid rgba(255,255,255,.9) !important;
  backdrop-filter:blur(18px) saturate(140%);
  -webkit-backdrop-filter:blur(18px) saturate(140%);
  box-shadow:0 6px 18px rgba(0,0,0,.07),inset 0 1px 0 rgba(255,255,255,.95) !important;
  transition:background .18s ease, box-shadow .18s ease, transform .12s ease;
}
.btn:hover{
  background:rgba(255,255,255,.76) !important;
  box-shadow:0 8px 22px rgba(0,0,0,.09),inset 0 1px 0 rgba(255,255,255,1) !important;
}
.btn:active{ transform:translateY(1px) }
.btn.sub, .btn.ghost{
  background:rgba(255,255,255,.42) !important;
  color:#555 !important;
}
.btn.danger{
  color:#A32F4E !important;
  background:linear-gradient(135deg,rgba(208,96,124,.2),rgba(176,48,80,.15)) !important;
  border-color:rgba(255,255,255,.85) !important;
}
.btn:disabled{ opacity:.45 !important;box-shadow:none !important;cursor:default }

.btns{
  display:flex !important;
  justify-content:center !important;
  align-items:center;
  gap:9px;
  flex-wrap:wrap;
}
.btns > .btn{ flex:1;min-width:150px }

/* 체크박스 */
input[type=checkbox]{
  -webkit-appearance:none;appearance:none;
  width:20px;height:20px;margin:0;flex:none;
  border-radius:7px;
  border:1.5px solid rgba(0,0,0,.16);
  background:rgba(255,255,255,.9);
  cursor:pointer;position:relative;
  transition:background .18s ease,border-color .18s ease;
}
input[type=checkbox]:checked{
  background:linear-gradient(135deg,var(--main2),var(--main));
  border-color:transparent;
}
input[type=checkbox]:checked::after{
  content:"";position:absolute;left:6.5px;top:2.5px;
  width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;
  transform:rotate(43deg);
}
label:has(> input[type=checkbox]){
  display:inline-flex;align-items:center;gap:9px;
  min-height:44px;cursor:pointer;user-select:none;
}

@media (max-width:640px){
  .btn{ min-height:50px !important }
  .btns > .btn{ min-width:0 }
}

/* AI 사용료 */
.aigrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(130px,100%),1fr))}
.aicard{background:rgba(255,255,255,.72);border:1px solid var(--line);
  border-radius:14px;padding:13px 15px}
.aicard .lb{font-size:11.5px;color:var(--gray)}
.aicard .vl{font-size:21px;font-weight:800;letter-spacing:-.03em;margin-top:4px}
.aicard .vl span{font-size:12px;font-weight:500;color:var(--gray);margin-left:3px}
.airow{display:flex;gap:10px;align-items:center;padding:9px 2px;
  border-bottom:1px solid rgba(0,0,0,.05);font-size:12.5px}
.airow:last-child{border-bottom:0}
.airow b{flex:1;min-width:0;font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.airow .c{flex:none;color:var(--gray);font-size:11.5px}
.airow .w{flex:none;font-weight:700;min-width:64px;text-align:right}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>유지보수 관제</h1>
    <div class="s">토큰 · 저장소 · 데이터베이스 · API 상태를 한눈에</div>
  </div>

  <!-- 사용량 -->
  <div class="panel">
    <h2>AI 사용료 <span class="n" id="aiSum">—</span></h2>
    <div class="aigrid" id="aiCards"></div>
    <div id="aiBy" style="margin-top:14px"></div>
    <div class="hint">
      실제 쓴 만큼 기록됩니다. <b>이달 예상</b>은 최근 7일 평균으로 계산합니다.<br>
      Anthropic 콘솔에 들어가지 않아도 여기서 확인하실 수 있습니다.
    </div>
  </div>

  <div class="panel">
    <h2>사용량 · 한계 <span class="n" id="useN">—</span></h2>
    <div id="usage"></div>
    <p style="font-size:11.5px;color:var(--gray);line-height:1.75;margin-top:12px">
      무료 요금제 기준입니다. 70%를 넘으면 노란색, 90%를 넘으면 빨간색으로 표시됩니다.<br>
      전송량·호출 수처럼 직접 셀 수 없는 항목은 각 서비스 화면에서 확인해 주세요.
    </p>
  </div>

  <!-- 자산 현황 -->
  <div class="panel">
    <h2>자산 현황 <span class="n" id="assetN">—</span></h2>
    <div class="tabs" id="assetTabs">
      <button class="on" data-k="">전체</button>
      <button data-k="repo">저장소</button>
      <button data-k="token">토큰</button>
      <button data-k="db">데이터베이스</button>
      <button data-k="api">API</button>
      <button data-k="domain">도메인</button>
    </div>
    <div class="grid" id="assets"></div>
  </div>

  <!-- 리포트 -->
  <div class="panel">
    <h2>변경 요청 · 이슈 <span class="n" id="repN">—</span></h2>
    <div class="tabs" id="repTabs">
      <button class="on" data-s="">전체</button>
      <button data-s="open">접수</button>
      <button data-s="doing">진행</button>
      <button data-s="done">완료</button>
    </div>
    <div id="reports"></div>
  </div>

  <!-- 새 리포트 -->
  <div class="panel">
    <h2>새로 올리기</h2>
    <label>어떤 내용인가요</label>
    <select id="nKind">
      <option value="change">변경 요청</option>
      <option value="issue">문제 신고</option>
      <option value="request">문의</option>
      <option value="notice">알림</option>
    </select>
    <label>제목</label>
    <input id="nTitle" placeholder="한 줄로 적어주세요">
    <label>자세한 내용</label>
    <textarea id="nBody" placeholder="어느 화면의 무엇을 어떻게 바꾸면 좋을지 적어주세요"></textarea>
    <div class="btns">
      <button class="btn" onclick="submitReport()" id="subBtn">올리기</button>
      <button class="btn sub" onclick="mailDigest()">메일로 정리해 받기</button>
    </div>
    <div class="msg" id="m1"></div>
  </div>
</div>

<!-- 대화 -->
<div class="chat hide" id="chat">
  <div class="chat-box">
    <div class="chat-top">
      <b id="cTitle">제목</b>
      <button onclick="closeChat()" aria-label="닫기">✕</button>
    </div>
    <div class="chat-body" id="cBody"></div>
    <div class="chat-in">
      <textarea id="cInput" placeholder="답장을 적어주세요" rows="1"></textarea>
      <button onclick="sendChat()">보내기</button>
    </div>
  </div>
</div>

<script>
const SB='https://psynvpuedzjvytsgdhgg.supabase.co';
const KEY='sb_publishable_Tz7vgJXgYHQ3tyUfm87WTw_vV1Dxfuk';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};

let ASSETS=[], REPORTS=[], CUR=null;

function say(t,k){ const m=$('m1'); m.className='msg'+(k?' '+k:''); m.textContent=t; }

const KIND={repo:'저장소',token:'토큰',db:'데이터베이스',api:'API',domain:'도메인',service:'서비스'};
const STAT={ok:'정상',warn:'확인 필요',down:'미연결',expiring:'만료 임박'};

/* ── 자산 ── */
function loadAssets(){
  fetch(SB+'/rest/v1/ops_assets?select=*&order=sort_order',{headers:H})
  .then(r=>r.ok?r.json():[]).then(rows=>{ ASSETS=rows||[]; drawAssets(''); })
  .catch(()=>{ $('assets').innerHTML='<p style="font-size:13px;color:var(--bad)">불러오지 못했습니다.</p>'; });
}
function drawAssets(f){
  const v=f?ASSETS.filter(x=>x.kind===f):ASSETS;
  $('assetN').textContent=v.length+'개';
  if(!v.length){ $('assets').innerHTML='<p style="font-size:13px;color:var(--gray)">없습니다.</p>'; return; }
  $('assets').innerHTML=v.map(a=>
    '<div class="card"><span class="dot '+esc(a.status)+'"></span><span class="t">'
    +'<b>'+esc(a.name)+'</b>'
    +'<span class="m">'+esc(KIND[a.kind]||a.kind)+' · '+esc(a.owner||'')+' · '+esc(STAT[a.status]||a.status)+'</span>'
    +(a.note?'<span class="n">'+esc(a.note)+'</span>':'')
    +(a.url?'<a class="go" href="'+esc(a.url)+'" target="_blank" rel="noopener">열기 →</a>':'')
    +'</span></div>').join('');
}
$('assetTabs').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  $('assetTabs').querySelectorAll('button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); drawAssets(b.dataset.k);
});

/* ── 리포트 ── */
function loadReports(){
  fetch(SB+'/rest/v1/ops_reports?select=*&order=created_at.desc&limit=60',{headers:H})
  .then(r=>r.ok?r.json():[]).then(rows=>{ REPORTS=rows||[]; drawReports(''); })
  .catch(()=>{ $('reports').innerHTML='<p style="font-size:13px;color:var(--bad)">불러오지 못했습니다.</p>'; });
}
function drawReports(f){
  const v=f?REPORTS.filter(x=>x.status===f):REPORTS;
  $('repN').textContent=v.length+'건';
  if(!v.length){ $('reports').innerHTML='<p style="font-size:13px;color:var(--gray)">없습니다.</p>'; return; }
  $('reports').innerHTML=v.map(r=>{
    const d=new Date(r.created_at);
    return '<div class="row" onclick="openChat('+r.id+')">'
      +'<span class="badge '+esc(r.status)+'">'+({open:'접수',doing:'진행',done:'완료',hold:'보류'}[r.status]||r.status)+'</span>'
      +'<span class="t"><b>'+esc(r.title)+'</b>'
      +(r.body?'<p>'+esc(r.body)+'</p>':'')+'</span>'
      +'<span class="d">'+(d.getMonth()+1)+'/'+d.getDate()+'</span></div>';
  }).join('');
}
$('repTabs').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  $('repTabs').querySelectorAll('button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); drawReports(b.dataset.s);
});

function submitReport(){
  const t=$('nTitle').value.trim(), b=$('nBody').value.trim();
  if(!t){ say('제목을 적어주세요.','bad'); return; }
  $('subBtn').disabled=true; say('올리는 중…');
  fetch(SB+'/rest/v1/ops_reports',{method:'POST',
    headers:{...H,Prefer:'return=representation'},
    body:JSON.stringify({kind:$('nKind').value,title:t,body:b,origin:'ceo',created_by:'대표'})})
  .then(r=>r.ok?r.json():Promise.reject())
  .then(()=>{ $('subBtn').disabled=false; say('올렸습니다.','ok');
    $('nTitle').value=''; $('nBody').value=''; loadReports(); })
  .catch(()=>{ $('subBtn').disabled=false; say('올리지 못했습니다.','bad'); });
}

function mailDigest(){
  say('메일을 준비하는 중…');
  fetch(SB+'/functions/v1/ops-digest',{method:'POST',headers:H,body:'{}'})
  .then(r=>r.json())
  .then(d=>say(d.ok?('메일을 보냈습니다 · '+(d.msg||'')):(d.msg||'보내지 못했습니다'), d.ok?'ok':'bad'))
  .catch(()=>say('연결하지 못했습니다.','bad'));
}

/* ── 대화 ── */
function openChat(id){
  CUR=REPORTS.find(x=>x.id===id); if(!CUR) return;
  $('cTitle').textContent=CUR.title;
  $('chat').classList.remove('hide');
  document.body.style.overflow='hidden';
  $('cBody').innerHTML='<p style="font-size:13px;color:var(--gray)">불러오는 중…</p>';
  fetch(SB+'/rest/v1/ops_chats?select=*&report_id=eq.'+id+'&order=created_at',{headers:H})
  .then(r=>r.ok?r.json():[]).then(rows=>{
    const first='<div class="bub"><span class="who">'+esc(CUR.created_by||'대표')+'</span>'
      +'<div class="msgbox">'+esc(CUR.body||CUR.title)+'</div></div>';
    $('cBody').innerHTML=first+(rows||[]).map(c=>
      '<div class="bub'+(c.role==='ceo'?' me':'')+'"><span class="who">'
      +esc(c.author||({ceo:'대표',dev:'개발',ai:'AI'}[c.role]||c.role))+'</span>'
      +'<div class="msgbox">'+esc(c.body)+'</div></div>').join('');
    $('cBody').scrollTop=$('cBody').scrollHeight;
  });
}
function closeChat(){
  $('chat').classList.add('hide'); document.body.style.overflow=''; CUR=null;
}
function sendChat(){
  if(!CUR) return;
  const t=$('cInput').value.trim(); if(!t) return;
  $('cInput').value='';
  fetch(SB+'/rest/v1/ops_chats',{method:'POST',headers:H,
    body:JSON.stringify({report_id:CUR.id,author:'대표',role:'ceo',body:t})})
  .then(()=>openChat(CUR.id));
}
$('chat').addEventListener('click',e=>{ if(e.target===$('chat')) closeChat(); });
document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && !$('chat').classList.contains('hide')) closeChat();
});

loadAssets(); loadReports();

/* ── 사용량 ── */
const SVC={supabase:'Supabase',github:'GitHub',resend:'메일',anthropic:'AI'};
function loadUsage(){
  fetch(SB+'/rest/v1/rpc/ops_usage',{method:'POST',headers:H,body:'{}'})
  .then(r=>r.ok?r.json():[]).then(rows=>{
    if(!rows||!rows.length){ $('usage').innerHTML='<p style="font-size:13px;color:var(--gray)">불러오지 못했습니다.</p>'; return; }
    const bad=rows.filter(x=>x.status==='bad').length;
    const warn=rows.filter(x=>x.status==='warn').length;
    $('useN').textContent = bad ? (bad+'건 위험') : (warn ? (warn+'건 주의') : '여유');
    $('usage').innerHTML=rows.map(u=>{
      const known=u.status!=='unknown';
      const pct=known?u.pct:0;
      const uv=known?(Number(u.used).toLocaleString('ko-KR',{maximumFractionDigits:1})):'—';
      const lv=Number(u.lim).toLocaleString('ko-KR');
      return '<div class="use'+(known?'':' unknown')+'">'
        +'<span class="h"><span class="sv">'+esc(SVC[u.service]||u.service)+'</span>'
        +'<b>'+esc(u.label)+'</b>'
        +'<span class="v"><b>'+uv+'</b> / '+lv+' '+esc(u.unit)+'</span></span>'
        +'<span class="bar"><i class="'+(known?u.status:'ok')+'" style="width:'+pct+'%"></i></span>'
        +(u.note?'<span class="nt">'+esc(u.note)+'</span>':'')
        +'</div>';
    }).join('');
  })
  .catch(()=>{ $('usage').innerHTML='<p style="font-size:13px;color:var(--bad)">불러오지 못했습니다.</p>'; });
}

loadUsage();
</script>
