<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>실험 · 기기 공유창(Web Share) — CHEWGUMI</title>
<!-- 실험 화면입니다. 사이트 어디에서도 링크하지 않고(sitemap·robots 에도 없음) 손님 화면의 흐름은 바뀌지 않습니다 (CLAUDE.md §2 · R16).
     무엇을 실험하나: product.html 의 「카카오톡 공유」는 카카오 열쇠를 Supabase 에서 받아 온 뒤에야 동작하고, 아직 못 받았으면
     「링크가 복사되었습니다」 알림창으로 바뀝니다 (product.html 806-819 · 821-827). 브라우저 내장 navigator.share() 는 기기 공유창
     (카카오톡·문자·메일 등 폰에 깔린 것)을 바로 엽니다. 무료이고 외부 서버·열쇠가 없으며 어떤 데이터도 우리 쪽으로 오지 않습니다.
     지원하지 않는 브라우저(데스크톱 일부)에서는 링크 복사로 돌아갑니다. 예시 상품 문구만 쓰고 손님·주문 정보는 없습니다.
     색은 사이트가 이미 쓰는 --main(#D82558)·--ink(#2A1B21) 만 씁니다. -->
<style>
:root{--main:#D82558;--ink:#2A1B21;--gray:#6B5C62;--line:#E8DFE2;--bg:#FFF8FA}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;word-break:keep-all}
main{max-width:30rem;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.25rem;margin:0 0 6px}
p{margin:0 0 14px}
.sub{color:var(--gray);font-size:.9375rem}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
.btn{display:block;width:100%;min-height:48px;border:0;border-radius:999px;background:var(--main);color:#fff;font:inherit;font-weight:700;cursor:pointer;margin-bottom:10px}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#out{min-height:3em;background:#FDECF1;border-radius:12px;padding:10px 14px;font-size:.9375rem}
table{width:100%;border-collapse:collapse;font-size:.875rem;table-layout:fixed}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;overflow-wrap:anywhere;vertical-align:top}
th{font-weight:600}
code{background:#F5EDF0;border-radius:4px;padding:0 4px}
#cap td:last-child{font-weight:700}
</style>
</head>
<body>
<main>
  <h1>기기 공유창 실험 (Web Share)</h1>
  <p class="sub">상품 페이지의 공유가 폰의 공유창으로 바로 열리는지 봅니다. 예시 문구만 쓰며 아무것도 저장하거나 보내지 않습니다.</p>

  <div class="card">
    <table id="cap" aria-label="이 브라우저가 지원하는 것"><tbody></tbody></table>
  </div>

  <button class="btn" id="share" type="button">공유하기 (기기 공유창)</button>
  <button class="btn ghost" id="copy" type="button">링크 복사 (돌아갈 길)</button>

  <div id="out" role="status" aria-live="polite">아직 없음</div>

  <div class="card">
    <table id="log" aria-label="누른 결과"><thead><tr><th scope="col">동작</th><th scope="col">결과</th><th scope="col">걸린 시간</th></tr></thead><tbody></tbody></table>
  </div>
</main>
<script>
(function(){
  var $=function(i){ return document.getElementById(i); };
  var data={ title:"츄구미 (예시 상품)", text:"한입에 건강을 더하다, 츄구미", url:"https://shop.chewgumi.com/product.html" };

  // 지원 확인 — 값을 눈으로 볼 수 있게 표로
  var rows=[
    ["안전한 연결(https)", window.isSecureContext],
    ["navigator.share", typeof navigator.share==="function"],
    ["navigator.canShare", typeof navigator.canShare==="function"],
    ["이 문구를 공유할 수 있음(canShare)", typeof navigator.canShare==="function" ? !!navigator.canShare(data) : "확인 불가"],
    ["navigator.clipboard.writeText", !!(navigator.clipboard && navigator.clipboard.writeText)]
  ];
  var tb=$("cap").tBodies[0];
  rows.forEach(function(r){
    var tr=tb.insertRow();
    tr.insertCell().textContent=r[0];
    tr.insertCell().textContent=(r[1]===true?"예":(r[1]===false?"아니오":String(r[1])));
  });

  function say(msg){ $("out").textContent=msg; }
  function logRow(what, result, ms){
    var tr=$("log").tBodies[0].insertRow(0);
    tr.insertCell().textContent=what;
    tr.insertCell().textContent=result;
    tr.insertCell().textContent=Math.round(ms)+" ms";
  }

  // 클립보드로 복사 — 알림창(alert) 대신 같은 자리에 글로 알립니다 (alert 는 화면 읽기 프로그램이 읽지 않고 흐름을 막습니다)
  function copyLink(){
    var t0=performance.now();
    function done(ok,how){
      say(ok ? "링크를 복사했어요." : "복사하지 못했어요. 주소창의 주소를 눌러 직접 복사해 주세요.");
      logRow("링크 복사", (ok?"성공":"실패")+" ("+how+")", performance.now()-t0);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(data.url).then(function(){ done(true,"clipboard"); }, function(){ legacy(); });
    } else { legacy(); }
    function legacy(){
      var a=document.createElement("textarea"); a.value=data.url; a.setAttribute("readonly",""); a.style.position="fixed"; a.style.opacity="0";
      document.body.appendChild(a); a.select();
      var ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
      a.remove(); done(ok,"execCommand");
    }
  }

  function shareNow(){
    if(typeof navigator.share!=="function"){ say("이 브라우저에는 공유창이 없어요. 링크 복사로 바꿉니다."); logRow("공유", "지원 안 함 → 복사로", 0); return copyLink(); }
    var t0=performance.now();
    navigator.share(data).then(function(){
      // 성공해도 「보냈다」인지 「그냥 닫았다」인지 구별되지 않습니다 — API 가 알려 주지 않습니다
      say("공유창을 마쳤어요.");
      logRow("공유", "끝남 (보냄/닫음 구별 불가)", performance.now()-t0);
    }, function(err){
      var name=err&&err.name;
      if(name==="AbortError"){ say("공유를 취소했어요."); logRow("공유", "취소 (AbortError)", performance.now()-t0); }
      else { say("공유창을 열지 못했어요. 링크 복사로 바꿉니다."); logRow("공유", "실패 ("+name+") → 복사로", performance.now()-t0); copyLink(); }
    });
  }

  $("share").addEventListener("click", shareNow);
  $("copy").addEventListener("click", copyLink);
})();
</script>
</body>
</html>
