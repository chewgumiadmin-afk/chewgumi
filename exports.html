<!DOCTYPE html>
<!-- ChewGumi Export & Certification Manager v1 · MedIT -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>수출 · 인증 관리 | CHEWGUMI ADMIN</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT/fonts/variable/woff2/SUIT-Variable.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--main:#D82558;--main2:#E95073;--light:#FFE4E6;--ink:#000;--gray:#797979;
  --line:rgba(255,255,255,.85);--glass:rgba(255,255,255,.62)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"SUIT Variable","SUIT","Noto Sans KR",sans-serif;color:var(--ink);min-height:100vh;padding:26px 16px 70px;
  background:radial-gradient(900px 500px at 12% -5%,rgba(236,94,134,.14),transparent 60%),
    linear-gradient(180deg,#FFF7FA,#FDF3F5 45%,#FFF9F4)}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:2px solid var(--main2);outline-offset:3px;border-radius:8px}
.wrap{max-width:1040px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.top h1{font-family:'Poppins',sans-serif;font-size:25px}
.top .s{font-size:11px;letter-spacing:3px;color:var(--gray)}
.top a{font-size:12px;color:var(--gray);text-decoration:underline;text-underline-offset:3px}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:16px;
  backdrop-filter:blur(20px) saturate(120%);-webkit-backdrop-filter:blur(20px) saturate(120%);
  box-shadow:0 12px 30px rgba(0,0,0,.07),inset 0 1px 0 rgba(255,255,255,.9)}
.panel h2{font-size:11px;letter-spacing:2.5px;color:var(--gray);font-weight:700;margin-bottom:14px}
input,select,textarea{width:100%;padding:12px 14px;margin-bottom:9px;border-radius:13px;font-size:13.5px;
  font-family:inherit;border:1px solid var(--line);background:rgba(255,255,255,.8)}
textarea{resize:vertical;min-height:80px}
.btn{padding:12px 22px;border:0;border-radius:999px;font-size:13px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--main2),var(--main));box-shadow:0 8px 20px rgba(216,37,88,.3)}
.btn.ghost{background:rgba(255,255,255,.8);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.msg{font-size:12px;color:var(--gray);margin-top:8px;min-height:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:6px}
.stat{background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:15px;padding:14px;text-align:center}
.stat .l{font-size:11px;color:var(--gray)}
.stat .v{margin-top:5px;font-size:20px;font-weight:800;color:var(--main)}
.cat{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--main);margin:18px 0 6px;padding-top:12px;
  border-top:1px solid rgba(0,0,0,.08)}
.cat:first-of-type{border-top:0;padding-top:0;margin-top:0}
.it{border-bottom:1px solid rgba(0,0,0,.06);padding:13px 2px}
.it:last-child{border-bottom:0}
.it-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.it-n{flex:1;min-width:180px;font-size:14px;font-weight:600}
.it-n em{font-style:normal;font-size:11.5px;color:var(--gray);font-weight:500}
.st{font-size:10.5px;font-weight:700;padding:5px 11px;border-radius:999px;color:#fff;white-space:nowrap}
.st.todo{background:#999}.st.preparing{background:#E9A23B}.st.submitted{background:#3182F6}
.st.issued{background:#2AA060}.st.rejected{background:#C0395C}.st.expired{background:#7B61FF}.st.na{background:#ccc;color:#666}
.it-b{margin-top:7px;font-size:12px;color:#555;line-height:1.7}
.it-b b{color:var(--ink)}
.it-act{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap;align-items:center}
.it-act select,.it-act input{width:auto;margin:0;padding:8px 11px;font-size:12px;border-radius:11px}
.mini{padding:8px 14px;border-radius:999px;font-size:11.5px;font-weight:700;
  background:rgba(255,255,255,.85);border:1px solid var(--line);color:var(--ink)}
.mini.on{background:linear-gradient(135deg,var(--main2),var(--main));color:#fff;border-color:transparent}
.logs{margin-top:10px;padding-left:12px;border-left:2px solid rgba(216,37,88,.2)}
.log{padding:7px 0;font-size:12px;line-height:1.6;border-bottom:1px dashed rgba(0,0,0,.06)}
.log:last-child{border-bottom:0}
.log .k{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(216,37,88,.1);color:var(--main)}
.log .d{color:var(--gray);font-size:11px}
.empty{padding:30px 0;text-align:center;color:var(--gray);font-size:13px}
.hide{display:none}
.dim{position:fixed;inset:0;background:rgba(20,10,14,.45);backdrop-filter:blur(5px);z-index:1400;
  display:none;align-items:center;justify-content:center;padding:20px}
.dim.on{display:flex}
.box{width:100%;max-width:440px;max-height:88vh;overflow-y:auto;border-radius:22px;padding:24px;
  background:rgba(255,255,255,.95);border:1px solid var(--line);box-shadow:0 22px 54px rgba(0,0,0,.2)}
.box h3{font-size:18px;font-weight:700;margin-bottom:12px}
.box label{display:block;font-size:12px;font-weight:600;margin:10px 0 5px}
.ract{display:flex;gap:8px;margin-top:14px}
.ract .btn{flex:1}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>Export &amp; Certification</h1><div class="s">수출 · 식품 인증 관리</div></div>
    <div><a href="admin.html">통합 관리</a> · <a href="orders.html">주문 관리</a> · <a href="index.html">사이트</a></div>
  </div>

  <div class="panel" id="login">
    <h2>ADMIN LOGIN</h2>
    <input id="em" type="email" placeholder="운영자 이메일" autocomplete="email">
    <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
    <button class="btn" onclick="doLogin()">로그인</button>
    <div class="msg" id="lmsg"></div>
  </div>

  <div id="area" class="hide">
    <div class="panel">
      <h2>진행 현황</h2>
      <div class="stats">
        <div class="stat"><div class="l">발급 완료</div><div class="v" id="cIssued">0</div></div>
        <div class="stat"><div class="l">진행 중</div><div class="v" id="cProg">0</div></div>
        <div class="stat"><div class="l">미착수</div><div class="v" id="cTodo">0</div></div>
        <div class="stat"><div class="l">만료 임박</div><div class="v" id="cExp">0</div></div>
      </div>
      <div class="msg">만료 임박은 90일 이내 만료 예정 건입니다.</div>
    </div>

    <div class="panel">
      <h2>인증 · 서류 목록</h2>
      <div id="list"><div class="empty">불러오는 중…</div></div>
    </div>

    <div class="panel">
      <h2>계정</h2>
      <div class="msg" id="who" style="margin-top:0"></div>
      <button class="btn ghost" onclick="doLogout()" style="max-width:140px">로그아웃</button>
    </div>
  </div>
</div>

<div class="dim" id="dim" onclick="if(event.target===this)closeLog()">
  <div class="box">
    <h3>이력 추가</h3>
    <div class="msg" id="lgSub" style="margin-top:0"></div>
    <label>구분</label>
    <select id="lgKind">
      <option value="email_out">메일 발신</option>
      <option value="email_in">메일 수신</option>
      <option value="submit">서류 제출</option>
      <option value="receive">서류 수령</option>
      <option value="call">전화 · 상담</option>
      <option value="note">메모</option>
    </select>
    <label>상대처</label>
    <input id="lgCp" placeholder="예) 식약처 수출지원과, 000 번역공증">
    <label>제목</label>
    <input id="lgTitle" placeholder="예) 자유판매증명서 신청서 발송">
    <label>내용</label>
    <textarea id="lgBody" placeholder="주고받은 내용, 첨부 서류, 다음 할 일 등"></textarea>
    <div class="ract">
      <button class="btn ghost" onclick="closeLog()">닫기</button>
      <button class="btn" onclick="saveLog()">저장</button>
    </div>
    <div class="msg" id="lgMsg"></div>
  </div>
</div>

<script>
const SB='https://psynvpuedzjvytsgdhgg.supabase.co';
const KEY='sb_publishable_Tz7vgJXgYHQ3tyUfm87WTw_vV1Dxfuk';
const ST={todo:'미착수',preparing:'준비중',submitted:'제출됨',issued:'발급완료',
  rejected:'보완요청',expired:'만료',na:'해당없음'};
const KD={note:'메모',email_out:'메일발신',email_in:'메일수신',call:'상담',submit:'제출',receive:'수령'};
let token=null,who='',ITEMS=[],LOGS={},curItem=null,openLogs={};
try{const s=JSON.parse(localStorage.getItem('cg_sb')||'null');if(s){token=s.t;who=s.u;}}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const H=()=>({apikey:KEY,Authorization:'Bearer '+token});

function sync(){const on=!!token;
  $('login').classList.toggle('hide',on);$('area').classList.toggle('hide',!on);
  if(on){$('who').textContent=who+' 님으로 로그인 중입니다.';load();}}

function doLogin(){
  const email=$('em').value.trim(),pw=$('pw').value;
  if(!email||!pw)return $('lmsg').textContent='이메일과 비밀번호를 입력해 주세요.';
  fetch(SB+'/auth/v1/token?grant_type=password',{method:'POST',
    headers:{apikey:KEY,'Content-Type':'application/json'},
    body:JSON.stringify({email,password:pw})})
  .then(r=>r.json()).then(d=>{
    if(d.access_token){token=d.access_token;who=email.split('@')[0];
      try{localStorage.setItem('cg_sb',JSON.stringify({t:token,u:who}));}catch(e){}
      $('lmsg').textContent='';sync();}
    else $('lmsg').textContent='로그인 실패: 운영자 계정인지 확인해 주세요.';
  }).catch(()=>$('lmsg').textContent='네트워크 오류가 발생했습니다.');
}
function doLogout(){token=null;who='';try{localStorage.removeItem('cg_sb');}catch(e){}sync();}

function load(){
  Promise.all([
    fetch(SB+'/rest/v1/cert_items?select=*&order=sort_order',{headers:H()}).then(r=>r.ok?r.json():Promise.reject(r.status)),
    fetch(SB+'/rest/v1/cert_logs?select=*&order=created_at.desc',{headers:H()}).then(r=>r.ok?r.json():[])
  ]).then(([items,logs])=>{
    ITEMS=items;LOGS={};
    logs.forEach(l=>{(LOGS[l.item_id]=LOGS[l.item_id]||[]).push(l);});
    stats();render();
  }).catch(s=>{$('list').innerHTML='<div class="empty">'+
    (s===401?'로그인이 만료되었습니다.':'운영자 계정으로 로그인해 주세요.')+'</div>';});
}

function stats(){
  const soon=new Date();soon.setDate(soon.getDate()+90);
  let a=0,b=0,c=0,d=0;
  ITEMS.forEach(i=>{
    if(i.status==='issued')a++;
    else if(['preparing','submitted','rejected'].includes(i.status))b++;
    else if(i.status==='todo')c++;
    if(i.expires_at&&new Date(i.expires_at)<=soon)d++;
  });
  $('cIssued').textContent=a;$('cProg').textContent=b;$('cTodo').textContent=c;$('cExp').textContent=d;
}

function render(){
  const box=$('list');
  if(!ITEMS.length){box.innerHTML='<div class="empty">등록된 항목이 없습니다.</div>';return;}
  let html='',cat='';
  ITEMS.forEach(i=>{
    if(i.category!==cat){cat=i.category;html+='<div class="cat">'+esc(cat)+'</div>';}
    const lg=LOGS[i.id]||[];
    const open=openLogs[i.id];
    html+='<div class="it"><div class="it-h">'
      +'<span class="it-n">'+esc(i.name)+(i.name_en?' <em>'+esc(i.name_en)+'</em>':'')+'</span>'
      +'<span class="st '+i.status+'">'+(ST[i.status]||i.status)+'</span></div>'
      +'<div class="it-b"><b>발급처</b> '+esc(i.authority||'-')
      +(i.purpose?'<br><b>용도</b> '+esc(i.purpose):'')
      +(i.required_docs?'<br><b>필요서류</b> '+esc(i.required_docs):'')
      +(i.issued_at?'<br><b>발급일</b> '+esc(i.issued_at):'')
      +(i.expires_at?' · <b>만료</b> '+esc(i.expires_at):'')
      +(i.note?'<br><b>메모</b> '+esc(i.note):'')+'</div>'
      +'<div class="it-act">'
      +'<select id="s'+i.id+'">'+Object.keys(ST).map(k=>'<option value="'+k+'"'+(k===i.status?' selected':'')+'>'+ST[k]+'</option>').join('')+'</select>'
      +'<input type="date" id="d'+i.id+'" value="'+(i.issued_at||'')+'" title="발급일">'
      +'<input type="date" id="e'+i.id+'" value="'+(i.expires_at||'')+'" title="만료일">'
      +'<button class="mini" onclick="saveItem('+i.id+')">저장</button>'
      +'<button class="mini" onclick="openLog('+i.id+')">이력 추가</button>'
      +'<button class="mini'+(open?' on':'')+'" onclick="toggleLogs('+i.id+')">이력 '+lg.length+'건</button>'
      +'</div>';
    if(open&&lg.length){
      html+='<div class="logs">'+lg.map(l=>'<div class="log">'
        +'<span class="k">'+(KD[l.kind]||l.kind)+'</span> <b>'+esc(l.title||'(제목 없음)')+'</b>'
        +(l.counterpart?' · '+esc(l.counterpart):'')
        +'<div class="d">'+new Date(l.created_at).toLocaleString('ko-KR')+(l.created_by?' · '+esc(l.created_by):'')+'</div>'
        +(l.body?'<div>'+esc(l.body).replace(/\n/g,'<br>')+'</div>':'')+'</div>').join('')+'</div>';
    }
    html+='</div>';
  });
  box.innerHTML=html;
}
function toggleLogs(id){openLogs[id]=!openLogs[id];render();}

function saveItem(id){
  const body={status:$('s'+id).value,
    issued_at:$('d'+id).value||null,expires_at:$('e'+id).value||null};
  fetch(SB+'/rest/v1/cert_items?id=eq.'+id,{method:'PATCH',
    headers:{...H(),'Content-Type':'application/json',Prefer:'return=minimal'},
    body:JSON.stringify(body)})
  .then(r=>{if(r.ok)load();else alert('저장 권한이 없습니다.');})
  .catch(()=>alert('네트워크 오류가 발생했습니다.'));
}

function openLog(id){curItem=id;
  const it=ITEMS.find(x=>x.id===id);
  $('lgSub').textContent=it?it.name:'';
  ['lgCp','lgTitle','lgBody'].forEach(x=>$(x).value='');
  $('lgMsg').textContent='';$('dim').classList.add('on');}
function closeLog(){$('dim').classList.remove('on');curItem=null;}
function saveLog(){
  if(!curItem)return;
  const body={item_id:curItem,kind:$('lgKind').value,counterpart:$('lgCp').value.trim(),
    title:$('lgTitle').value.trim(),body:$('lgBody').value.trim(),created_by:who};
  if(!body.title&&!body.body)return $('lgMsg').textContent='제목이나 내용을 입력해 주세요.';
  fetch(SB+'/rest/v1/cert_logs',{method:'POST',
    headers:{...H(),'Content-Type':'application/json',Prefer:'return=minimal'},
    body:JSON.stringify(body)})
  .then(r=>{if(r.ok){openLogs[curItem]=true;closeLog();load();}
    else $('lgMsg').textContent='저장에 실패했습니다.';})
  .catch(()=>$('lgMsg').textContent='네트워크 오류가 발생했습니다.');
}
sync();
</script>
<script src="assets/lite.js" defer></script>
</body>
</html>
