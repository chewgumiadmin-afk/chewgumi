<!DOCTYPE html>
<!-- ChewGumi Subscription Admin v1 · MedIT -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>정기구독 관리 | CHEWGUMI ADMIN</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">

<script src="assets/auth.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT/fonts/variable/woff2/SUIT-Variable.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--main:#D82558;--main2:#E95073;--ok:#2AA060;--warn:#E9A23B;--bad:#C0395C;
  --ink:#1a1a1a;--gray:#797979;--line:rgba(255,255,255,.85);--glass:rgba(255,255,255,.62)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"SUIT Variable","SUIT","Noto Sans KR",sans-serif;color:var(--ink);min-height:100vh;padding:26px 16px 70px;
  background:radial-gradient(900px 500px at 12% -5%,rgba(236,94,134,.13),transparent 60%),
    linear-gradient(180deg,#FFF7FA,#FDF3F5 45%,#FFF9F4)}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--main2);outline-offset:3px;border-radius:8px}
.wrap{max-width:1060px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.top h1{font-family:'Poppins',sans-serif;font-size:25px}
.top .s{font-size:11px;letter-spacing:3px;color:var(--gray)}
.top a{font-size:12px;color:var(--gray);text-decoration:underline;text-underline-offset:3px}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:16px;
  backdrop-filter:blur(20px) saturate(120%);-webkit-backdrop-filter:blur(20px) saturate(120%);
  box-shadow:0 12px 30px rgba(0,0,0,.07),inset 0 1px 0 rgba(255,255,255,.9)}
.panel h2{font-size:11px;letter-spacing:2.5px;color:var(--gray);font-weight:700;margin-bottom:14px}
input,select,textarea{width:100%;padding:11px 13px;border-radius:12px;font-size:12.5px;font-family:inherit;
  border:1px solid var(--line);background:rgba(255,255,255,.85)}
label{display:block;font-size:12px;font-weight:600;margin:10px 0 5px}
.btn{padding:12px 22px;border:0;border-radius:999px;font-size:13px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--main2),var(--main));box-shadow:0 8px 20px rgba(216,37,88,.3)}
.btn.ghost{background:rgba(255,255,255,.8);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.mini{padding:8px 13px;border-radius:999px;font-size:11.5px;font-weight:700;
  background:rgba(255,255,255,.85);border:1px solid var(--line);color:var(--ink)}
.mini.go{background:linear-gradient(135deg,#37B26B,#2AA060);color:#fff;border-color:transparent}
.mini.d{color:var(--bad);border-color:rgba(192,57,92,.3)}
.msg{font-size:12px;color:var(--gray);margin-top:9px;min-height:16px;line-height:1.75}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.stat{background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:15px;padding:14px;text-align:center}
.stat .l{font-size:11px;color:var(--gray)}
.stat .v{margin-top:5px;font-size:20px;font-weight:800;color:var(--main)}
.stat.alert{border-color:rgba(233,162,59,.5);background:rgba(233,162,59,.12)}
.stat.alert .v{color:#9a6414}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{padding:9px 14px;border-radius:999px;font-size:11.5px;font-weight:600;
  background:rgba(255,255,255,.75);border:1px solid var(--line);color:var(--gray)}
.chips button.on{background:linear-gradient(135deg,var(--main2),var(--main));color:#fff;border-color:transparent}
.srow{padding:15px 4px;border-bottom:1px solid rgba(0,0,0,.06)}
.srow:last-child{border-bottom:0}
.sh{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.sh .no{font-family:'Poppins',sans-serif;font-weight:700;font-size:12.5px;color:var(--gray)}
.sh .nm{flex:1;min-width:150px;font-size:14px;font-weight:700}
.sh .amt{font-size:14px;font-weight:800;color:var(--main)}
.st{font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:999px;color:#fff;white-space:nowrap}
.st.pending{background:var(--warn)}.st.active{background:var(--ok)}
.st.paused{background:#3182F6}.st.cancelled{background:#aaa}.st.done{background:#777}
.sb{margin-top:9px;font-size:12.5px;line-height:1.85;color:#555}
.sb b{color:var(--ink)}
.sa{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap;align-items:center}
.sa input{width:150px;padding:8px 11px}
.due{background:rgba(233,162,59,.1);border-radius:12px}
.empty{padding:32px 0;text-align:center;color:var(--gray);font-size:13px}
.prow{display:grid;grid-template-columns:1.6fr .8fr .8fr .8fr;gap:9px;padding:12px 4px;
  border-bottom:1px solid rgba(0,0,0,.06);font-size:12.5px;align-items:center}
.prow:last-child{border-bottom:0}
.prow .pn{font-weight:700}
.prow .pn small{display:block;color:var(--gray);font-weight:400;font-size:11px;margin-top:2px}
.hide{display:none}
@media(max-width:860px){.stats{grid-template-columns:repeat(2,1fr)}
  .prow{grid-template-columns:1fr 1fr;gap:5px 9px}}

/* 구독 상품 편집 */
.pcard{padding:15px 4px;border-bottom:1px solid rgba(0,0,0,.06)}
.pcard:last-child{border-bottom:0}
.ph{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.ph .nm{flex:1;min-width:150px;font-size:14px;font-weight:700}
.ph .nm small{display:block;color:var(--gray);font-weight:400;font-size:11px;margin-top:2px}
.ph .off{font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:999px;
  background:rgba(216,37,88,.1);color:var(--main)}
.pf{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.pf label{font-size:11px;font-weight:600;margin:0 0 4px}
.pf input,.pf select{padding:9px 11px;font-size:12px}
.pa{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
/* 편집 모달 */
.mo{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;
  padding:20px;background:rgba(20,10,14,.5);backdrop-filter:blur(6px)}
.mo-b{max-width:520px;width:100%;background:#fff;border-radius:22px;padding:24px;
  max-height:88vh;overflow-y:auto;box-shadow:0 22px 54px rgba(0,0,0,.24)}
.mo-b h3{font-size:17px;font-weight:800;margin-bottom:14px}
.mo-b .g2{display:grid;grid-template-columns:1fr 1fr;gap:9px 11px}
.mo-b textarea{min-height:70px;resize:vertical;line-height:1.7}
/* 이력 */
.arow{display:grid;grid-template-columns:.7fr 1.7fr 1fr .9fr;gap:9px;padding:11px 4px;
  border-bottom:1px solid rgba(0,0,0,.06);font-size:12.5px;align-items:center}
.arow:last-child{border-bottom:0}
.arow .ac{font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:999px;
  color:#fff;text-align:center;white-space:nowrap}
.ac.create{background:var(--ok)}.ac.update{background:#3182F6}
.ac.delete{background:var(--bad)}.ac.restore{background:var(--warn)}.ac.other{background:#999}
.arow .tt{line-height:1.5}
.arow .tt small{display:block;color:var(--gray);font-size:11px;margin-top:2px}
.diff{background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:14px;
  padding:14px;margin-top:10px;font-size:12px;line-height:1.8}
.diff .k{font-weight:700;color:var(--main)}
.diff .b{color:#999;text-decoration:line-through}
.diff .a{color:var(--ok);font-weight:600}
@media(max-width:860px){.pf{grid-template-columns:1fr 1fr}.mo-b .g2{grid-template-columns:1fr}
  .arow{grid-template-columns:1fr 1fr;gap:5px 9px}}

  /* 모바일 — 긴 글자가 화면을 밀어내지 않도록 */
  @media(max-width:640px){
    body{overflow-x:hidden}
    .msg,.hint,p,li,td,th,.rb,.ib,.sb,.d{word-break:keep-all;overflow-wrap:anywhere}
    [style*="nowrap"],.nowrap{white-space:normal !important}
    .acts,.chips,.tabs,.sug,.eps,.kinds{overflow-x:auto;-webkit-overflow-scrolling:touch;
      scrollbar-width:none;padding-bottom:2px}
    .acts::-webkit-scrollbar,.chips::-webkit-scrollbar,
    .tabs::-webkit-scrollbar,.sug::-webkit-scrollbar{display:none}
    .out,pre,code{overflow-x:auto;word-break:break-all}
  }
</style>
<link rel="stylesheet" href="assets/glass.css">
<link rel="stylesheet" href="assets/ui.css">
<link rel="stylesheet" href="assets/stable.css">
<link rel="stylesheet" href="assets/admin-ui.css">
<link rel="stylesheet" href="assets/popup.css">
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>Subscriptions</h1><div class="s">정기구독 관리</div></div>
    <div><a href="console.html">관리자 홈</a> · <a href="orders.html">주문</a> · <a href="subscribe.html" target="_blank" rel="noopener">구독 페이지</a></div>
  </div>

  <div class="panel" id="login">
    <h2>ADMIN LOGIN</h2>
    <input id="em" type="email" placeholder="운영자 이메일" autocomplete="email" style="margin-bottom:9px">
    <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" style="margin-bottom:12px">
    <button class="btn" onclick="doLogin()">로그인</button>
    <div class="msg" id="lmsg"></div>
  </div>

  <div id="area" class="hide">
    <div class="panel">
      <h2>구독 현황</h2>
      <div class="stats">
        <div class="stat" id="bPend"><div class="l">입금 대기</div><div class="v" id="cPend">0</div></div>
        <div class="stat"><div class="l">구독 중</div><div class="v" id="cAct">0</div></div>
        <div class="stat" id="bDue"><div class="l">오늘 발송</div><div class="v" id="cDue">0</div></div>
        <div class="stat"><div class="l">월 예상 매출</div><div class="v" id="cRev">0</div></div>
      </div>
      <div class="msg" id="alertMsg" style="margin-top:12px"></div>
    </div>

    <div class="panel">
      <h2>구독 목록</h2>
      <div class="chips" id="filters">
        <button class="on" data-f="all">전체</button>
        <button data-f="pending">입금 대기</button>
        <button data-f="active">구독 중</button>
        <button data-f="due">발송 예정</button>
        <button data-f="paused">일시 중지</button>
        <button data-f="cancelled">해지</button>
      </div>
      <div id="list"><div class="empty">불러오는 중…</div></div>
      <div class="msg" id="smsg"></div>
    </div>

    <div class="panel">
      <h2>구독 상품 관리</h2>
      <div class="acts" style="margin-bottom:12px">
        <button class="mini go" onclick="planNew()">+ 새 구독 상품 추가</button>
        <button class="mini" onclick="loadPlans()">새로고침</button>
      </div>
      <div id="plans"><div class="empty">불러오는 중…</div></div>
      <div class="msg" id="pmsg">금액을 수정하고 [저장]을 누르시면 구독 페이지에 바로 반영됩니다.</div>

      <div id="delBox" class="hide" style="margin-top:14px;padding-top:14px;
        border-top:1px solid rgba(0,0,0,.07)">
        <div style="font-size:12px;font-weight:700;color:var(--gray);margin-bottom:9px">
          삭제된 상품</div>
        <div id="delList"></div>
      </div>
    </div>

    <div class="panel">
      <h2>변경 이력</h2>
      <div style="display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:9px;margin-bottom:12px">
        <select id="alArea" onchange="loadAudit()"><option value="">전체 영역</option></select>
        <select id="alAct" onchange="loadAudit()">
          <option value="">전체 동작</option>
          <option value="create">추가</option>
          <option value="update">수정</option>
          <option value="delete">삭제</option>
          <option value="restore">복원</option>
        </select>
        <input id="alQ" placeholder="이름·내용 검색"
          onkeydown="if(event.key==='Enter')loadAudit()">
      </div>
      <div id="audit"><div class="empty">불러오는 중…</div></div>
      <div class="msg" id="amsg"></div>
    </div>

    <div class="panel">
      <h2>계정</h2>
      <div class="msg" id="who" style="margin-top:0"></div>
      <button class="btn ghost" onclick="doLogout()" style="max-width:140px">로그아웃</button>
    </div>
  </div>
</div>

<script src="assets/lite.js" defer></script>
<script>
const SB='https://psynvpuedzjvytsgdhgg.supabase.co';
const KEY='sb_publishable_Tz7vgJXgYHQ3tyUfm87WTw_vV1Dxfuk';
const FN=SB+'/functions/v1/subscribe';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const won=v=>Number(v||0).toLocaleString();
const ST={pending:'입금 대기',active:'구독 중',paused:'일시 중지',cancelled:'해지',done:'종료'};
let token=null,who='',SUBS=[],PLANS=[],filt='all';
try{var _u=CGAuth.user(); if(_u&&CGAuth.isIn()){who=_u.name; token='1';}}catch(e){}
const H=()=>({apikey:KEY,'Content-Type':'application/json',
  Authorization:'Bearer '+((function(){try{var s=JSON.parse(localStorage.getItem('cg_sb')||'null');return s&&s.t||'';}catch(e){return '';}})())});
const call=p=>fetch(FN,{method:'POST',headers:H(),body:JSON.stringify(p)})
  .then(r=>r.json().then(d=>({ok:r.ok,d})));
const today=()=>new Date().toISOString().slice(0,10);

document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#filters button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); filt=b.dataset.f; render();});

function sync(){
  if(window.CGAuth && CGAuth.isIn() && !window._cgChecked){
    window._cgChecked=1;
    CGAuth.token().then(function(t){
      if(t){ token=t; sync(); }
      else { token=null; sync(); }
    });
  }const on=!!token;
  $('login').classList.toggle('hide',on);$('area').classList.toggle('hide',!on);
  if(on){$('who').textContent=who+' 님으로 로그인 중입니다.';load();loadPlans();loadAudit();}}
function doLogin(){
  const email=$('em').value.trim(),pw=$('pw').value;
  if(!email||!pw)return $('lmsg').textContent='이메일과 비밀번호를 입력해 주세요.';
  CGAuth.login(email,pw).then(function(at){ var d={access_token:at};
    if(d.access_token){token=d.access_token;who=email.split('@')[0];
      
      $('lmsg').textContent='';sync();}
    else $('lmsg').textContent='로그인 실패: 운영자 계정인지 확인해 주세요.';
  }).catch(()=>$('lmsg').textContent='네트워크 오류가 발생했습니다.');
}
function doLogout(){token=null;who='';try{CGAuth.logout();}catch(e){}try{localStorage.removeItem('cg_sb');}catch(e){}sync();}

function load(){
  call({action:'list'}).then(({ok,d})=>{
    if(!ok){ $('list').innerHTML='<div class="empty">'+(d.error||'불러오지 못했습니다.')+'</div>'; return; }
    SUBS=d.items||[]; stats(); render();
  }).catch(()=>{$('list').innerHTML='<div class="empty">네트워크 오류가 발생했습니다.</div>';});
}
function stats(){
  const t=today();
  const pend=SUBS.filter(s=>s.status==='pending');
  const act=SUBS.filter(s=>s.status==='active');
  const due=act.filter(s=>s.next_ship_date&&s.next_ship_date<=t);
  $('cPend').textContent=pend.length;
  $('cAct').textContent=act.length;
  $('cDue').textContent=due.length;
  $('cRev').textContent=won(act.reduce((n,s)=>n+(s.price_month||0),0));
  $('bPend').classList.toggle('alert',pend.length>0);
  $('bDue').classList.toggle('alert',due.length>0);
  const a=[];
  if(pend.length) a.push('⚠ 입금 확인이 필요한 구독 '+pend.length+'건');
  if(due.length) a.push('⚠ 오늘 발송할 구독 '+due.length+'건: '
    +due.map(s=>esc(s.buyer_name)).join(', '));
  $('alertMsg').innerHTML=a.length?a.join('<br>'):'처리할 항목이 없습니다.';
}
function render(){
  const t=today();
  let rows=SUBS.filter(s=>{
    if(filt==='all') return true;
    if(filt==='due') return s.status==='active'&&s.next_ship_date&&s.next_ship_date<=t;
    return s.status===filt;
  });
  if(!rows.length){$('list').innerHTML='<div class="empty">해당 구독이 없습니다.</div>';return;}
  $('list').innerHTML=rows.map(s=>{
    const isDue=s.status==='active'&&s.next_ship_date&&s.next_ship_date<=t;
    return '<div class="srow'+(isDue?' due':'')+'">'
      +'<div class="sh"><span class="no">'+esc(s.sub_no)+'</span>'
      +'<span class="nm">'+esc(s.plan_name)+' · '+esc(s.buyer_name)+'</span>'
      +'<span class="st '+s.status+'">'+(ST[s.status]||s.status)+'</span>'
      +'<span class="amt">월 '+won(s.price_month)+'원</span></div>'
      +'<div class="sb">'
      +esc(s.buyer_phone)+(s.buyer_email?' · '+esc(s.buyer_email):'')+'<br>'
      +(s.zipcode?'['+esc(s.zipcode)+'] ':'')+esc(s.addr1)+' '+esc(s.addr2||'')
      +(s.option_choice?'<br>구성: <b>'+esc(s.option_choice)+'</b>':'')
      +(s.memo?'<br>메모: '+esc(s.memo):'')
      +'<br>신청 '+new Date(s.created_at).toLocaleDateString('ko-KR')
      +' · 발송 '+(s.shipped_count||0)+'회'
      +(s.next_ship_date?' · 다음 <b'+(isDue?' style="color:var(--main)"':'')+'>'
        +s.next_ship_date+'</b>':'')
      +(s.months>1?' · 12개월 약정':'')
      +'</div><div class="sa">'
      +(s.status==='pending'
        ?'<button class="mini go" onclick="setSt('+s.id+',\'active\')">입금 확인 · 구독 시작</button>':'')
      +(s.status==='active'
        ?'<button class="mini go" onclick="ship('+s.id+')">발송 처리</button>'
         +'<button class="mini" onclick="setSt('+s.id+',\'paused\')">일시 중지</button>':'')
      +(s.status==='paused'
        ?'<button class="mini go" onclick="setSt('+s.id+',\'active\')">재개</button>':'')
      +(s.status!=='cancelled'&&s.status!=='done'
        ?'<button class="mini d" onclick="setSt('+s.id+',\'cancelled\')">해지</button>':'')
      +'</div></div>';
  }).join('');
}
function setSt(id,st){
  const L={active:'구독을 시작할까요?\n고객에게 시작 안내가 발송됩니다.',
    paused:'일시 중지할까요?',cancelled:'해지할까요?\n되돌리려면 다시 신청해야 합니다.'}[st];
  if(L&&!confirm(L)) return;
  $('smsg').textContent='처리 중…';
  const p={action:'setStatus',id,status:st};
  if(st==='active'){const d=new Date();d.setDate(d.getDate()+1);p.nextDate=d.toISOString().slice(0,10);}
  call(p).then(({ok,d})=>{
    $('smsg').textContent=ok?'처리되었습니다.':(d.error||'처리에 실패했습니다.');
    if(ok) load();
  }).catch(()=>{$('smsg').textContent='네트워크 오류가 발생했습니다.';});
}
function ship(id){
  if(!confirm('발송 처리할까요?\n다음 배송일이 한 달 뒤로 자동 설정되고 고객에게 안내가 발송됩니다.')) return;
  $('smsg').textContent='발송 처리 중…';
  call({action:'ship',id}).then(({ok,d})=>{
    $('smsg').textContent=ok?('발송 처리되었습니다. 다음 배송일 '+d.next):(d.error||'실패했습니다.');
    if(ok) load();
  }).catch(()=>{$('smsg').textContent='네트워크 오류가 발생했습니다.';});
}

function loadPlans(){
  call({action:'planList'}).then(({ok,d})=>{
    if(!ok){$('plans').innerHTML='<div class="empty">'+(d.error||'불러오지 못했습니다.')+'</div>';return;}
    PLANS=d.plans||[];
    if(!PLANS.length){$('plans').innerHTML='<div class="empty">등록된 구독 상품이 없습니다. '
      +'[+ 새 구독 상품 추가]로 만들어 주세요.</div>';}
    else $('plans').innerHTML=PLANS.map(p=>{
      const off=p.price_origin>p.price_month
        ? Math.round((1-p.price_month/p.price_origin)*100):0;
      return '<div class="pcard"><div class="ph">'
        +'<span class="nm">'+esc(p.name_kr)
        +'<small>'+esc(p.name_en)+' · '+esc(p.tagline||'')+'</small></span>'
        +(off?'<span class="off">'+off+'% 할인</span>':'')
        +'<span class="st '+(p.active?'active':'paused')+'">'
        +(p.active?'노출 중':'숨김')+'</span></div>'
        +'<div class="pf">'
        +'<div><label>월 구독가</label><input id="pm'+p.id+'" type="number" value="'+p.price_month+'" min="0"></div>'
        +'<div><label>정가</label><input id="po'+p.id+'" type="number" value="'+p.price_origin+'" min="0"></div>'
        +'<div><label>약정 개월</label><input id="pmo'+p.id+'" type="number" value="'+(p.months||1)+'" min="1"></div>'
        +'<div><label>노출 순서</label><input id="ps'+p.id+'" type="number" value="'+(p.sort_order||99)+'" min="1"></div>'
        +'</div><div class="pa">'
        +'<button class="mini go" onclick="quickSave('+p.id+')">저장</button>'
        +'<button class="mini" onclick="planEdit('+p.id+')">자세히 편집</button>'
        +'<button class="mini" onclick="planToggle('+p.id+','+(!p.active)+')">'
        +(p.active?'숨기기':'노출하기')+'</button>'
        +'<button class="mini d" onclick="planDel('+p.id+',\''+esc(p.code)+'\')">삭제</button>'
        +'</div></div>';
    }).join('');

    const del=d.deleted||[];
    $('delBox').classList.toggle('hide',!del.length);
    $('delList').innerHTML=del.map(x=>
      '<div class="arow" style="grid-template-columns:2fr 1fr 1fr">'
      +'<div>'+esc(x.name_kr)+'</div>'
      +'<div style="font-size:11.5px;color:var(--gray)">'
      +new Date(x.deleted_at).toLocaleDateString('ko-KR')+'</div>'
      +'<div><button class="mini go" onclick="planRestore('+x.id+')">복원</button></div></div>').join('');
  }).catch(()=>{$('plans').innerHTML='<div class="empty">불러오지 못했습니다.</div>';});
}
function quickSave(id){
  const p=PLANS.find(x=>x.id===id); if(!p) return;
  const row={...p,
    price_month:+$('pm'+id).value||0, price_origin:+$('po'+id).value||0,
    months:+$('pmo'+id).value||1, sort_order:+$('ps'+id).value||99};
  call({action:'planSave',plan:row}).then(({ok,d})=>{
    $('pmsg').textContent=ok?'저장되었습니다. 구독 페이지에 바로 반영됩니다.':(d.error||'저장 실패');
    if(ok){loadPlans();loadAudit();}
  }).catch(()=>$('pmsg').textContent='네트워크 오류가 발생했습니다.');
}
function planToggle(id,v){
  const p=PLANS.find(x=>x.id===id); if(!p) return;
  call({action:'planSave',plan:{...p,active:v}}).then(({ok})=>{
    if(ok){loadPlans();loadAudit();}
  }).catch(()=>{});
}
function planDel(id,code){
  if(!confirm('이 구독 상품을 삭제할까요?\n삭제해도 [복원]으로 되돌릴 수 있습니다.')) return;
  call({action:'planDelete',id,code}).then(({ok,d})=>{
    $('pmsg').textContent=ok?('삭제되었습니다.'+(d.warn?' '+d.warn:'')):(d.error||'삭제 실패');
    if(ok){loadPlans();loadAudit();}
  }).catch(()=>$('pmsg').textContent='네트워크 오류가 발생했습니다.');
}
function planRestore(id){
  call({action:'planRestore',id}).then(({ok,d})=>{
    $('pmsg').textContent=ok?'복원되었습니다.':(d.error||'복원 실패');
    if(ok){loadPlans();loadAudit();}
  }).catch(()=>{});
}
function planNew(){ planForm(null); }
function planEdit(id){ planForm(PLANS.find(x=>x.id===id)); }
function planForm(p){
  const v=p||{code:'',name_en:'',name_kr:'',tagline:'',description:'',
    items:[],options:[],price_month:0,price_origin:0,months:1,badge:'',
    image:'assets/banner-triple.png',sort_order:(PLANS.length+1),active:true};
  const w=document.createElement('div'); w.className='mo';
  w.innerHTML='<div class="mo-b"><h3>'+(p?'구독 상품 편집':'새 구독 상품')+'</h3>'
    +'<div class="g2">'
    +'<div><label>코드 (영문·중복 불가)</label><input id="fCode" value="'+esc(v.code)+'"'
      +(p?' readonly':'')+'></div>'
    +'<div><label>영문명</label><input id="fEn" value="'+esc(v.name_en)+'"></div>'
    +'<div><label>한글명</label><input id="fKr" value="'+esc(v.name_kr)+'"></div>'
    +'<div><label>뱃지</label><input id="fBadge" value="'+esc(v.badge)+'"></div>'
    +'<div><label>월 구독가</label><input id="fPm" type="number" value="'+v.price_month+'"></div>'
    +'<div><label>정가</label><input id="fPo" type="number" value="'+v.price_origin+'"></div>'
    +'<div><label>약정 개월</label><input id="fMo" type="number" value="'+(v.months||1)+'"></div>'
    +'<div><label>노출 순서</label><input id="fSo" type="number" value="'+(v.sort_order||99)+'"></div>'
    +'</div>'
    +'<label>한 줄 소개</label><input id="fTag" value="'+esc(v.tagline)+'">'
    +'<label>설명</label><textarea id="fDesc">'+esc(v.description)+'</textarea>'
    +'<label>구성 (한 줄에 하나)</label><textarea id="fItems">'
      +esc((v.items||[]).join('\n'))+'</textarea>'
    +'<label>선택 옵션 (없으면 비워두세요)</label><textarea id="fOpts">'
      +esc((v.options||[]).join('\n'))+'</textarea>'
    +'<label>이미지 경로</label><input id="fImg" value="'+esc(v.image)+'">'
    +'<div class="pa" style="margin-top:16px">'
    +'<button class="btn" id="fSave" style="flex:1">저장</button>'
    +'<button class="btn ghost" id="fCancel" style="flex:1">취소</button></div>'
    +'<div class="msg" id="fMsg"></div></div>';
  document.body.appendChild(w);
  w.onclick=e=>{ if(e.target===w) w.remove(); };
  w.querySelector('#fCancel').onclick=()=>w.remove();
  w.querySelector('#fSave').onclick=()=>{
    const row={id:p?p.id:null,
      code:w.querySelector('#fCode').value.trim(),
      name_en:w.querySelector('#fEn').value.trim(),
      name_kr:w.querySelector('#fKr').value.trim(),
      badge:w.querySelector('#fBadge').value.trim(),
      tagline:w.querySelector('#fTag').value.trim(),
      description:w.querySelector('#fDesc').value.trim(),
      items:w.querySelector('#fItems').value,
      options:w.querySelector('#fOpts').value,
      image:w.querySelector('#fImg').value.trim(),
      price_month:+w.querySelector('#fPm').value||0,
      price_origin:+w.querySelector('#fPo').value||0,
      months:+w.querySelector('#fMo').value||1,
      sort_order:+w.querySelector('#fSo').value||99,
      active:v.active!==false};
    if(!row.code||!row.name_kr){
      w.querySelector('#fMsg').textContent='코드와 한글명을 입력해 주세요.'; return; }
    w.querySelector('#fMsg').textContent='저장 중…';
    call({action:'planSave',plan:row}).then(({ok,d})=>{
      if(!ok){ w.querySelector('#fMsg').textContent=d.error||'저장 실패'; return; }
      w.remove(); loadPlans(); loadAudit();
      $('pmsg').textContent=p?'수정되었습니다.':'추가되었습니다.';
    }).catch(()=>{w.querySelector('#fMsg').textContent='네트워크 오류가 발생했습니다.';});
  };
}

/* 변경 이력 */
const ACT={create:'추가',update:'수정',delete:'삭제',restore:'복원',other:'기타'};
function loadAudit(){
  call({action:'auditList',area:$('alArea').value,act:$('alAct').value,
    q:$('alQ').value.trim(),limit:100}).then(({ok,d})=>{
    if(!ok){$('audit').innerHTML='<div class="empty">'+(d.error||'불러오지 못했습니다.')+'</div>';return;}
    const sel=$('alArea');
    if(sel.options.length<=1 && d.areas)
      sel.innerHTML='<option value="">전체 영역</option>'
        +d.areas.map(a=>'<option value="'+esc(a)+'">'+esc(a)+'</option>').join('');
    if(!d.items.length){$('audit').innerHTML='<div class="empty">해당하는 이력이 없습니다.</div>';return;}
    $('audit').innerHTML=d.items.map(l=>
      '<div class="arow"><div><span class="ac '+l.action+'">'
      +(ACT[l.action]||l.action)+'</span></div>'
      +'<div class="tt"><b>'+esc(l.target_name||l.target_table)+'</b>'
      +(l.summary?'<small>'+esc(l.summary)+'</small>':'')+'</div>'
      +'<div style="font-size:11.5px;color:var(--gray)">'+esc(l.area)
      +'<br>'+esc((l.actor||'').split('@')[0])+'</div>'
      +'<div style="font-size:11.5px;color:var(--gray)">'
      +new Date(l.created_at).toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',
        hour:'2-digit',minute:'2-digit'})
      +'<br><button class="mini" onclick="auditDetail('+l.id+')">상세</button></div></div>').join('');
  }).catch(()=>{$('audit').innerHTML='<div class="empty">불러오지 못했습니다.</div>';});
}
function auditDetail(id){
  call({action:'auditDetail',id}).then(({ok,d})=>{
    if(!ok) return alert(d.error||'불러오지 못했습니다.');
    const diff=d.diff||[];
    if(!diff.length) return alert('변경된 항목이 없습니다.');
    const w=document.createElement('div'); w.className='mo';
    w.innerHTML='<div class="mo-b"><h3>변경 내용</h3>'
      +'<div class="diff">'+diff.map(x=>
        '<div style="margin-bottom:8px"><span class="k">'+esc(x.key)+'</span><br>'
        +'<span class="b">'+esc(JSON.stringify(x.before)).slice(0,90)+'</span> → '
        +'<span class="a">'+esc(JSON.stringify(x.after)).slice(0,90)+'</span></div>').join('')
      +'</div><button class="btn ghost" id="dc" style="margin-top:14px;width:100%">닫기</button></div>';
    document.body.appendChild(w);
    w.onclick=e=>{if(e.target===w)w.remove();};
    w.querySelector('#dc').onclick=()=>w.remove();
  }).catch(()=>alert('네트워크 오류가 발생했습니다.'));
}
sync();
</script>
<script src="assets/nav.js" defer></script>
<script src="assets/sheet.js" defer></script>
