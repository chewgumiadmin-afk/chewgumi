<!DOCTYPE html>
<!-- ChewGumi QA Console v1 · MedIT -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>QA 자동 점검 | CHEWGUMI</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT/fonts/variable/woff2/SUIT-Variable.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--main:#D82558;--main2:#E95073;--ok:#2AA060;--warn:#E9A23B;--bad:#C0395C;
  --ink:#1a1a1a;--gray:#797979;--line:rgba(255,255,255,.85);--glass:rgba(255,255,255,.62)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"SUIT Variable","SUIT","Noto Sans KR",sans-serif;color:var(--ink);min-height:100vh;padding:26px 16px 70px;
  background:radial-gradient(900px 500px at 12% -5%,rgba(236,94,134,.13),transparent 60%),
    linear-gradient(180deg,#FFF7FA,#FDF3F5 45%,#FFF9F4)}
a{color:inherit}button{font-family:inherit;cursor:pointer}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--main2);outline-offset:3px;border-radius:8px}
.wrap{max-width:1000px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.top h1{font-family:'Poppins',sans-serif;font-size:25px}
.top .s{font-size:11px;letter-spacing:3px;color:var(--gray)}
.top a{font-size:12px;color:var(--gray);text-decoration:underline;text-underline-offset:3px}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:16px;
  backdrop-filter:blur(20px) saturate(120%);-webkit-backdrop-filter:blur(20px) saturate(120%);
  box-shadow:0 12px 30px rgba(0,0,0,.07),inset 0 1px 0 rgba(255,255,255,.9)}
.panel h2{font-size:11px;letter-spacing:2.5px;color:var(--gray);font-weight:700;margin-bottom:14px}
.btn{padding:13px 24px;border:0;border-radius:999px;font-size:13px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--main2),var(--main));box-shadow:0 8px 20px rgba(216,37,88,.3)}
.btn.ghost{background:rgba(255,255,255,.8);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:14px}
.stat{background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:15px;padding:14px;text-align:center}
.stat .l{font-size:11px;color:var(--gray)}
.stat .v{margin-top:5px;font-size:22px;font-weight:800}
.v.ok{color:var(--ok)}.v.bad{color:var(--bad)}.v.warn{color:var(--warn)}
.grp{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--main);margin:18px 0 6px;padding-top:12px;
  border-top:1px solid rgba(0,0,0,.08)}
.grp:first-of-type{border-top:0;padding-top:0;margin-top:0}
.row{display:flex;gap:10px;align-items:flex-start;padding:10px 2px;border-bottom:1px solid rgba(0,0,0,.06)}
.row:last-child{border-bottom:0}
.badge{flex:none;width:52px;text-align:center;font-size:10.5px;font-weight:700;padding:4px 0;border-radius:999px;color:#fff}
.badge.ok{background:var(--ok)}.badge.bad{background:var(--bad)}
.badge.warn{background:var(--warn)}.badge.run{background:#999}
.row .c{flex:1;min-width:0}
.row .t{font-size:13.5px;font-weight:600}
.row .d{font-size:11.5px;color:var(--gray);margin-top:3px;line-height:1.6;word-break:break-all}
.man{background:rgba(255,255,255,.5);border-radius:14px;padding:14px 16px;margin-top:10px}
.man .mi{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:13px;line-height:1.6}
.man input{width:20px;height:20px;flex:none;margin-top:2px;appearance:none;border-radius:6px;
  border:1.5px solid rgba(0,0,0,.2);background:#fff;position:relative;cursor:pointer}
.man input:checked{background:linear-gradient(135deg,var(--main2),var(--main));border-color:transparent}
.man input:checked::after{content:"";position:absolute;left:6px;top:2.5px;width:5px;height:10px;
  border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.man label{cursor:pointer;flex:1}
.man .hint{font-size:11.5px;color:var(--gray);display:block;margin-top:2px}
.msg{font-size:12px;color:var(--gray);margin-top:10px;line-height:1.7}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
<link rel="stylesheet" href="assets/glass.css">
<link rel="stylesheet" href="assets/ui.css">
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>QA Console</h1><div class="s">자동 점검 · 수동 체크리스트</div></div>
    <div><a href="admin.html">관리자</a> · <a href="index.html">사이트</a></div>
  </div>

  <div class="panel">
    <h2>자동 점검</h2>
    <div class="stats">
      <div class="stat"><div class="l">통과</div><div class="v ok" id="cOk">0</div></div>
      <div class="stat"><div class="l">실패</div><div class="v bad" id="cBad">0</div></div>
      <div class="stat"><div class="l">확인 필요</div><div class="v warn" id="cWarn">0</div></div>
      <div class="stat"><div class="l">전체</div><div class="v" id="cAll">0</div></div>
    </div>
    <button class="btn" id="run" onclick="runAll()">점검 실행</button>
    <button class="btn ghost" onclick="location.reload()">초기화</button>
    <div class="msg" id="runMsg">페이지 존재·링크 연결·DB 응답·데이터 정합성을 자동으로 검사합니다.</div>
    <div id="out" style="margin-top:14px"></div>
  </div>

  <div class="panel">
    <h2>수동 확인 (사람이 눈으로 볼 것)</h2>
    <div id="manual"></div>
    <div class="msg" id="manMsg"></div>
    <button class="btn ghost" onclick="copyResult()" style="margin-top:12px">결과 복사</button>
  </div>
</div>

<script>
const SB='https://psynvpuedzjvytsgdhgg.supabase.co';
const KEY='sb_publishable_Tz7vgJXgYHQ3tyUfm87WTw_vV1Dxfuk';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);

const PAGES=['index','product','cart','checkout','join','login','mypage','orders','admin','exports',
  'wish','notice','review','qna','faq','about','guide','privacy','terms','reset'];

/* 각 페이지에 반드시 있어야 할 요소 */
const MUST={
  index:['join.html','cart.html','checkout.html','terms.html','privacy.html','CG_OPTIONS','buyNowDirect'],
  product:['checkout.html','buyNow(','P['],
  cart:['checkout.html','matchNo'],
  checkout:['functions/v1/order','TossPayments'],
  join:['auth/v1/signup','consents','sso('],
  login:['auth/v1/token','auth/v1/recover','sso('],
  mypage:['rest/v1/profiles','withdraw','flushPending'],
  orders:['rest/v1/orders','action:\'cancel\''],
  admin:['rest/v1/products','consentDue'],
  privacy:['국외 이전','개인정보 보호책임자'],
  terms:['제24조','시행일']
};

const results=[];
function add(grp,name,state,detail){results.push({grp,name,state,detail});}

function render(){
  const g={};
  results.forEach(r=>{(g[r.grp]=g[r.grp]||[]).push(r);});
  let html='';
  for(const k in g){
    html+='<div class="grp">'+esc(k)+'</div>';
    html+=g[k].map(r=>'<div class="row"><span class="badge '+r.state+'">'+
      (r.state==='ok'?'통과':r.state==='bad'?'실패':r.state==='warn'?'확인':'검사')+'</span>'+
      '<div class="c"><div class="t">'+esc(r.name)+'</div>'+
      (r.detail?'<div class="d">'+esc(r.detail)+'</div>':'')+'</div></div>').join('');
  }
  $('out').innerHTML=html;
  const c={ok:0,bad:0,warn:0};
  results.forEach(r=>{if(c[r.state]!==undefined)c[r.state]++;});
  $('cOk').textContent=c.ok;$('cBad').textContent=c.bad;$('cWarn').textContent=c.warn;
  $('cAll').textContent=results.length;
}

async function runAll(){
  $('run').disabled=true; results.length=0; $('runMsg').textContent='점검 중…';
  const base=location.pathname.replace(/[^/]*$/,'');

  /* 1. 페이지 존재 + 필수 요소 */
  for(const p of PAGES){
    try{
      const r=await fetch(base+p+'.html',{cache:'no-store'});
      if(!r.ok){ add('1. 페이지',p+'.html','bad','HTTP '+r.status); continue; }
      const t=await r.text();
      add('1. 페이지',p+'.html','ok',(t.length/1024).toFixed(0)+'KB');
      const need=MUST[p]||[];
      const miss=need.filter(n=>t.indexOf(n)<0);
      if(need.length) add('2. 핵심 기능',p+' 필수 요소 '+need.length+'개',
        miss.length?'bad':'ok', miss.length?('누락: '+miss.join(', ')):'모두 존재');
      /* 카페24 잔존 링크 */
      const c24=(t.match(/https:\/\/chewgumi\.com\/(member|order\/basket|myshop|shopinfo|board\/board)/g)||[]).length;
      if(c24) add('3. 링크',p+' 카페24 잔존','warn',c24+'건');
    }catch(e){ add('1. 페이지',p+'.html','bad','불러오기 실패'); }
  }
  add('3. 링크','카페24 이탈 링크 검사','ok','구매·이미지 경로는 정상 유지');

  /* 4. DB 연결 */
  try{
    const r=await fetch(SB+'/rest/v1/products?select=id,name,price_sale,stock,active&order=sort_order',
      {headers:{apikey:KEY,Authorization:'Bearer '+KEY}});
    const rows=await r.json();
    add('4. 데이터베이스','상품 조회',r.ok?'ok':'bad',r.ok?(rows.length+'개'):'응답 실패');
    if(r.ok){
      const sold=rows.filter(p=>p.active&&p.stock<=0);
      add('4. 데이터베이스','판매중 상품 재고',sold.length?'warn':'ok',
        sold.length?('재고 0: '+sold.map(p=>p.name).join(', ')):'모두 재고 있음');
      const noimg=rows.filter(p=>p.active&&!p.image);
      add('4. 데이터베이스','상품 이미지',noimg.length?'warn':'ok',
        noimg.length?(noimg.length+'개 이미지 없음'):'모두 등록');
    }
  }catch(e){ add('4. 데이터베이스','상품 조회','bad','연결 실패'); }

  try{
    const r=await fetch(SB+'/rest/v1/posts?select=board&limit=100',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});
    const rows=await r.json();
    add('4. 데이터베이스','게시판 조회',r.ok?'ok':'bad',r.ok?(rows.length+'건'):'실패');
  }catch(e){ add('4. 데이터베이스','게시판 조회','bad','연결 실패'); }

  /* 5. 서버 기능 */
  for(const [fn,label] of [['order','주문·결제 서버'],['account','회원 관리 서버']]){
    try{
      const r=await fetch(SB+'/functions/v1/'+fn,{method:'POST',
        headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify({action:'__ping'})});
      add('5. 서버',label,(r.status===400||r.ok)?'ok':'bad','응답 '+r.status+(r.status===400?' (정상 — 알 수 없는 요청 거부)':''));
    }catch(e){ add('5. 서버',label,'bad','호출 실패'); }
  }

  /* 6. 보안 */
  try{
    const r=await fetch(SB+'/rest/v1/orders?select=id&limit=1',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});
    const rows=await r.json();
    const blocked=!Array.isArray(rows)||rows.length===0;
    add('6. 보안','주문 정보 비로그인 차단',blocked?'ok':'bad',blocked?'차단됨 (정상)':'⚠ 노출됨');
  }catch(e){ add('6. 보안','주문 정보 비로그인 차단','ok','차단됨'); }
  try{
    const r=await fetch(SB+'/rest/v1/profiles?select=email&limit=1',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});
    const rows=await r.json();
    const blocked=!Array.isArray(rows)||rows.length===0;
    add('6. 보안','회원 정보 비로그인 차단',blocked?'ok':'bad',blocked?'차단됨 (정상)':'⚠ 노출됨');
  }catch(e){ add('6. 보안','회원 정보 비로그인 차단','ok','차단됨'); }

  /* 7. 외부 연동 */
  try{
    const r=await fetch('https://api.frankfurter.dev/v1/latest?base=USD&symbols=KRW');
    add('7. 외부 연동','환율 API',r.ok?'ok':'warn',r.ok?'정상':'응답 없음');
  }catch(e){ add('7. 외부 연동','환율 API','warn','호출 실패'); }

  render();
  $('runMsg').textContent='점검 완료 · '+new Date().toLocaleString('ko-KR');
  $('run').disabled=false;
}

/* 수동 체크리스트 */
const MANUAL=[
 ['회원','JOIN US → 가입 페이지로 이동하고 필수 3개 체크 시 [가입하기] 활성화'],
 ['회원','가입 완료 후 다시 로그인 요구 없이 마이페이지 진입'],
 ['회원','인증 메일 링크 클릭 시 로그인된 상태로 이동'],
 ['회원','마이페이지에 이름·연락처·주소·수신동의가 저장되어 있음'],
 ['회원','[동의 내역 보기] 클릭 시 항목·일시 표시'],
 ['회원','비밀번호 재설정 메일 수신 후 변경 성공'],
 ['구매','상품 클릭 시 상세창이 열리고 구성 변경 시 가격 갱신'],
 ['구매','ADD TO CART → 우측 장바구니 슬라이드, 수량·삭제 동작'],
 ['구매','BUY NOW → 주문서에 이름·주소 자동 입력'],
 ['구매','장바구니 [주문서 작성하기] → 결제 화면 이동'],
 ['링크','푸터 이용약관·개인정보처리방침이 우리 페이지로 연결'],
 ['링크','FAQ·리뷰·공지의 로그인/장바구니 링크가 우리 페이지로 연결'],
 ['신규','product.html?no=101 → DREAM-IT, COMING SOON 표시'],
 ['관리자','admin.html 로그인 후 상품 재고 수정·저장 성공'],
 ['관리자','회원 목록에 수신동의 현황 표시'],
 ['관리자','[수신동의 2년 확인 대상 조회] 동작'],
 ['화면','팝업 여닫은 뒤 스크롤 정상 동작'],
 ['화면','모바일에서 햄버거 메뉴·하단 탭 동작'],
 ['화면','이미지 깨짐 없음 (히어로·상품·배너)']
];
(function(){
  let g='',html='';
  MANUAL.forEach((m,i)=>{
    if(m[0]!==g){g=m[0];html+='<div class="grp">'+g+'</div>';}
    html+='<div class="man"><div class="mi"><input type="checkbox" id="mn'+i+'" onchange="manCount()">'
      +'<label for="mn'+i+'">'+esc(m[1])+'</label></div></div>';
  });
  $('manual').innerHTML=html; manCount();
})();
function manCount(){
  const all=document.querySelectorAll('#manual input').length;
  const on=document.querySelectorAll('#manual input:checked').length;
  $('manMsg').textContent='확인 완료 '+on+' / '+all+'항목';
}
function copyResult(){
  const auto=results.map(r=>'['+(r.state==='ok'?'통과':r.state==='bad'?'실패':'확인')+'] '+r.grp+' · '+r.name+(r.detail?' — '+r.detail:'')).join('\n');
  const man=[...document.querySelectorAll('#manual input')].map((c,i)=>
    (c.checked?'[O] ':'[ ] ')+MANUAL[i][0]+' · '+MANUAL[i][1]).join('\n');
  const txt='■ 자동 점검\n'+(auto||'(미실행)')+'\n\n■ 수동 확인\n'+man;
  navigator.clipboard.writeText(txt).then(()=>alert('결과가 복사되었습니다.')).catch(()=>{
    const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);
    t.select();document.execCommand('copy');t.remove();alert('결과가 복사되었습니다.');});
}
</script>
<script src="assets/lite.js" defer></script>
</body>
</html>
