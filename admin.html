<!DOCTYPE html>
<!-- ChewGumi Admin (구 화면 → 안내) · MedIT -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>관리자 | CHEWGUMI</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<script src="assets/auth.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT/fonts/variable/woff2/SUIT-Variable.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/glass.css">
<link rel="stylesheet" href="assets/admin-ui.css">
<style>
:root{--main:#D82558;--main2:#E95073;--ok:#2AA060;--warn:#E9A23B;
  --ink:#17171c;--gray:#7a7a82;--line:rgba(255,255,255,.85);--glass:rgba(255,255,255,.64)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"SUIT Variable","SUIT","Noto Sans KR",sans-serif;color:var(--ink);
  min-height:100vh;padding:26px 16px 60px;display:flex;align-items:center;
  background:radial-gradient(900px 500px at 12% -5%,rgba(236,94,134,.13),transparent 60%),
    linear-gradient(180deg,#FFF7FA,#FDF3F5 45%,#FFF9F4)}
a{color:inherit;text-decoration:none}
.wrap{max-width:520px;margin:0 auto;width:100%}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:32px;
  backdrop-filter:blur(20px) saturate(120%);-webkit-backdrop-filter:blur(20px) saturate(120%);
  box-shadow:0 12px 30px rgba(0,0,0,.07),inset 0 1px 0 rgba(255,255,255,.9);text-align:center}
.eb{font-family:'Poppins',sans-serif;font-size:11px;letter-spacing:3px;color:var(--main);font-weight:700}
h1{margin-top:12px;font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.35}
p{margin-top:14px;font-size:13.5px;line-height:1.9;color:#5a5a62;word-break:keep-all}
.btn{display:flex;align-items:center;justify-content:center;
  width:100%;margin-top:22px;min-height:52px;border-radius:999px;
  font-size:15px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--main2),var(--main));
  box-shadow:0 10px 24px rgba(216,37,88,.28)}
.links{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
.links a{display:flex;align-items:center;justify-content:center;min-height:46px;
  border-radius:14px;font-size:12.5px;font-weight:600;color:var(--ink);
  background:rgba(255,255,255,.7);border:1px solid var(--line)}
.links a:hover{background:#fff}
.note{margin-top:18px;font-size:11.5px;color:var(--gray);line-height:1.75}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <div class="eb">MOVED</div>
    <h1>관리자 화면이<br>새로워졌습니다</h1>
    <p>이 화면의 기능은 각 전용 화면으로 나뉘었습니다.<br>
      관리자 홈에서 AI에게 물어보시면 어디로 가야 할지 알려드립니다.</p>
    <a class="btn" href="console.html">관리자 홈으로 이동</a>
    <div class="links">
      <a href="orders.html">주문 · 배송</a>
      <a href="stock.html">재고 · 품절</a>
      <a href="members.html">회원 조회</a>
      <a href="posts.html">게시물 관리</a>
      <a href="boards.html">게시판 설정</a>
      <a href="subs-admin.html">정기구독</a>
    </div>
    <div class="note">이 주소는 당분간 유지되지만, 앞으로는 관리자 홈을 이용해 주세요.</div>
  </div>
</div>
<script src="assets/lite.js" defer></script>
<script src="assets/nav.js" defer></script>
<script>
/* 3초 뒤 자동 이동 */
setTimeout(function(){
  if(!document.hidden) location.replace('console.html');
}, 3000);
</script>
<script src="assets/qa-mode.js" defer></script>
<script src="assets/qa-pad.js" defer></script>
</body>
</html>
