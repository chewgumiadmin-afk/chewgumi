<style>
:root{--main:#D82558;--main2:#E95073;--ok:#2AA060;--warn:#E9A23B;--bad:#C0395C;
  --ink:#1a1a1a;--gray:#797979;--line:rgba(255,255,255,.85);--glass:rgba(255,255,255,.62)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"SUIT Variable","SUIT","Noto Sans KR",sans-serif;color:var(--ink);min-height:100vh;padding:26px 16px 70px;
  background:radial-gradient(900px 500px at 12% -5%,rgba(236,94,134,.13),transparent 60%),
    linear-gradient(180deg,#FFF7FA,#FDF3F5 45%,#FFF9F4)}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--main2);outline-offset:3px;border-radius:8px}
.wrap{max-width:1040px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.top h1{font-family:'Poppins',sans-serif;font-size:25px}
.top .s{font-size:11px;letter-spacing:3px;color:var(--gray)}
.top a{font-size:12px;color:var(--gray);text-decoration:underline;text-underline-offset:3px}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:16px;
  backdrop-filter:blur(20px) saturate(120%);-webkit-backdrop-filter:blur(20px) saturate(120%);
  box-shadow:0 12px 30px rgba(0,0,0,.07),inset 0 1px 0 rgba(255,255,255,.9)}
.panel h2{font-size:11px;letter-spacing:2.5px;color:var(--gray);font-weight:700;margin-bottom:14px}
input,select,textarea{width:100%;padding:11px 13px;border-radius:12px;font-size:12.5px;font-family:inherit;
  border:1px solid var(--line);background:rgba(255,255,255,.85)}
label{display:block;font-size:12px;font-weight:600;margin:10px 0 5px}
.btn{padding:12px 22px;border:0;border-radius:999px;font-size:13px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--main2),var(--main));box-shadow:0 8px 20px rgba(216,37,88,.3)}
.btn.ghost{background:rgba(255,255,255,.8);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.mini{display:inline-flex;align-items:center;height:34px;padding:0 14px;border-radius:999px;
  font-size:11.5px;font-weight:700;background:rgba(255,255,255,.85);
  border:1px solid var(--line);color:var(--ink);text-decoration:none}
.mini.go{background:linear-gradient(135deg,#37B26B,#2AA060);color:#fff;border-color:transparent}
.msg{font-size:12.5px;color:var(--gray);margin-top:10px;min-height:17px;line-height:1.8}
.msg.bad{color:var(--main)}.msg.ok{color:var(--ok)}
.warn{background:rgba(233,162,59,.14);border:1px solid rgba(233,162,59,.35);border-radius:14px;
  padding:13px 15px;font-size:12.5px;line-height:1.85;margin-bottom:14px}
.warn b{color:#9a6414}
.acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
/* 진단 */
.diag{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.dg{padding:14px 15px;border-radius:15px;background:rgba(255,255,255,.72);border:1px solid var(--line)}
.dg .t{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.dg .st{font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px;color:#fff}
.dg .st.y{background:var(--ok)}.dg .st.n{background:#bbb}.dg .st.e{background:var(--bad)}
.dg .d{margin-top:7px;font-size:11.5px;line-height:1.75;color:#555;word-break:break-all}
/* 학습 */
.eps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
.eps button{padding:8px 12px;border-radius:999px;font-size:11px;font-weight:600;
  background:rgba(255,255,255,.8);border:1px solid var(--line);color:#555}
.eps button:hover{background:#fff}
.out{white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:11.5px;line-height:1.7;background:rgba(27,11,20,.94);color:#e9e3e6;
  border-radius:14px;padding:16px;max-height:420px;overflow:auto;margin-top:12px}
.out .k{color:#FF8FB1}.out .s{color:#B6D94C}.out .n{color:#FFE923}
.hide{display:none}
@media(max-width:860px){.diag{grid-template-columns:1fr}}

  /* 모바일 — 긴 글자가 화면을 밀어내지 않도록 */
  @media(max-width:640px){
    body{overflow-x:hidden}
    .msg,.hint,p,li,td,th,.rb,.ib,.sb,.d{word-break:keep-all;overflow-wrap:anywhere}
    [style*="nowrap"],.nowrap{white-space:normal !important}
    .acts,.chips,.tabs,.sug,.eps,.kinds{overflow-x:auto;-webkit-overflow-scrolling:touch;
      scrollbar-width:none;padding-bottom:2px}
    .acts::-webkit-scrollbar,.chips::-webkit-scrollbar,
    .tabs::-webkit-scrollbar,.sug::-webkit-scrollbar{display:none}
    .out,pre,code{overflow-x:auto;word-break:break-all}
  }
</style>

<body>
<div class="wrap">
  <div class="top">
    <div><h1>Cafe24 API</h1><div class="s">연동 · 진단 · 학습</div></div>
    <div><a href="console.html">관리자 홈</a> · <a href="integrations.html">연동 관리</a> ·
      <a href="https://developers.cafe24.com/docs/api/admin/" target="_blank" rel="noopener">API 문서</a></div>
  </div>

  <div class="panel" id="login">
    <h2>ADMIN LOGIN</h2>
    <input id="em" type="email" placeholder="운영자 이메일" autocomplete="email" style="margin-bottom:9px">
    <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" style="margin-bottom:12px">
    <button class="btn" onclick="doLogin()">로그인</button>
    <div class="msg" id="lmsg"></div>
  </div>

  <div id="area" class="hide">
    <div class="panel">
      <h2>연동 상태</h2>
      <div class="msg" id="cStat" style="margin-top:0">확인 중…</div>
      <div class="acts">
        <a class="mini go" id="cAuth" href="#" target="_blank" rel="noopener">연동 승인하기</a>
        <button class="mini" onclick="diagnose()">상점 종합 진단</button>
        <button class="mini" onclick="doSync(30)">최근 30일 주문 가져오기</button>
      </div>
      <div class="msg" id="cRes"></div>
    </div>

    <div class="panel" id="dPanel" style="display:none">
      <h2>종합 진단</h2>
      <div class="diag" id="diag"></div>
    </div>

    <div class="panel">
      <h2>자동 알림 설정</h2>
      <div class="warn">
        <b>알림톡을 켜면</b> 주문·입금·배송 안내가 고객 카카오톡으로 자동 발송됩니다.
        카카오 비즈니스 채널 인증이 선행되어야 하며, 발송 건당 비용이 발생합니다.
      </div>
      <div class="acts">
        <button class="mini" onclick="alimtalk()">알림톡 상태 확인</button>
        <button class="mini go" onclick="alimtalkOn(true)">알림톡 켜기</button>
        <button class="mini" onclick="alimtalkOn(false)">알림톡 끄기</button>
        <button class="mini" onclick="smsInfo()">문자(SMS) 설정 확인</button>
      </div>
      <div class="msg" id="aRes"></div>
    </div>

    <div class="panel">
      <h2>결제 · 정산 · 통계</h2>
      <div class="acts">
        <button class="mini" onclick="dash()">대시보드 (매출·품절·회원)</button>
        <button class="mini" onclick="bankSync()">무통장 계좌 가져오기</button>
        <button class="mini" onclick="unpaid()">미입금 주문</button>
        <button class="mini" onclick="receipts()">현금영수증 (30일)</button>
        <button class="mini" onclick="sales()">매출 통계 (30일)</button>
        <button class="mini" onclick="reviews()">공식몰 리뷰</button>
      </div>
      <div class="msg" id="pRes"></div>
    </div>

    <div class="panel">
      <h2>상품 · 재고</h2>
      <div class="acts">
        <button class="mini" onclick="stockSync()">공식몰 재고 · 품절 확인</button>
      </div>
      <div class="msg" id="sRes"></div>
    </div>

    <div class="panel">
      <h2>API 학습</h2>
      <div class="warn">
        조회(GET)만 가능합니다. 데이터를 바꾸는 요청은 이 화면에서 실행되지 않습니다.
      </div>
      <div class="eps">
        <button onclick="setEp('store')">상점 정보</button>
        <button onclick="setEp('orders?limit=3')">주문 목록</button>
        <button onclick="setEp('orders/count')">주문 수</button>
        <button onclick="setEp('products?limit=3')">상품 목록</button>
        <button onclick="setEp('customers?limit=3')">회원 목록</button>
        <button onclick="setEp('dashboard')">대시보드</button>
        <button onclick="setEp('sms/balance')">SMS 잔액</button>
        <button onclick="setEp('kakaoalimtalk/setting')">알림톡 설정</button>
        <button onclick="setEp('subscription/shipments/setting')">정기배송</button>
        <button onclick="setEp('coupons?limit=3')">쿠폰</button>
        <button onclick="setEp('store/accounts')">무통장 계좌</button>
        <button onclick="setEp('shipping')">배송 설정</button><button onclick="setEp('reviews?limit=3')">리뷰</button><button onclick="setEp('boards')">게시판</button>
      </div>
      <label>요청 경로 (v2/admin/ 뒤에 올 부분)</label>
      <input id="ep" placeholder="예) orders?limit=3" onkeydown="if(event.key==='Enter')runRaw()">
      <div class="acts">
        <button class="btn" onclick="runRaw()">조회 실행</button>
        <button class="btn ghost" onclick="copyOut()">결과 복사</button>
        <a class="mini" href="https://developers.cafe24.com/docs/api/admin/" target="_blank" rel="noopener">문서에서 찾기</a>
      </div>
      <div class="msg" id="rMsg"></div>
      <div id="rBox"></div>
    </div>

    <div class="panel">
      <h2>계정</h2>
      <div class="msg" id="who" style="margin-top:0"></div>
      <button class="btn ghost" onclick="doLogout()" style="max-width:140px">로그아웃</button>
    </div>
  </div>
</div>

<script src="assets/lite.js" defer></script>
<script>
const SB='https://psynvpuedzjvytsgdhgg.supabase.co';
const KEY='sb_publishable_Tz7vgJXgYHQ3tyUfm87WTw_vV1Dxfuk';
const FN=SB+'/functions/v1/cafe24';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
let token=null,who='',lastOut='';
try{var _u=CGAuth.user(); if(_u&&CGAuth.isIn()){who=_u.name; token='1';}}catch(e){}
const H=()=>({apikey:KEY,'Content-Type':'application/json',
  Authorization:'Bearer '+((function(){try{var s=JSON.parse(localStorage.getItem('cg_sb')||'null');return s&&s.t||'';}catch(e){return '';}})())});
const call=p=>fetch(FN,{method:'POST',headers:H(),body:JSON.stringify(p)})
  .then(r=>r.json().then(d=>({ok:r.ok,d})));

function sync(){
  if(window.CGAuth && CGAuth.isIn() && !window._cgChecked){
    window._cgChecked=1;
    CGAuth.token().then(function(t){
      if(t){ token=t; sync(); }
      else { token=null; sync(); }
    });
  }const on=!!token;
  $('login').classList.toggle('hide',on);$('area').classList.toggle('hide',!on);
  if(on){$('who').textContent=who+' 님으로 로그인 중입니다.';status();}}
function doLogin(){
  const email=$('em').value.trim(),pw=$('pw').value;
  if(!email||!pw)return $('lmsg').textContent='이메일과 비밀번호를 입력해 주세요.';
  CGAuth.login(email,pw).then(function(at){ var d={access_token:at};
    if(d.access_token){token=d.access_token;who=email.split('@')[0];
      
      $('lmsg').textContent='';sync();}
    else $('lmsg').textContent='로그인 실패: 운영자 계정인지 확인해 주세요.';
  }).catch(()=>$('lmsg').textContent='네트워크 오류가 발생했습니다.');
}
function doLogout(){token=null;who='';try{CGAuth.logout();}catch(e){}try{localStorage.removeItem('cg_sb');}catch(e){}sync();}

function show(el,d,label){
  lastOut=JSON.stringify(d,null,2);
  $('rBox').innerHTML='<div class="out">'+esc(lastOut)+'</div>';
  if(label) $(el).textContent=label;
  $('rBox').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function status(){
  call({action:'status'}).then(({ok,d})=>{
    if(!ok) return $('cStat').textContent=d.error||'상태를 확인하지 못했습니다.';
    if(d.connected){
      $('cStat').innerHTML='공식몰과 연동되어 있습니다. 가져온 주문 <b>'+(d.orderCount||0)+'건</b>'
        +'<br><span style="font-size:11.5px;color:var(--gray)">권한: '+esc(d.info?.scopes||'')+'</span>';
      $('cAuth').textContent='권한 다시 받기';
    } else {
      $('cStat').innerHTML='아직 연동되지 않았습니다. <b>[연동 승인하기]</b>를 눌러 카페24에서 승인해 주세요.'
        +'<br><span style="font-size:11.5px;color:var(--gray)">Redirect URI: '+esc(d.authUrl||'')+'</span>';
    }
    $('cAuth').href=d.authUrl||'#';
  }).catch(()=>{$('cStat').textContent='상태를 확인하지 못했습니다.';});
}

const DG={
  dashboard:'대시보드 — 매출·품절·신규회원',
  store:'상점 기본정보',
  accounts:'무통장 계좌',
  sms:'SMS 설정 (조회 전용)',
  smsSenders:'SMS 발신번호',
  alimtalk:'카카오 알림톡',
  shipping:'배송·반품 설정',
  orderSetting:'취소·반품 재고복구 설정',
  points:'적립금 설정',
  coupons:'쿠폰 설정',
  subscription:'정기배송 설정',
  users:'운영자 목록',
  dailyVisits:'일별 방문자'
};
function diagnose(){
  $('cRes').className='msg'; $('cRes').textContent='상점 정보를 확인하는 중… 10초 정도 걸립니다.';
  call({action:'diagnose'}).then(({ok,d})=>{
    if(!ok){ $('cRes').className='msg bad';
      $('cRes').textContent=d.error||'진단에 실패했습니다.'; return; }
    $('cRes').className='msg ok'; $('cRes').textContent='진단이 끝났습니다.';
    $('dPanel').style.display='';
    const r=d.result||{};
    $('diag').innerHTML=Object.keys(DG).map(k=>{
      const v=r[k]||{};
      const st=v.ok?['y','사용 가능']
        :(v.status===403?['n','권한 없음']
        :(v.status===404?['n','미지원']:['e','오류 '+(v.status||'')]));
      let txt='';
      if(v.ok){ try{ txt=JSON.stringify(v.data).slice(0,140); }catch(e){} }
      else txt=typeof v.data==='string'?v.data:JSON.stringify(v.data||{}).slice(0,110);
      return '<div class="dg"><div class="t">'+esc(DG[k].split(' — ')[0])
        +'<span class="st '+st[0]+'">'+st[1]+'</span></div>'
        +'<div class="d">'+esc(v.note||DG[k])+'<br>'+esc(txt)+'</div></div>';
    }).join('');
    show('cRes',r);
  }).catch(()=>{$('cRes').className='msg bad';$('cRes').textContent='네트워크 오류가 발생했습니다.';});
}

function doSync(days){
  $('cRes').className='msg'; $('cRes').textContent='주문을 가져오는 중…';
  call({action:'sync',days}).then(({ok,d})=>{
    $('cRes').className=ok?'msg ok':'msg bad';
    $('cRes').textContent=ok?('최근 '+d.days+'일 주문 '+d.saved+'건을 가져왔습니다.')
      :(d.error||'가져오지 못했습니다.');
    if(ok) status();
  }).catch(()=>{$('cRes').className='msg bad';$('cRes').textContent='네트워크 오류가 발생했습니다.';});
}

function alimtalk(){
  $('aRes').className='msg'; $('aRes').textContent='알림톡 설정을 확인하는 중…';
  call({action:'alimtalk'}).then(({ok,d})=>{
    if(!ok){ $('aRes').className='msg bad'; $('aRes').textContent=d.error||'확인하지 못했습니다.'; return; }
    const s=d.setting, k=d.senderKey;
    let msg=[];
    if(s) msg.push('알림톡 설정을 읽었습니다.');
    else msg.push('알림톡 설정 조회 실패: '+esc(String(d.settingErr||'')));
    if(k) msg.push('발신 프로필 키가 확인되었습니다. (채널 연결됨)');
    else msg.push('발신 프로필 키 없음 — 카카오 비즈니스 채널 연결이 필요합니다.');
    $('aRes').className='msg'; $('aRes').innerHTML=msg.join('<br>');
    show('aRes',d);
  }).catch(()=>{$('aRes').className='msg bad';$('aRes').textContent='네트워크 오류가 발생했습니다.';});
}
function alimtalkOn(on){
  if(on && !confirm('알림톡을 켤까요?\n고객에게 자동 발송이 시작되며 건당 비용이 발생합니다.')) return;
  $('aRes').className='msg'; $('aRes').textContent='설정을 변경하는 중…';
  call({action:'alimtalkOn',on}).then(({ok,d})=>{
    $('aRes').className=ok?'msg ok':'msg bad';
    $('aRes').textContent=ok?('알림톡을 '+(on?'켰습니다.':'껐습니다.')):(d.error||'변경에 실패했습니다.');
    if(d) show('aRes',d);
  }).catch(()=>{$('aRes').className='msg bad';$('aRes').textContent='네트워크 오류가 발생했습니다.';});
}
function smsInfo(){
  $('aRes').className='msg'; $('aRes').textContent='SMS 설정을 확인하는 중…';
  call({action:'smsInfo'}).then(({ok,d})=>{
    if(!ok){ $('aRes').className='msg bad'; $('aRes').textContent=d.error||'확인 실패'; return; }
    const s=d.setting||{};
    $('aRes').className='msg';
    $('aRes').innerHTML=(s.use_sms==='T'?'SMS 사용 중':'SMS 사용 안 함')
      +(s.default_sender?' · 발신번호 '+esc(s.default_sender):'')
      +'<br><span style="font-size:11.5px">'+esc(d.note||'')+'</span>';
    show('aRes',d);
  }).catch(()=>{$('aRes').className='msg bad';$('aRes').textContent='네트워크 오류가 발생했습니다.';});
}
function dash(){
  $('pRes').className='msg'; $('pRes').textContent='대시보드를 불러오는 중…';
  call({action:'dashboard'}).then(({ok,d})=>{
    if(!ok){ $('pRes').className='msg bad'; $('pRes').textContent=d.error||'조회 실패'; return; }
    const v=d.data||{};
    $('pRes').className='msg ok';
    $('pRes').innerHTML='품절 상품 <b>'+(v.sold_out_products_count??'-')+'</b>건 · '
      +'신규회원 <b>'+(v.new_members_count??'-')+'</b>명';
    show('pRes',v);
  }).catch(()=>{$('pRes').className='msg bad';$('pRes').textContent='네트워크 오류가 발생했습니다.';});
}
function sales(){
  $('pRes').className='msg'; $('pRes').textContent='매출 통계를 불러오는 중…';
  call({action:'sales',days:30}).then(({ok,d})=>{
    $('pRes').className=ok?'msg ok':'msg bad';
    $('pRes').textContent=ok?'최근 30일 매출 통계를 불러왔습니다.':(d.error||'조회 실패');
    show('pRes',d);
  }).catch(()=>{$('pRes').className='msg bad';$('pRes').textContent='네트워크 오류가 발생했습니다.';});
}
function reviews(){
  $('pRes').className='msg'; $('pRes').textContent='공식몰 리뷰를 불러오는 중…';
  call({action:'reviews'}).then(({ok,d})=>{
    $('pRes').className=ok?'msg ok':'msg bad';
    $('pRes').textContent=ok?('리뷰 '+(d.items||[]).length+'건'):(d.error||'조회 실패');
    show('pRes',d);
  }).catch(()=>{$('pRes').className='msg bad';$('pRes').textContent='네트워크 오류가 발생했습니다.';});
}
function bankSync(){
  $('pRes').className='msg'; $('pRes').textContent='계좌 정보를 가져오는 중…';
  call({action:'bankSync'}).then(({ok,d})=>{
    if(!ok){ $('pRes').className='msg bad'; $('pRes').textContent=d.error||'가져오지 못했습니다.'; return; }
    if(!d.found){ $('pRes').className='msg'; $('pRes').textContent=d.message; show('pRes',d); return; }
    $('pRes').className='msg ok';
    $('pRes').textContent='가져왔습니다: '+d.bank_name+' '+d.bank_account
      +(d.bank_holder?' (예금주 '+d.bank_holder+')':'');
    show('pRes',d);
  }).catch(()=>{$('pRes').className='msg bad';$('pRes').textContent='네트워크 오류가 발생했습니다.';});
}
function unpaid(){
  $('pRes').className='msg'; $('pRes').textContent='미입금 주문을 조회하는 중…';
  call({action:'unpaid'}).then(({ok,d})=>{
    $('pRes').className=ok?'msg ok':'msg bad';
    $('pRes').textContent=ok?('미입금 주문 '+(d.items||[]).length+'건'):(d.error||'조회 실패');
    show('pRes',d);

function receipts(){
  $('pRes').className='msg'; $('pRes').textContent='현금영수증을 조회하는 중…';
  call({action:'cashReceipts',days:30}).then(({ok,d})=>{
    $('pRes').className=ok?'msg ok':'msg bad';
    $('pRes').textContent=ok?('최근 30일 현금영수증 '+(d.items||[]).length+'건'):(d.error||'조회 실패');
    show('pRes',d);
  }).catch(()=>{$('pRes').className='msg bad';$('pRes').textContent='네트워크 오류가 발생했습니다.';});

function stockSync(){
  $('sRes').className='msg'; $('sRes').textContent='공식몰 재고를 확인하는 중…';
  call({action:'stockSync'}).then(({ok,d})=>{
    if(!ok){ $('sRes').className='msg bad'; $('sRes').textContent=d.error||'조회 실패'; return; }
    const so=d.soldout||[];
    $('sRes').className=so.length?'msg bad':'msg ok';
    $('sRes').innerHTML='상품 '+(d.products||[]).length+'건 확인. '
      +(so.length?('<b>품절 '+so.length+'건</b>: '+so.map(x=>esc(x.name)).join(', ')):'품절 없음');
    show('sRes',d);
  }).catch(()=>{$('sRes').className='msg bad';$('sRes').textContent='네트워크 오류가 발생했습니다.';});
}

function setEp(p){ $('ep').value=p; runRaw(); }
function runRaw(){
  const p=$('ep').value.trim();
  if(!p) return $('rMsg').textContent='요청 경로를 입력해 주세요.';
  $('rMsg').className='msg'; $('rMsg').textContent='조회하는 중…';
  call({action:'raw',path:p}).then(({ok,d})=>{
    $('rMsg').className=(ok&&d.ok)?'msg ok':'msg bad';
    $('rMsg').textContent=(ok&&d.ok)?('응답 '+d.status+' — 정상'):
      (d.error||('응답 '+(d.status||'')+' — 권한이 없거나 경로가 올바르지 않습니다.'));
    show('rMsg',d.data||d);
  }).catch(()=>{$('rMsg').className='msg bad';$('rMsg').textContent='네트워크 오류가 발생했습니다.';});
}
function copyOut(){
  if(!lastOut) return alert('복사할 결과가 없습니다.');
  navigator.clipboard.writeText(lastOut).then(()=>alert('복사되었습니다.'))
  .catch(()=>alert('복사에 실패했습니다.'));
}
sync();
</script>
