<style>
:root{--main:#D82558;--main2:#E95073;--ok:#2AA060;--warn:#E9A23B;--bad:#C0395C;
  --ink:#17171c;--gray:#7a7a82;--line:rgba(255,255,255,.85);--glass:rgba(255,255,255,.64)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:"SUIT Variable","SUIT","Noto Sans KR",sans-serif;color:var(--ink);
  min-height:100vh;padding:24px 16px 48px;
  background:radial-gradient(900px 500px at 12% -5%,rgba(236,94,134,.13),transparent 60%),
    linear-gradient(180deg,#FFF7FA,#FDF3F5 45%,#FFF9F4)}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}
.wrap{max-width:880px;margin:0 auto}

.top{margin-bottom:20px}
.top h1{font-family:'Poppins',sans-serif;font-size:24px}
.top .s{margin-top:3px;color:var(--gray);font-size:12.5px}

.panel{background:var(--glass);border:1px solid var(--line);border-radius:22px;
  padding:20px;margin-bottom:14px;
  backdrop-filter:blur(20px) saturate(120%);-webkit-backdrop-filter:blur(20px) saturate(120%);
  box-shadow:0 12px 30px rgba(0,0,0,.07),inset 0 1px 0 rgba(255,255,255,.9)}
.panel h2{font-size:10.5px;letter-spacing:1.8px;color:var(--gray);font-weight:700;
  text-transform:uppercase;margin-bottom:14px;padding-bottom:9px;
  border-bottom:1px solid rgba(0,0,0,.055)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:9px}
.item{display:flex;align-items:center;gap:11px;padding:14px 15px;border-radius:15px;
  background:rgba(255,255,255,.72);border:1px solid var(--line);transition:.18s}
.item:hover{transform:translateY(-2px);background:#fff;
  box-shadow:0 10px 22px rgba(0,0,0,.08)}
.item svg{width:20px;height:20px;flex:none;fill:none;stroke:var(--main);
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.item .t{flex:1;min-width:0}
.item b{display:block;font-size:13.5px;font-weight:700;line-height:1.35}
.item span{display:block;margin-top:2px;font-size:11px;color:var(--gray);line-height:1.4}
.item .bd{min-width:19px;height:19px;padding:0 6px;border-radius:999px;flex:none;
  background:var(--main);color:#fff;font-size:10px;font-weight:800;
  display:inline-flex;align-items:center;justify-content:center}

.qa-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.qa-row button,.qa-row a{min-height:40px;padding:0 15px;border-radius:11px;
  font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.86);border:1px solid var(--line);color:var(--ink)}
.qa-row .on{background:linear-gradient(135deg,var(--main2),var(--main));
  color:#fff;border-color:transparent}
.msg{font-size:12.5px;color:var(--gray);line-height:1.75;min-height:18px}
.msg b{color:var(--ink)}
.hide{display:none}
@media(max-width:640px){
  .grid{grid-template-columns:1fr}
  .top h1{font-size:21px}
}

/* 화면 모음 */
#cgPages{ margin-top:24px }
.cgp-head{
  display:flex;align-items:baseline;gap:10px;
  margin:26px 0 13px;padding-bottom:9px;
  border-bottom:1px solid rgba(0,0,0,.07);
}
.cgp-head h2{
  font-size:14px;font-weight:800;letter-spacing:-.02em;margin:0;
}
.cgp-head.off h2{ color:#9a9aa2 }
.cgp-role{
  margin-left:auto;font-size:11.5px;font-weight:700;
  padding:3px 11px;border-radius:999px;
  background:rgba(216,37,88,.1);color:#D82558;
}
.cgp-n{ margin-left:auto;font-size:12px;color:#9a9aa2 }
.cgp-grid{
  display:grid;gap:10px;
  grid-template-columns:repeat(auto-fill,minmax(min(200px,100%),1fr));
}
.cgp{
  display:flex;flex-direction:column;gap:3px;
  padding:15px 17px;border-radius:16px;text-decoration:none;
  background:rgba(255,255,255,.72);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:0 6px 18px rgba(0,0,0,.05);
  transition:transform .18s, box-shadow .18s;
}
.cgp:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 26px rgba(216,37,88,.12);
}
.cgp b{ font-size:14px;font-weight:700;letter-spacing:-.02em;color:#17171c }
.cgp span{ font-size:11.5px;color:#9a9aa2 }
.cgp.off{
  opacity:.42;cursor:not-allowed;filter:grayscale(.5);
  background:rgba(0,0,0,.02);
}
.cgp.off:hover{ transform:none;box-shadow:none }
.cgp i{
  font-style:normal;font-size:10.5px;font-weight:700;
  color:#C0395C;margin-top:3px;
}
@media(max-width:640px){
  .cgp-grid{ grid-template-columns:repeat(2,minmax(0,1fr));gap:8px }
  .cgp{ padding:13px 14px }
  .cgp b{ font-size:13px }
}
</style>

<body>
<div class="wrap">
  <div class="top">
    <h1>관리 화면</h1>
    <div class="s">츄구미 운영에 쓰는 모든 화면입니다</div>
  </div>

  <div class="panel" id="login">
    <h2>ADMIN LOGIN</h2>
    <label>이메일</label>
    <input id="em" type="email" autocomplete="email"
      onkeydown="if(event.key==='Enter')document.getElementById('pw').focus()">
    <label>비밀번호</label>
    <input id="pw" type="password" autocomplete="current-password"
      onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn" onclick="doLogin()"
      style="width:100%;margin-top:16px;min-height:48px;border:0;border-radius:999px;
      font-size:14.5px;font-weight:700;color:#fff;
      background:linear-gradient(135deg,var(--main2),var(--main))">로그인</button>
    <div class="msg" id="lmsg" style="margin-top:10px"></div>
  </div>

  <div id="area" class="hide">
    <div class="panel">
      <h2>점검 모드</h2>
      <div class="qa-row">
        <button id="qaBtn" onclick="toggleQA()">점검 모드 켜기</button>
        <a href="console.html">관리자 홈</a>
        <a href="index.html">고객 화면</a>
      </div>
      <div class="msg" id="qaMsg">
        켜두시면 화면마다 신고 막대가 뜹니다. 이상한 곳을 바로 보내실 수 있습니다.
      </div>
    </div>

    <div class="panel">
      <h2>매일 쓰는 것</h2>
      <div class="grid" id="g1"></div>
    </div>

    <div class="panel">
      <h2>고객 응대</h2>
      <div class="grid" id="g2"></div>
    </div>

    <div class="panel">
      <h2>마케팅 · 수출</h2>
      <div class="grid" id="g3"></div>
    </div>

    <div class="panel">
      <h2>설정 · 개발</h2>
      <div class="grid" id="g4"></div>
    </div>

    <div class="panel">
      <h2>계정</h2>
      <div class="msg" id="who" style="margin-bottom:10px"></div>
      <button onclick="doLogout()"
        style="min-height:44px;padding:0 20px;border-radius:999px;font-size:13px;
        font-weight:600;background:rgba(255,255,255,.86);border:1px solid var(--line)">
        로그아웃</button>
    </div>
  </div>
</div>

<script src="assets/lite.js" defer></script>

<script>
const SB='https://psynvpuedzjvytsgdhgg.supabase.co';
const KEY='sb_publishable_Tz7vgJXgYHQ3tyUfm87WTw_vV1Dxfuk';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
let token=null,who='',qa=false;
try{ if(window.CGAuth && CGAuth.isIn()){ var u=CGAuth.user()||{};
  who=u.name||''; token=(JSON.parse(localStorage.getItem('cg_sb')||'{}')).t||''; } }catch(e){}
try{ qa = localStorage.getItem('cg_qa_mode')==='1'; }catch(e){}

const I={
  order:'M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z|M3 6h18|M16 10a4 4 0 0 1-8 0',
  stock:'M20 7 12 3 4 7v10l8 4 8-4z|M4 7l8 4 8-4M12 11v10',
  sub:'M21 12a9 9 0 1 1-3-6.7|M21 4v5h-5|M12 8v4l2.5 2',
  post:'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z|M14 2v6h6|M8 13h8M8 17h5',
  user:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2|M9 7a4 4 0 1 0 0 8 4 4 0 0 0 0-8',
  send:'M3 11l18-8-8 18-2-8-8-2z',
  chart:'M3 3v18h18|M7 15l4-5 3 3 5-7',
  ai:'M12 3v3M12 18v3M3 12h3M18 12h3|M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1|M12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8',
  code:'m8 16-4-4 4-4M16 8l4 4-4 4M13.5 5l-3 14',
  link:'M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7|M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7',
  shield:'M12 3 4 7v6c0 4.4 3.4 7.6 8 8.5 4.6-.9 8-4.1 8-8.5V7z|M12 9v4M12 16.5v.01',
  help:'M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3|M12 17h.01|M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z',
  bug:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z|M12 8v4M12 16v.01',
  box:'M3 9h18M9 21V9|M3 5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z',
  truck:'M10 17h4V5H2v12h3|M20 17h2v-3.3a2 2 0 0 0-.6-1.4L19 10h-5v7h1|M7.5 19.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4z|M17.5 19.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4z',
  mail:'M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z|m22 7-10 6L2 7'
};

const G1=[
  ['console.html','관리자 홈','AI에게 물어보고 오늘 할 일 확인','ai','todo'],
  ['orders.html','주문 · 배송','입금 확인 · 운송장 등록','order','orders'],
  ['stock.html','재고 · 품절','재고 수정 · 품절 해제','stock','stock'],
  ['subs-admin.html','정기구독','구독 승인 · 발송 관리','sub','subs']
];
const G2=[
  ['review-import.html','후기 가져오기','네이버·쿠팡 후기 옮기기','post',''],
  ['posts.html','게시물 관리' ,'문의 답변 · 후기 관리','post','qna'],
  ['boards.html','게시판 설정','게시판 만들기 · 권한','box',''],
  ['members.html','회원 조회','가입 회원 · 적립금','user',''],
  ['reports-admin.html','고객 리포트','의견 수집 · AI 분석','chart',''],
  ['issue.html','이슈 보드','오류 · 수정 요청','bug','issues'],
  ['help.html','도움말 창구','담당자 문의 접수','help','help']
];
const G3=[
  ['campaign.html','마케팅 발송','문자 · 알림 보내기','send',''],
  ['message.html','메시지 서비스','발송 이력 · 템플릿','mail',''],
  ['export-ai.html','AI 수출 비서','영문 메일 · 견적서','ai',''],
  ['exports.html','수출 · 인증','서류 · 인증 관리','box',''],
  ['grievance.html','규제 · 민원','민원 대응 문서','shield','']
];
const G4=[
  ['cafe24.html','카페24 API','공식몰 연동 · 진단','link','c24'],
  ['integrations.html','연동 관리','키 등록 · 연결 상태','link',''],
  ['dev.html','AI 개발 도우미','말로 화면 고치기','code',''],
  ['github.html','개발 현황','변경 이력 · 복원','code',''],
  ['qa.html','QA 점검','자동 검사','bug',''],
  ['preview.html','모바일 미리보기','기기별 확인','box','']
];

function ico(k){
  return '<svg viewBox="0 0 24 24">'+(I[k]||I.box).split('|')
    .map(function(d){return '<path d="'+d+'"/>';}).join('')+'</svg>';
}
function draw(id,list,bd){
  $(id).innerHTML=list.map(function(x){
    var n=bd[x[4]]||0;
    return '<a class="item" href="'+qaUrl(x[0])+'">'+ico(x[3])+
      '<span class="t"><b>'+x[1]+'</b><span>'+x[2]+'</span></span>'+
      (n?'<span class="bd">'+n+'</span>':'')+'</a>';
  }).join('');
}
function qaUrl(p){ return qa ? (p+(p.indexOf('?')>-1?'&':'?')+'qa=1') : p; }

function sync(){
  const on=!!token;
  $('login').classList.toggle('hide',on);
  $('area').classList.toggle('hide',!on);
  if(on){ $('who').innerHTML='<b>'+esc(who)+'</b> 님으로 로그인 중입니다.'; load(); }
}
function doLogin(){
  const email=$('em').value.trim(),pw=$('pw').value;
  if(!email||!pw) return $('lmsg').textContent='이메일과 비밀번호를 입력해 주세요.';
  $('lmsg').textContent='로그인 중…';
  CGAuth.login(email,pw).then(function(){
    var u=CGAuth.user()||{}; who=u.name||''; token='1';
    $('lmsg').textContent=''; sync();
  }).catch(function(e){ $('lmsg').textContent=e.message||'로그인하지 못했습니다.'; });
}
function doLogout(){ token=null;who='';
  try{CGAuth.logout();}catch(e){} sync(); }

function toggleQA(){
  qa=!qa;
  try{ localStorage.setItem('cg_qa_mode', qa?'1':'0'); }catch(e){}
  paint(); load();
}
function paint(){
  var b=$('qaBtn');
  b.textContent = qa ? '점검 모드 끄기' : '점검 모드 켜기';
  b.classList.toggle('on', qa);
  $('qaMsg').innerHTML = qa
    ? '<b>켜져 있습니다.</b> 아래 화면을 누르면 신고 막대가 함께 뜹니다.'
    : '켜두시면 화면마다 신고 막대가 뜹니다. 이상한 곳을 바로 보내실 수 있습니다.';
}

function load(){
  paint();
  var bd={};
  fetch(SB+'/functions/v1/admin-chat',{method:'POST',
    headers:{apikey:KEY,Authorization:'Bearer '+
      ((JSON.parse(localStorage.getItem('cg_sb')||'{}')).t||''),
      'Content-Type':'application/json'},
    body:JSON.stringify({action:'snapshot'})})
  .then(function(r){return r.json();})
  .then(function(d){
    if(d.ok&&d.snap){
      var s=d.snap;
      bd={ orders:(s.orders.pending||0)+(s.orders.toShip||0),
        stock:(s.stock.soldOut||0)+(s.stock.low||0),
        subs:(s.subs.pending||0)+(s.subs.due||0),
        qna:s.qnaWaiting||0, issues:s.issuesOpen||0,
        help:s.helpQueued||0, c24:s.cafe24?0:1,
        todo:(d.todos||[]).length };
    }
  }).catch(function(){}).then(function(){
    draw('g1',G1,bd); draw('g2',G2,bd); draw('g3',G3,bd); draw('g4',G4,bd);
  });
}
sync();
</script>

<script>
/* ══════════════════════════════════════════════
   화면 모음 — 권한에 맞는 것만 먼저, 나머지는 흐리게
   ══════════════════════════════════════════════ */
(function(){
  var SB='https://psynvpuedzjvytsgdhgg.supabase.co';
  var K='sb_publishable_Tz7vgJXgYHQ3tyUfm87WTw_vV1Dxfuk';
  var KR={ceo:'대표',dev:'개발자',design:'디자이너',qa:'점검',staff:'운영',guest:'손님'};

  function tok(){
    try{ var s=JSON.parse(localStorage.getItem('cg_sb')||'null');
      if(!s||!s.t) return '';
      var _ex = s.exp ? s.exp*1000 : (s.e||0); if (_ex && Date.now() > _ex) return '';
      return s.t; }catch(e){ return ''; }
  }

  function run(){
    var t = tok();
    if (!t) return;
    Promise.all([
      fetch(SB+'/rest/v1/rpc/my_pages',{method:'POST',
        headers:{apikey:K,Authorization:'Bearer '+t,'Content-Type':'application/json'},body:'{}'})
        .then(function(r){ return r.ok?r.json():[]; }),
      fetch(SB+'/rest/v1/rpc/my_role',{method:'POST',
        headers:{apikey:K,Authorization:'Bearer '+t,'Content-Type':'application/json'},body:'{}'})
        .then(function(r){ return r.ok?r.json():'guest'; })
    ]).then(function(res){
      var rows = res[0]||[], role = String(res[1]||'guest').replace(/"/g,'');
      var mine = rows.filter(function(x){ return x.allowed; });
      var lock = rows.filter(function(x){ return !x.allowed; });

      var box = document.getElementById('cgPages');
      if (!box) {
        box = document.createElement('div');
        box.id = 'cgPages';
        var w = document.querySelector('.wrap') || document.body;
        w.appendChild(box);
      }

      function card(x, ok){
        return '<a class="cgp' + (ok?'':' off') + '" href="' + (ok ? x.page : '#') + '"'
          + (ok ? '' : ' onclick="return false"') + '>'
          + '<b>' + x.label + '</b>'
          + '<span>' + x.page + '</span>'
          + (ok ? '' : '<i>권한 없음</i>')
          + '</a>';
      }

      box.innerHTML =
        '<div class="cgp-head"><h2>내가 쓸 수 있는 화면</h2>'
        + '<span class="cgp-role">' + (KR[role]||role) + '</span></div>'
        + '<div class="cgp-grid">' + mine.map(function(x){ return card(x,true); }).join('') + '</div>'
        + (lock.length
          ? '<div class="cgp-head off"><h2>권한이 없는 화면</h2>'
            + '<span class="cgp-n">' + lock.length + '개</span></div>'
            + '<div class="cgp-grid">' + lock.map(function(x){ return card(x,false); }).join('') + '</div>'
          : '');
    }).catch(function(){});
  }

  if (document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', run);
  else run();
  window.addEventListener('pageshow', run);
})();
</script>
</body>
</html>
