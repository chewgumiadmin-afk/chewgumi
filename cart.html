<script>
/* 글래스 팝업 */
function cgClose(){ document.getElementById('cgDim').classList.remove('on'); }
function cgModal(o){
  o = o || {};
  document.getElementById('cgIco').textContent = o.icon || '✓';
  document.getElementById('cgT').textContent = o.title || '';
  document.getElementById('cgS').innerHTML = o.desc || '';
  var acts = o.actions || [{ t:'확인', k:'ok' }];
  document.getElementById('cgA').innerHTML = acts.map(function(a, i){
    var cls = a.k === 'ok' ? 'cg-ok' : 'cg-gh';
    return a.href
      ? '<a class="' + cls + '" href="' + a.href + '"' + (a.blank ? ' target="_blank" rel="noopener"' : '') + '>' + a.t + '</a>'
      : '<button class="' + cls + '" data-i="' + i + '">' + a.t + '</button>';
  }).join('');
  document.querySelectorAll('#cgA button').forEach(function(b){
    b.onclick = function(){ var a = acts[+b.dataset.i]; cgClose(); if (a && typeof a.fn === 'function') a.fn(); };
  });
  document.getElementById('cgDim').classList.add('on');
}

const CDN='assets/logo-rainbow.png';
/* QA 2026-08-31 — 배너 이미지를 실제 상품 사진으로 바꿨습니다.
   (트래블잇 3·5·20봉에 듀잇 초록 배너가, 듀잇 4·6·20개입에 같은 광고 배너가 붙어 있었습니다) */
const P = {
  15:{n:'[1봉] 츄구미 여행용젤리 트래블잇 Travel-it (40g)', cate:42, img:'assets/prod/travel-1.jpg'},
  11:{n:'[3봉] 츄구미 여행용젤리 트래블잇 Travel-it (40g)', cate:42, img:'assets/prod/travel-3.jpg'},
  12:{n:'[5봉] 츄구미 여행용젤리 트래블잇 Travel-it (40g)', cate:42, img:'assets/prod/travel-5.jpg'},
  13:{n:'[10봉] 츄구미 여행용젤리 트래블잇 Travel-it (40g)', cate:42, img:'assets/prod/travel-10.jpg'},
  14:{n:'[20봉] 츄구미 여행용젤리 트래블잇 Travel-it (40g)', cate:42, img:'assets/prod/travel-20.jpg'},
  16:{n:'듀잇 레몬민트', cate:47, img:'assets/prod/dew-lemon.jpg'},
  17:{n:'듀잇 그레이프', cate:47, img:'assets/prod/dew-grape.jpg'},
  18:{n:'듀잇 4개입', cate:47, img:'assets/prod/dew-4.jpg'},
  19:{n:'듀잇 6개입', cate:47, img:'assets/prod/dew-6.jpg'},
  20:{n:'듀잇 10개입', cate:47, img:'assets/prod/dew-10.jpg'},
  21:{n:'듀잇 20개입', cate:47, img:'assets/prod/dew-20.jpg'}
};
/* QA 2026-08-31 — 두 가지를 고쳤습니다.
   · 챗봇이 담는 '트래블잇 5봉'(대괄호 없음)을 못 알아보고 3봉으로 보던 것
   · 아는 상품이 하나도 없으면 무엇이든 18(듀잇 4개입)로 보던 것 → 0 을 돌려줍니다 */
function matchNo(name){
  const s = String(name || '');
  if (s.includes('트래블') || /travel/i.test(s)) {
    const m = s.match(/(\d+)\s*봉/);
    const map = {'1':15,'3':11,'5':12,'10':13,'20':14};
    return (m && map[m[1]]) || 11;
  }
  if (s.includes('레몬민트') || s.includes('레몬')) return 16;
  if (s.includes('그레이프') || s.includes('포도')) return 17;
  const m2 = s.match(/(\d+)\s*개입/);
  const map2 = {'4':18,'6':19,'10':20,'20':21};
  if (m2 && map2[m2[1]]) return map2[m2[1]];
  if (s.includes('듀잇') || /dew/i.test(s)) return 18;
  return 0;
}

/* QA 2026-08-31 — 장바구니 썸네일을 정하는 한 곳.
   1순위는 담을 때 함께 저장한 이미지(it.img)입니다.
   상품표(P)는 그 값이 없는 예전 항목을 위한 예비로만 씁니다. */
function cartImg(it, n){
  const raw = it && it.img;
  if (raw) return String(raw).replace(/^https?:\/\/[^/]+\//, '');
  if (P[n] && P[n].img) return P[n].img;
  const s = String((it && it.name) || '');
  if (/트래블|travel/i.test(s)) return 'assets/prod/travel.jpg';
  if (/듀잇|dew/i.test(s))      return 'assets/prod/dew-lemon.jpg';
  return CDN;
}
function prodHref(n){ return n ? ('product.html?no=' + n) : 'index.html#all'; }
const detailUrl = n => (n && P[n])
  ? ('https://chewgumi.com/product/detail.html?product_no=' + n + '&cate_no=' + P[n].cate + '&display_group=1')
  : 'https://chewgumi.com/';
const won = v => '₩' + Number(v).toLocaleString();
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);

let CART = [];
try { CART = JSON.parse(localStorage.getItem('cg_cart') || '[]'); } catch(e){ CART = []; }
const save = () => { try { localStorage.setItem('cg_cart', JSON.stringify(CART)); } catch(e){} };

function chg(i, d){ CART[i].qty = Math.min(99, Math.max(1, (CART[i].qty || 1) + d)); save(); render(); }
function del(i){ CART.splice(i, 1); save(); render(); }

function selKeys(){ return [...document.querySelectorAll('.pick:checked')].map(c => +c.dataset.i); }
function toggleAll(el){ document.querySelectorAll('.pick').forEach(c => c.checked = el.checked); sumUp(); }

/* 배송비·합계는 서버가 계산합니다 — 주문서(checkout)와 한 곳에서만 정해지도록 */
const CG_SB  = 'https://psynvpuedzjvytsgdhgg.supabase.co';
const CG_KEY = 'sb_publishable_Tz7vgJXgYHQ3tyUfm87WTw_vV1Dxfuk';
let shipSeq = 0;
async function quoteShip(items, goods){
  const seq = ++shipSeq;
  const el  = id => document.getElementById(id);
  const body = (items || []).map(i => ({ id: i.id, qty: i.qty })).filter(x => x.id);
  if (!body.length){
    if (el('sShip')) el('sShip').textContent = '0원';
    if (el('sPay'))  el('sPay').textContent  = won(0);
    return;
  }
  try{
    const r = await fetch(CG_SB + '/functions/v1/coupon', {
      method:'POST',
      headers:{ apikey:CG_KEY, Authorization:'Bearer ' + CG_KEY,
                'Content-Type':'application/json' },
      body: JSON.stringify({ action:'quote', items: body, coupon:'' })
    });
    const q = await r.json();
    if (seq !== shipSeq) return;          /* 그 사이 수량이 바뀌었으면 버립니다 */
    if (!r.ok) throw new Error('quote');
    const ship = Number(q.ship || 0);
    if (el('sShip')) el('sShip').textContent = ship === 0 ? '무료' : won(ship);
    if (el('sPay'))  el('sPay').textContent  = won(Number(q.total != null ? q.total : goods + ship));
  }catch(e){
    if (seq !== shipSeq) return;
    /* 못 물어봤을 때 틀린 숫자를 보여 주느니 주문서로 넘깁니다 */
    if (el('sShip')) el('sShip').textContent = '주문서에서 계산';
    if (el('sPay'))  el('sPay').textContent  = won(goods) + ' + 배송비';
  }
}
function sumUp(){
  const sel = selKeys();
  const items = sel.length ? sel.map(i => CART[i]) : [];
  const goods = items.reduce((s,i)=>s+i.price*i.qty,0);
  const el = id => document.getElementById(id);
  if (el('sGoods')) el('sGoods').textContent = won(goods);
  /* 배송비 — 주문서와 같은 셈법(coupon quote)에 물어봅니다.
     전에는 '0원' 이 박혀 있어 장바구니와 주문서 금액이 2,500원 달랐습니다. */
  if (el('sShip'))  el('sShip').textContent  = '계산 중…';
  if (el('sPay'))   el('sPay').textContent   = won(goods);
  quoteShip(items, goods);
  if (el('selN'))   el('selN').textContent   = sel.length;
  const all = document.getElementById('allChk');
  if (all) all.checked = CART.length > 0 && sel.length === CART.length;
}
function delSelected(){
  const sel = selKeys();
  if (!sel.length) return cgModal({icon:'!',title:'삭제할 상품을 선택해 주세요'});
  CART = CART.filter((_, i) => !sel.includes(i));
  save(); render();
}

function render(){
  const box = document.getElementById('body');
  if (!CART.length) {
    box.innerHTML = '<div class="panel"><div class="empty">' +
      '<div class="e-t">장바구니에 담긴 상품이 없습니다</div>' +
      '<div>마음에 드는 츄구미를 담아보세요.</div>' +
      '<a href="index.html#all">상품 보러 가기</a></div></div>';
    return;
  }
  const rows = CART.map((it, i) => {
    const n = Number(it.id || it.no) || matchNo(it.name);   /* QA: 담을 때 저장된 상품번호가 1순위 */
    return '<div class="item">' +
      '<input type="checkbox" class="pick" data-i="' + i + '" checked onchange="sumUp()" aria-label="선택">' +
      '<div class="th"><img src="' + esc(cartImg(it, n)) + '" alt="" loading="lazy" '
        + 'onerror="this.onerror=null;this.src=\''+CDN+'\'"></div>' +
      '<div class="c">' +
        '<a class="n" href="' + prodHref(n) + '">' + esc(it.name) + '</a>' +
        '<div class="opt">구성 : ' + esc((P[n] && P[n].n) || it.name) + '</div>' +
        '<div class="opt-act"><a href="' + prodHref(n) + '">옵션 변경</a>' +
        '<a href="' + detailUrl(n) + '" target="_blank" rel="noopener">공식몰에서 구매 →</a></div>' +
      '</div>' +
      '<div class="right">' +
        '<div class="ctrl"><button onclick="chg(' + i + ',-1)" aria-label="수량 감소">−</button>' +
        '<span>' + it.qty + '</span>' +
        '<button onclick="chg(' + i + ',1)" aria-label="수량 증가">＋</button></div>' +
        '<div class="amt">' + won(it.price * it.qty) + '</div>' +
      '</div>' +
      '<button class="del" onclick="del(' + i + ')" aria-label="삭제">✕</button></div>';
  }).join('');

  box.innerHTML =
    '<div class="panel">' +
      '<div class="list-head">' +
        '<label class="allbox"><input type="checkbox" id="allChk" checked onchange="toggleAll(this)"> 전체선택</label>' +
        '<span class="cnt">전체상품 ( <b>' + CART.length + '</b> )</span>' +
        '<button class="delsel" onclick="delSelected()">선택 삭제</button>' +
      '</div>' + rows +
    '</div>' +
    '<div class="panel pay">' +
      '<div class="pay-row"><span>총 상품금액</span><b id="sGoods">₩0</b></div>' +
      '<div class="pay-row"><span>총 배송비</span><b id="sShip">0원</b></div>' +
      '<div class="pay-row total"><span>결제 예정 금액</span><b id="sPay">₩0</b></div>' +
      '<p class="pay-note">주문서에서 배송지와 결제수단을 선택하실 수 있습니다. 결제는 이지페이(KICC)를 통해 안전하게 처리됩니다.</p>' +
      '<div class="steps">' +
        '<a class="s1" href="checkout.html">주문서 작성하기</a>' +
        '<a class="s2" href="' + detailUrl(matchNo(CART[0].name)) + '" target="_blank" rel="noopener">공식몰에서 구매하기</a>' +
        '<a class="s2" href="index.html#all">계속 쇼핑하기</a>' +
      '</div>' +
      '<div class="pays"><span>네이버페이</span><span>신용카드</span><span>계좌이체</span><span>가상계좌</span><span>무통장입금</span></div>' +
    '</div>';
  sumUp();
}
render();
</script>
