/* 글래스 팝업 (중앙 · 라운드) */
.cg-dim{position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;padding:20px;
  background:rgba(20,10,14,.42);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.cg-dim.on{display:flex}
.cg-box{width:100%;max-width:360px;border-radius:26px;padding:28px 24px 22px;text-align:center;
  background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.9);
  backdrop-filter:blur(26px) saturate(125%);-webkit-backdrop-filter:blur(26px) saturate(125%);
  box-shadow:0 24px 60px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.95);
  animation:cgPop .28s cubic-bezier(.34,1.4,.5,1)}
@keyframes cgPop{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:none}}
.cg-ico{width:56px;height:56px;margin:0 auto 14px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:25px;background:linear-gradient(135deg,var(--main2),var(--main));color:#fff;
  box-shadow:0 8px 20px rgba(216,37,88,.32)}
.cg-t{font-size:17px;font-weight:700;line-height:1.5;word-break:keep-all;letter-spacing:-.02em}
.cg-s{margin-top:8px;font-size:13px;color:var(--gray);line-height:1.7;word-break:keep-all}
.cg-acts{display:flex;gap:9px;margin-top:20px}
.cg-acts button,.cg-acts a{flex:1;height:48px;border:0;border-radius:999px;font-family:inherit;font-size:13.5px;
  font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cg-ok{background:linear-gradient(135deg,var(--main2),var(--main));color:#fff;box-shadow:0 8px 20px rgba(216,37,88,.3)}
.cg-gh{background:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.95);color:var(--ink)}
@media(prefers-reduced-motion:reduce){.cg-box{animation:none}}

:root{ --main:#D82558; --main2:#E95073; --pink-light:#FFE4E6; --sub:#FFE923;
  --ink:#000; --gray:#797979; --line:rgba(255,255,255,.85); --glass:rgba(255,255,255,.62); }
*{margin:0;padding:0;box-sizing:border-box}
body{ font-family:"SUIT Variable","SUIT","Noto Sans KR",sans-serif; color:var(--ink); min-height:100vh; padding-bottom:70px;
  background:radial-gradient(900px 500px at 12% -5%, rgba(236,94,134,.14), transparent 60%),
    radial-gradient(700px 460px at 95% 12%, rgba(255,233,35,.16), transparent 60%),
    linear-gradient(180deg,#FFF7FA,#FDF3F5 45%,#FFF9F4); }
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--main2);outline-offset:3px;border-radius:8px}
.topbar{height:45px;display:flex;align-items:center;justify-content:center;padding:0 16px;
  background:linear-gradient(90deg,var(--main2),var(--main));color:#fff;font-size:15px;font-weight:600}
.topbar b{color:var(--sub);font-weight:800}
.head{max-width:900px;margin:0 auto;padding:22px 20px 0;display:flex;align-items:center;justify-content:space-between}
.head .logo{font-family:'Poppins',sans-serif;font-weight:800;font-size:20px;color:var(--main)}
.head nav a{font-size:12.5px;color:var(--gray);margin-left:16px}
.wrap{max-width:900px;margin:0 auto;padding:22px 20px}
h1{font-family:'Poppins',sans-serif;font-size:28px;font-weight:700;margin-bottom:4px}
.lead{font-size:13px;color:var(--gray);margin-bottom:22px}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px;
  backdrop-filter:blur(18px) saturate(120%);-webkit-backdrop-filter:blur(18px) saturate(120%);
  box-shadow:0 12px 30px rgba(0,0,0,.07), inset 0 1px 0 rgba(255,255,255,.9)}
.item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid rgba(0,0,0,.07);align-items:center}
.item:last-child{border-bottom:0}
.item .th{width:82px;height:82px;flex:none;border-radius:14px;overflow:hidden;background:var(--pink-light)}
.item .th img{width:100%;height:100%;object-fit:cover}
.item .c{flex:1;min-width:0}
.item .n{font-size:14px;font-weight:600;line-height:1.4;word-break:break-word}
.item .p{margin-top:5px;font-size:12.5px;color:var(--gray)}
.item .p b{color:var(--main);font-weight:700}
.item .open{display:inline-block;margin-top:8px;font-size:11px;font-weight:700;color:#fff;padding:7px 13px;
  border-radius:999px;background:linear-gradient(135deg,var(--main2),var(--main));box-shadow:0 4px 12px rgba(216,37,88,.28)}
.item .ctrl{display:flex;align-items:center;gap:7px;flex:none}
.item .ctrl button{width:32px;height:32px;border:1px solid var(--line);border-radius:50%;
  background:rgba(255,255,255,.8);cursor:pointer;font-family:inherit;font-size:15px}
.item .ctrl span{min-width:22px;text-align:center;font-weight:700;font-size:14px}
.item .del{flex:none;background:none;border:0;color:var(--gray);font-size:16px;cursor:pointer;padding:6px}
.sum{display:flex;justify-content:space-between;align-items:baseline;padding-top:6px}
.sum .l{font-size:14px;color:var(--gray)}
.sum .v{font-size:26px;font-weight:800;color:var(--main)}
.note{font-size:12.5px;color:var(--gray);line-height:1.8;margin-top:12px}
.note b{color:var(--ink)}
.steps{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.steps a{height:54px;border-radius:999px;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700}
.s1{background:linear-gradient(135deg,var(--main2),var(--main));color:#fff;box-shadow:0 10px 24px rgba(216,37,88,.3)}
.s2{background:rgba(255,255,255,.78);border:1px solid var(--line);color:var(--ink)}
.pays{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;justify-content:center}
.pays span{font-size:10px;font-weight:600;color:#555;padding:5px 12px;border-radius:999px;
  background:rgba(255,255,255,.65);border:1px solid var(--line)}
.empty{text-align:center;padding:50px 20px;color:var(--gray)}
.empty .e-t{font-size:16px;font-weight:600;color:var(--ink);margin-bottom:8px}
.empty a{display:inline-block;margin-top:18px;padding:14px 30px;border-radius:999px;font-size:13px;font-weight:700;
  color:#fff;background:linear-gradient(135deg,var(--main2),var(--main))}
.foot{max-width:900px;margin:40px auto 0;padding:20px;border-top:1px solid rgba(0,0,0,.07);
  display:flex;flex-wrap:wrap;gap:12px;justify-content:center;font-size:11.5px;color:var(--gray)}
.foot a{text-decoration:underline;text-underline-offset:3px}
@media(max-width:560px){ .item .th{width:64px;height:64px} h1{font-size:23px} }

/* 탭 */
.tabs{display:flex;gap:8px;margin:16px 0 20px}
.tabs a{padding:10px 20px;border-radius:999px;font-size:13px;font-weight:600;
  background:rgba(255,255,255,.6);border:1px solid var(--line);color:var(--gray)}
.tabs a.on{background:linear-gradient(135deg,var(--main2),var(--main));color:#fff;border-color:transparent}
/* 목록 헤더 */
.list-head{display:flex;align-items:center;gap:12px;padding-bottom:12px;margin-bottom:4px;
  border-bottom:1.5px solid rgba(0,0,0,.12);flex-wrap:wrap}
.allbox{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;cursor:pointer}
.cnt{flex:1;font-size:13px;color:var(--gray)}
.cnt b{color:var(--main);font-weight:700}
.delsel{font-family:inherit;font-size:12px;font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer;
  background:rgba(255,255,255,.8);border:1px solid var(--line);color:var(--ink)}
input[type=checkbox]{appearance:none;width:20px;height:20px;flex:none;border-radius:6px;border:1.5px solid rgba(0,0,0,.2);
  background:#fff;cursor:pointer;position:relative;transition:.15s}
input[type=checkbox]:checked{background:linear-gradient(135deg,var(--main2),var(--main));border-color:transparent}
input[type=checkbox]:checked::after{content:"";position:absolute;left:6.5px;top:3px;width:5px;height:10px;
  border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
/* 아이템 */
.item .n{display:block;font-size:14px;font-weight:600;line-height:1.4}
.item .opt{margin-top:5px;font-size:11.5px;color:var(--gray)}
.item .opt-act{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}
.item .opt-act a{font-size:11px;font-weight:600;padding:6px 12px;border-radius:999px;
  background:rgba(255,255,255,.8);border:1px solid var(--line);color:var(--ink)}
.item .opt-act a:last-child{color:#fff;background:linear-gradient(135deg,var(--main2),var(--main));border-color:transparent}
.item .right{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:9px}
.item .amt{font-size:15px;font-weight:800;color:var(--main)}
/* 결제 요약 */
.pay-row{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;font-size:13.5px;color:var(--gray)}
.pay-row b{font-size:15px;color:var(--ink);font-weight:700}
.pay-row.total{margin-top:6px;padding-top:15px;border-top:1.5px solid rgba(0,0,0,.12);font-size:15px;color:var(--ink);font-weight:600}
.pay-row.total b{font-size:26px;font-weight:800;color:var(--main)}
.pay-note{margin-top:12px;font-size:11.5px;color:var(--gray);line-height:1.7}
.s1.alt{background:rgba(255,255,255,.85);border:1px solid var(--line);color:var(--ink);box-shadow:none}
@media(max-width:560px){
  .item{flex-wrap:wrap}
  .item .right{width:100%;flex-direction:row;justify-content:space-between;align-items:center}
}

<script>
/* 글래스 팝업 */
function cgClose(){ document.getElementById('cgDim').classList.remove('on'); }
function cgModal(o){
  o = o || {};
  document.getElementById('cgIco').textContent = o.icon || '✓';
  document.getElementById('cgT').textContent = o.title || '';
  document.getElementById('cgS').innerHTML = o.desc || '';
  var acts = o.actions || [{ t:'확인', k:'ok' }];
  document.getElementById('cgA').innerHTML = acts.map(function(a, i){
    var cls = a.k === 'ok' ? 'cg-ok' : 'cg-gh';
    return a.href
      ? '<a class="' + cls + '" href="' + a.href + '"' + (a.blank ? ' target="_blank" rel="noopener"' : '') + '>' + a.t + '</a>'
      : '<button class="' + cls + '" data-i="' + i + '">' + a.t + '</button>';
  }).join('');
  document.querySelectorAll('#cgA button').forEach(function(b){
    b.onclick = function(){ var a = acts[+b.dataset.i]; cgClose(); if (a && typeof a.fn === 'function') a.fn(); };
  });
  document.getElementById('cgDim').classList.add('on');
}

const CDN = 'https://chewgumi.com/web/product/medium/';
const P = {
  15:{n:'[1봉] 츄구미 여행용젤리 트래블잇 Travel-it (40g)', cate:42, img:'202511/9e01d14282da90dfce9b6cecef79044d.png'},
  11:{n:'[3봉] 츄구미 여행용젤리 트래블잇 Travel-it (40g)', cate:42, img:'202511/a613606b1993ee46b245871cef885fa3.png'},
  12:{n:'[5봉] 츄구미 여행용젤리 트래블잇 Travel-it (40g)', cate:42, img:'202511/62b0681bd9464871b96fb0be365a828b.png'},
  13:{n:'[10봉] 츄구미 여행용젤리 트래블잇 Travel-it (40g)', cate:42, img:'202511/3cebc0f3dd89b5a930cdd19b4c309602.png'},
  14:{n:'[20봉] 츄구미 여행용젤리 트래블잇 Travel-it (40g)', cate:42, img:'202511/d7b93d93f846e37de5fa33da43de5c37.png'},
  16:{n:'듀잇 레몬민트', cate:47, img:'202512/afad3d6dddd247af314c05157948d298.png'},
  17:{n:'듀잇 그레이프', cate:47, img:'202512/55a36711d9dc4b14c9ee46972c6afc3c.png'},
  18:{n:'듀잇 4개입', cate:47, img:'202512/2c58793be7f900d4997e26451366b9cb.png'},
  19:{n:'듀잇 6개입', cate:47, img:'202512/4f3394ac34364fc0e1f88744141a8c99.png'},
  20:{n:'듀잇 10개입', cate:47, img:'202512/f89d6da91dd672a5f25a7a295ebf3be6.png'},
  21:{n:'듀잇 20개입', cate:47, img:'202512/942a7d4949aa31bea2c60e76208c1b76.png'}
};
function matchNo(name){
  const s = String(name || '');
  const t = s.includes('트래블잇') || s.toLowerCase().includes('travel');
  if (t) { const m = s.match(/\[(\d+)봉\]/); const map={'1':15,'3':11,'5':12,'10':13,'20':14}; return (m && map[m[1]]) || 11; }
  if (s.includes('레몬민트')) return 16;
  if (s.includes('그레이프')) return 17;
  const m2 = s.match(/(\d+)개입/);
  const map2 = {'4':18,'6':19,'10':20,'20':21};
  return (m2 && map2[m2[1]]) || 18;
}
const detailUrl = n => 'https://chewgumi.com/product/detail.html?product_no=' + n + '&cate_no=' + P[n].cate + '&display_group=1';
const won = v => '₩' + Number(v).toLocaleString();
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);

let CART = [];
try { CART = JSON.parse(localStorage.getItem('cg_cart') || '[]'); } catch(e){ CART = []; }
const save = () => { try { localStorage.setItem('cg_cart', JSON.stringify(CART)); } catch(e){} };

function chg(i, d){ CART[i].qty = Math.min(99, Math.max(1, (CART[i].qty || 1) + d)); save(); render(); }
function del(i){ CART.splice(i, 1); save(); render(); }

function selKeys(){ return [...document.querySelectorAll('.pick:checked')].map(c => +c.dataset.i); }
function toggleAll(el){ document.querySelectorAll('.pick').forEach(c => c.checked = el.checked); sumUp(); }
function sumUp(){
  const sel = selKeys();
  const items = sel.length ? sel.map(i => CART[i]) : [];
  const goods = items.reduce((s,i)=>s+i.price*i.qty,0);
  const el = id => document.getElementById(id);
  if (el('sGoods')) el('sGoods').textContent = won(goods);
  if (el('sShip'))  el('sShip').textContent  = '0원';
  if (el('sPay'))   el('sPay').textContent   = won(goods);
  if (el('selN'))   el('selN').textContent   = sel.length;
  const all = document.getElementById('allChk');
  if (all) all.checked = CART.length > 0 && sel.length === CART.length;
}
function delSelected(){
  const sel = selKeys();
  if (!sel.length) return cgModal({icon:'!',title:'삭제할 상품을 선택해 주세요'});
  CART = CART.filter((_, i) => !sel.includes(i));
  save(); render();
}

function render(){
  const box = document.getElementById('body');
  if (!CART.length) {
    box.innerHTML = '<div class="panel"><div class="empty">' +
      '<div class="e-t">장바구니에 담긴 상품이 없습니다</div>' +
      '<div>마음에 드는 츄구미를 담아보세요.</div>' +
      '<a href="index.html#all">상품 보러 가기</a></div></div>';
    return;
  }
  const rows = CART.map((it, i) => {
    const n = matchNo(it.name);
    return '<div class="item">' +
      '<input type="checkbox" class="pick" data-i="' + i + '" checked onchange="sumUp()" aria-label="선택">' +
      '<div class="th"><img src="' + CDN + P[n].img + '" alt="" loading="lazy"></div>' +
      '<div class="c">' +
        '<a class="n" href="product.html?no=' + n + '">' + esc(it.name) + '</a>' +
        '<div class="opt">구성 : ' + esc(P[n].n) + '</div>' +
        '<div class="opt-act"><a href="product.html?no=' + n + '">옵션 변경</a>' +
        '<a href="' + detailUrl(n) + '" target="_blank" rel="noopener">공식몰에서 구매 →</a></div>' +
      '</div>' +
      '<div class="right">' +
        '<div class="ctrl"><button onclick="chg(' + i + ',-1)" aria-label="수량 감소">−</button>' +
        '<span>' + it.qty + '</span>' +
        '<button onclick="chg(' + i + ',1)" aria-label="수량 증가">＋</button></div>' +
        '<div class="amt">' + won(it.price * it.qty) + '</div>' +
      '</div>' +
      '<button class="del" onclick="del(' + i + ')" aria-label="삭제">✕</button></div>';
  }).join('');

  box.innerHTML =
    '<div class="panel">' +
      '<div class="list-head">' +
        '<label class="allbox"><input type="checkbox" id="allChk" checked onchange="toggleAll(this)"> 전체선택</label>' +
        '<span class="cnt">전체상품 ( <b>' + CART.length + '</b> )</span>' +
        '<button class="delsel" onclick="delSelected()">선택 삭제</button>' +
      '</div>' + rows +
    '</div>' +
    '<div class="panel pay">' +
      '<div class="pay-row"><span>총 상품금액</span><b id="sGoods">₩0</b></div>' +
      '<div class="pay-row"><span>총 배송비</span><b id="sShip">0원</b></div>' +
      '<div class="pay-row total"><span>결제 예정 금액</span><b id="sPay">₩0</b></div>' +
      '<p class="pay-note">주문서에서 배송지와 결제수단을 선택하실 수 있습니다. 결제는 토스페이먼츠를 통해 안전하게 처리됩니다.</p>' +
      '<div class="steps">' +
        '<a class="s1" href="checkout.html">주문서 작성하기</a>' +
        '<a class="s2" href="' + detailUrl(matchNo(CART[0].name)) + '" target="_blank" rel="noopener">공식몰에서 구매하기</a>' +
        '<a class="s2" href="index.html#all">계속 쇼핑하기</a>' +
      '</div>' +
      '<div class="pays"><span>네이버페이</span><span>신용카드</span><span>계좌이체</span><span>가상계좌</span><span>무통장입금</span></div>' +

  <div class="cgbot-ft">

      onkeydown="if(event.key==='Enter')cgbotSend()">

  </div>
</div>
<script>
(function(){
  var SB='https://psynvpuedzjvytsgdhgg.supabase.co';
  var KEY='sb_publishable_Tz7vgJXgYHQ3tyUfm87WTw_vV1Dxfuk';
  var kakaoUrl='', started=false, hist=[];
  var sid=''; try{ sid=localStorage.getItem('cg_chat_sid')||'';
    if(!sid){ sid=Math.random().toString(36).slice(2)+Date.now().toString(36);
      localStorage.setItem('cg_chat_sid',sid);} }catch(e){}

  function el(id){return document.getElementById(id);}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function add(role,text){
    var d=document.createElement('div');
    d.className='cgbot-msg '+(role==='me'?'me':'bot');
    d.textContent=text; el('cgbotBody').appendChild(d);
    el('cgbotBody').scrollTop=el('cgbotBody').scrollHeight;
    return d;
  }
  function addKakao(){
    if(!kakaoUrl) return;
    var a=document.createElement('a');
    a.className='cgbot-kakao'; a.href=kakaoUrl; a.target='_blank'; a.rel='noopener';
    a.textContent='카카오톡으로 상담원 연결';
    el('cgbotBody').appendChild(a);
    el('cgbotBody').scrollTop=el('cgbotBody').scrollHeight;
  }
  function quick(){
    var qs=['배송 얼마나 걸리나요','배송비 얼마인가요','무통장 계좌 알려주세요','트래블잇이 뭔가요'];
    var w=document.createElement('div'); w.className='cgbot-quick';
    qs.forEach(function(q){
      var b=document.createElement('button'); b.textContent=q;
      b.onclick=function(){ el('cgbotIn').value=q; cgbotSend(); w.remove(); };
      w.appendChild(b);
    });
    el('cgbotBody').appendChild(w);
  }
  window.cgbotToggle=function(){
    var w=el('cgbotWin'); w.classList.toggle('on');
    if(w.classList.contains('on')){
      if(!started){
        started=true;
        add('bot','안녕하세요, 츄구미입니다.\n배송·상품·주문에 대해 물어보세요.');
        quick();
        fetch(SB+'/functions/v1/chat',{method:'POST',
          headers:{'Content-Type':'application/json',apikey:KEY},
          body:JSON.stringify({action:'config'})})
        .then(function(r){return r.json();})
        .then(function(d){ kakaoUrl=d.kakao||''; }).catch(function(){});
      }
      setTimeout(function(){el('cgbotIn').focus();},80);
    }
  };
  window.cgbotSend=function(){
    var v=el('cgbotIn').value.trim(); if(!v) return;
    el('cgbotIn').value=''; add('me',v);
    hist.push({role:'me',text:v});
    var t=add('bot','…'); el('cgbotBtn').disabled=true;
    fetch(SB+'/functions/v1/chat',{method:'POST',
      headers:{'Content-Type':'application/json',apikey:KEY},
      body:JSON.stringify({action:'ask',question:v,sessionId:sid,history:hist.slice(0,-1)})})
    .then(function(r){return r.json();})
    .then(function(d){
      el('cgbotBtn').disabled=false;
      t.textContent=d.answer||'답변을 가져오지 못했습니다.';
      hist.push({role:'bot',text:t.textContent});
      if(d.kakao) kakaoUrl=d.kakao;
      if(d.handoff) addKakao();
    }).catch(function(){
      el('cgbotBtn').disabled=false;
      t.textContent='연결에 실패했습니다. 잠시 후 다시 시도해 주세요.';
      addKakao();
    });
  };
})();
</script>
