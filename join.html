<!DOCTYPE html>
<!-- ChewGumi Join (약관동의) v19 · MedIT -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원 가입 | CHEWGUMI</title>
<meta name="description" content="츄구미 회원가입 — 가입하고 2,000원 할인쿠폰을 받아보세요.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT/fonts/variable/woff2/SUIT-Variable.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{ --main:#D82558; --main2:#E95073; --pink-bg:#FFBDCC; --pink-light:#FFE4E6; --sub:#FFE923;
  --ink:#000; --gray:#797979; --line:rgba(255,255,255,.85); --glass:rgba(255,255,255,.62); }
*{margin:0;padding:0;box-sizing:border-box}
body{ font-family:"SUIT Variable","SUIT","Noto Sans KR",sans-serif; color:var(--ink); min-height:100vh; padding-bottom:70px;
  background:radial-gradient(900px 500px at 12% -5%, rgba(236,94,134,.16), transparent 60%),
    radial-gradient(700px 460px at 95% 12%, rgba(255,233,35,.18), transparent 60%),
    linear-gradient(180deg,#FFF7FA,#FDF3F5 45%,#FFF9F4); }
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--main2);outline-offset:3px;border-radius:8px}
.topbar{height:45px;display:flex;align-items:center;justify-content:center;padding:0 16px;
  background:linear-gradient(90deg,var(--main2),var(--main));color:#fff;font-size:15px;font-weight:600}
.topbar b{color:var(--sub);font-weight:800}
.head{max-width:640px;margin:0 auto;padding:26px 20px 0;display:flex;align-items:center;justify-content:space-between}
.head .logo{font-family:'Poppins',sans-serif;font-weight:800;font-size:20px;letter-spacing:-.02em;color:var(--main)}
.head a.home{font-size:12px;color:var(--gray)}
.wrap{max-width:640px;margin:0 auto;padding:22px 20px}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
.lead{font-size:13.5px;color:var(--gray);line-height:1.7;margin-bottom:22px}
.steps{display:flex;gap:8px;margin-bottom:22px}
.steps div{flex:1;text-align:center;padding:10px 4px;border-radius:12px;font-size:12px;font-weight:600;
  background:rgba(255,255,255,.55);border:1px solid var(--line);color:var(--gray)}
.steps div.on{background:linear-gradient(135deg,var(--main2),var(--main));color:#fff;border-color:transparent}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:14px;
  backdrop-filter:blur(20px) saturate(120%);-webkit-backdrop-filter:blur(20px) saturate(120%);
  box-shadow:0 14px 34px rgba(0,0,0,.08), inset 0 1px 0 rgba(255,255,255,.9)}
.all-row{display:flex;gap:11px;align-items:flex-start;padding-bottom:16px;margin-bottom:14px;border-bottom:1px solid rgba(0,0,0,.08)}
.all-row .t{font-size:15px;font-weight:700}
.all-row .s{font-size:11.5px;color:var(--gray);line-height:1.6;margin-top:4px}
.row{display:flex;gap:11px;align-items:center;padding:11px 0}
.row .label{font-size:13.5px;flex:1}
.row .label .req{color:var(--main);font-weight:700}
.row .label .opt{color:var(--gray)}
.row a.view{font-size:11.5px;color:var(--gray);text-decoration:underline;text-underline-offset:3px}
.sub-rows{padding-left:28px;border-left:2px solid rgba(0,0,0,.06);margin:2px 0 4px}
input[type=checkbox]{appearance:none;width:22px;height:22px;flex:none;border-radius:50%;border:1.5px solid rgba(0,0,0,.2);
  background:#fff;cursor:pointer;position:relative;transition:.15s}
input[type=checkbox]:checked{background:linear-gradient(135deg,var(--main2),var(--main));border-color:transparent}
input[type=checkbox]:checked::after{content:"";position:absolute;left:7px;top:3.5px;width:6px;height:11px;
  border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.acts{display:flex;gap:10px;margin-top:18px}
.acts a,.acts button{flex:1;height:52px;border:0;border-radius:999px;font-family:inherit;font-size:14px;font-weight:700;
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.acts .cancel{background:rgba(255,255,255,.7);border:1px solid var(--line);color:var(--ink)}
.acts .next{background:linear-gradient(135deg,var(--main2),var(--main));color:#fff;box-shadow:0 10px 24px rgba(216,37,88,.32)}
.acts .next:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.msg{font-size:12px;color:var(--main);margin-top:10px;min-height:16px}
.note{font-size:11.5px;color:var(--gray);line-height:1.8;margin-top:16px;text-align:center}
.foot{max-width:640px;margin:30px auto 0;padding:20px;border-top:1px solid rgba(0,0,0,.07);
  display:flex;flex-wrap:wrap;gap:12px;justify-content:center;font-size:11.5px;color:var(--gray)}
.foot a{text-decoration:underline;text-underline-offset:3px}
@media(max-width:480px){h1{font-size:22px}.panel{padding:16px;border-radius:18px}}
</style>
</head>
<body>
<div class="topbar">회원 가입 하고 <b>&nbsp;2000원 할인 쿠폰&nbsp;</b> 받기!</div>

<div class="head">
  <a class="logo" href="index.html">CHEW GUMI</a>
  <a class="home" href="index.html">← 홈으로</a>
</div>

<div class="wrap">
  <h1>회원 가입</h1>
  <p class="lead">약관에 동의하시면 공식몰 가입 화면으로 이동합니다.<br>가입 완료 시 <b>2,000원 할인쿠폰</b>이 지급됩니다.</p>

  <div class="steps">
    <div class="on">1. 약관동의</div>
    <div>2. 정보입력</div>
    <div>3. 가입완료</div>
  </div>

  <div class="panel">
    <div class="all-row">
      <input type="checkbox" id="all" onchange="toggleAll(this)">
      <label for="all" style="cursor:pointer">
        <div class="t">전체 동의</div>
        <div class="s">모든 약관을 확인하고 전체 동의합니다.<br>(필수 및 선택 정보에 대한 동의가 포함되어 있습니다.)</div>
      </label>
    </div>

    <div class="row">
      <input type="checkbox" class="req" id="c1" onchange="sync()">
      <label class="label" for="c1"><span class="req">[필수]</span> 이용약관 동의</label>
      <a class="view" href="https://chewgumi.com/member/mall_agreement.html" target="_blank" rel="noopener">보기</a>
    </div>

    <div class="row">
      <input type="checkbox" class="req" id="c2" onchange="sync()">
      <label class="label" for="c2"><span class="req">[필수]</span> 개인정보 수집 및 이용 동의</label>
      <a class="view" href="https://chewgumi.com/member/privacy.html" target="_blank" rel="noopener">보기</a>
    </div>

    <div class="row">
      <input type="checkbox" id="c3" onchange="syncSub();sync()">
      <label class="label" for="c3"><span class="opt">[선택]</span> 쇼핑정보 수신 동의</label>
    </div>
    <div class="sub-rows">
      <div class="row">
        <input type="checkbox" class="sub" id="c3a" onchange="sync()">
        <label class="label" for="c3a"><span class="opt">[선택]</span> SMS 수신 동의</label>
      </div>
      <div class="row">
        <input type="checkbox" class="sub" id="c3b" onchange="sync()">
        <label class="label" for="c3b"><span class="opt">[선택]</span> 이메일 수신 동의</label>
      </div>
    </div>

    <div class="acts">
      <a class="cancel" href="index.html">취소</a>
      <button class="next" id="next" disabled onclick="goNext()">다음</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <p class="note">
    이미 회원이신가요? <a href="https://chewgumi.com/member/login.html" target="_blank" rel="noopener" style="text-decoration:underline">로그인하기</a><br>
    회원 정보는 공식몰(chewgumi.com)에서 안전하게 관리됩니다.
  </p>
</div>

<div class="foot">
  <a href="about.html">회사소개</a>
  <a href="https://chewgumi.com/member/mall_agreement.html" target="_blank" rel="noopener">이용약관</a>
  <a href="https://chewgumi.com/member/privacy.html" target="_blank" rel="noopener">개인정보처리방침</a>
  <a href="guide.html">이용안내</a>
  <a href="faq.html">자주묻는질문(FAQ)</a>
</div>

<script>
function toggleAll(el){
  document.querySelectorAll('.panel input[type=checkbox]').forEach(c => { if (c.id !== 'all') c.checked = el.checked; });
  sync();
}
function syncSub(){
  var on = document.getElementById('c3').checked;
  document.querySelectorAll('.sub').forEach(c => c.checked = on);
}
function sync(){
  var reqs = [...document.querySelectorAll('.req')];
  var ok = reqs.every(c => c.checked);
  document.getElementById('next').disabled = !ok;
  var boxes = [...document.querySelectorAll('.panel input[type=checkbox]')].filter(c => c.id !== 'all');
  document.getElementById('all').checked = boxes.every(c => c.checked);
  document.getElementById('msg').textContent = ok ? '' : '필수 약관에 동의하셔야 다음 단계로 진행됩니다.';
}
function goNext(){
  document.getElementById('msg').textContent = '공식몰 가입 화면으로 이동합니다…';
  location.href = 'https://chewgumi.com/member/agreement.html';
}
</script>
</body>
</html>
