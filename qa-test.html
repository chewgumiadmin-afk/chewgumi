<style>
:root{--main:#D82558;--main2:#E95073;--ok:#2AA060;--warn:#E9A23B;--bad:#C0395C;

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:"SUIT Variable","SUIT","Noto Sans KR",sans-serif;color:var(--ink);

a{color:inherit}button{font-family:inherit;cursor:pointer}
.hd{position:sticky;top:0;z-index:50;padding:calc(15px + env(safe-area-inset-top)) 18px 12px;

.sect{margin:20px 4px 9px;font-size:11px;letter-spacing:2px;font-weight:700;color:var(--main)}
.it{display:flex;gap:11px;align-items:flex-start;padding:13px 15px;margin-bottom:8px;

.it.ok{opacity:.5}
.it.ng{border-color:rgba(192,57,92,.4);background:rgba(192,57,92,.06)}
.it .tx{flex:1;font-size:13.5px;line-height:1.6;word-break:keep-all}
.it.ok .tx{text-decoration:line-through;color:var(--gray)}
.it .x{flex:none;width:30px;height:30px;border-radius:9px;border:.5px solid rgba(192,57,92,.25);
  background:#fff;color:var(--bad);font-size:14px;font-weight:700;line-height:1}
.it.ng .x{background:var(--bad);color:#fff;border-color:transparent}
.note{padding:20px 6px;font-size:11.5px;line-height:1.9;color:var(--gray)}
.bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));
  z-index:60;max-width:600px;margin:0 auto;display:flex;gap:8px;padding:9px;

.bar button{flex:1;height:42px;border-radius:999px;font-size:12.5px;font-weight:700;border:0}
.bar .rp{background:linear-gradient(135deg,var(--main2),var(--main));color:#fff}
.bar .rs{background:rgba(0,0,0,.06);color:#444}

  /* 모바일 — 긴 글자가 화면을 밀어내지 않도록 */
  @media(max-width:640px){

    .acts::-webkit-scrollbar,.chips::-webkit-scrollbar,
    .tabs::-webkit-scrollbar,.sug::-webkit-scrollbar{display:none}
    .out,pre,code{overflow-x:auto;word-break:break-all}
  }
</style>

var $=function(i){return document.getElementById(i);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
var cur=G[0]?G[0].k:'', st={};
try{ st=JSON.parse(localStorage.getItem('cg_qa')||'{}'); }catch(e){}
function save(){ try{ localStorage.setItem('cg_qa',JSON.stringify(st)); }catch(e){} }
function key(g,i){ return g+'_'+i; }

$('tabs').innerHTML=G.map(function(g,n){
  return '<button'+(n?'':' class="on"')+' data-k="'+g.k+'">'+esc(g.label)+'</button>';
}).join('');
[].slice.call($('tabs').children).forEach(function(b){
  b.onclick=function(){
    [].slice.call($('tabs').children).forEach(function(x){x.classList.remove('on');});
    b.classList.add('on'); cur=b.dataset.k; render();
    window.scrollTo({top:0,behavior:'smooth'});
  };
});
window.tog=function(g,i){
  var k=key(g,i); st[k]=(st[k]==='ok')?null:'ok'; save(); render();
};
window.ng=function(e,g,i){
  e.stopPropagation();
  var k=key(g,i); st[k]=(st[k]==='ng')?null:'ng'; save(); render();
};
function render(){
  var all=0,ok=0,ng=0;
  G.forEach(function(g){
    if(g.k==='skip') return;
    g.items.forEach(function(_,i){
      all++; var v=st[key(g.k,i)];
      if(v==='ok') ok++; if(v==='ng') ng++;
    });
  });
  var pct=all?Math.round((ok+ng)/all*100):0;
  $('pgBar').style.width=pct+'%';
  $('pgTxt').textContent='확인 '+(ok+ng)+' / '+all+'건 ('+pct+'%) · 정상 '+ok+' · 문제 '+ng;

  var g=null; G.forEach(function(x){ if(x.k===cur) g=x; });
  if(!g) return;
  var last='', out='';
  g.items.forEach(function(it,i){
    if(it.s&&it.s!==last){ out+='<div class="sect">'+esc(it.s)+'</div>'; last=it.s; }
    var v=st[key(g.k,i)];
    var cls=v==='ok'?' ok':(v==='ng'?' ng':'');
    out+='<div class="it'+cls+'" onclick="tog(\''+g.k+'\','+i+')">'
      +(g.k==='skip'?'':'<input type="checkbox"'+(v==='ok'?' checked':'')+' onclick="event.stopPropagation();tog(\''+g.k+'\','+i+')">')
      +'<span class="tx">'+esc(it.t)+'</span>'
      +(g.k==='skip'?'':'<button class="x" onclick="ng(event,\''+g.k+'\','+i+')" aria-label="문제 있음">!</button>')
      +'</div>';
  });
  $('list').innerHTML=out;
  $('foot').innerHTML='항목을 누르면 정상, <b>!</b> 를 누르면 문제로 기록됩니다.'
    +'<br>기록은 이 기기에만 저장됩니다.'
    +'<br><br><a href="index.html" style="text-decoration:underline">사이트</a>'
    +' · <a href="console.html" style="text-decoration:underline">관리자</a>'
    +' · <a href="tasks.html" style="text-decoration:underline">업무 안내</a>';
}
window.report=function(){
  var t='[츄구미 기능 테스트 결과] '+new Date().toLocaleDateString('ko-KR')+'\n\n';
  var tot=0,ok=0,bad=[];
  G.forEach(function(g){
    if(g.k==='skip') return;
    g.items.forEach(function(it,i){
      tot++; var v=st[key(g.k,i)];
      if(v==='ok') ok++;
      if(v==='ng') bad.push(g.label+' · '+(it.s||'')+' — '+it.t);
    });
  });
  t+='전체 '+tot+'건 / 정상 '+ok+'건 / 문제 '+bad.length+'건\n';
  if(bad.length){
    t+='\n[문제 발견]\n'+bad.map(function(x,n){return (n+1)+'. '+x;}).join('\n');
  } else t+='\n문제 없음';
  navigator.clipboard.writeText(t).then(function(){
    alert('복사되었습니다.\n카톡이나 이슈에 붙여넣어 주세요.');
  }).catch(function(){
    var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);
    a.select();document.execCommand('copy');a.remove();alert('복사되었습니다.');
  });
};
window.resetAll=function(){
  if(!confirm('모든 체크를 지울까요?')) return;
  st={}; save(); render();
};
