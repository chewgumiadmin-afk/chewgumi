<!DOCTYPE html>
<!-- ChewGumi Mobile Preview v1 · MedIT -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>모바일 미리보기 | CHEWGUMI</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT/fonts/variable/woff2/SUIT-Variable.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--main:#D82558;--main2:#E95073;--ok:#2AA060;--gray:#797979;--ink:#1a1a1a;
  --line:rgba(255,255,255,.85);--glass:rgba(255,255,255,.62)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"SUIT Variable","SUIT","Noto Sans KR",sans-serif;color:var(--ink);min-height:100vh;padding:20px 14px 80px;
  background:radial-gradient(900px 500px at 12% -5%,rgba(236,94,134,.13),transparent 60%),
    linear-gradient(180deg,#FFF7FA,#FDF3F5 45%,#FFF9F4)}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}
a:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--main2);outline-offset:3px;border-radius:8px}
.wrap{max-width:900px;margin:0 auto}
.top{margin-bottom:16px}
.top h1{font-family:'Poppins',sans-serif;font-size:23px}
.top .s{font-size:11px;letter-spacing:3px;color:var(--gray);margin-top:3px}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;
  backdrop-filter:blur(18px) saturate(120%);-webkit-backdrop-filter:blur(18px) saturate(120%);
  box-shadow:0 10px 26px rgba(0,0,0,.07),inset 0 1px 0 rgba(255,255,255,.9)}
.panel h2{font-size:11px;letter-spacing:2.5px;color:var(--gray);font-weight:700;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button,.chips a{padding:10px 14px;border-radius:999px;font-size:12px;font-weight:600;
  background:rgba(255,255,255,.8);border:1px solid var(--line);color:#444;white-space:nowrap}
.chips button.on{background:linear-gradient(135deg,var(--main2),var(--main));color:#fff;border-color:transparent}
.frame-wrap{display:flex;justify-content:center;padding:10px 0}
.device{position:relative;background:#111;border-radius:34px;padding:11px 8px 14px;
  box-shadow:0 20px 50px rgba(0,0,0,.24);transition:width .3s,height .3s}
.device::before{content:"";position:absolute;top:5px;left:50%;transform:translateX(-50%);
  width:34%;height:4px;border-radius:3px;background:#333}
.device iframe{width:100%;height:100%;border:0;border-radius:24px;background:#fff;display:block}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.bar select{flex:1;min-width:150px;padding:10px 12px;border-radius:11px;font-size:12.5px;font-family:inherit;
  border:1px solid var(--line);background:rgba(255,255,255,.85)}
.btn{padding:11px 18px;border:0;border-radius:999px;font-size:12.5px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--main2),var(--main));box-shadow:0 8px 18px rgba(216,37,88,.28)}
.btn.ghost{background:rgba(255,255,255,.85);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.note{font-size:11.5px;color:var(--gray);line-height:1.75;margin-top:10px}
.warn{background:rgba(233,162,59,.14);border:1px solid rgba(233,162,59,.35);border-radius:13px;
  padding:12px 14px;font-size:12px;line-height:1.75;margin-top:10px}
.warn b{color:#9a6414}
.chk{display:flex;gap:9px;align-items:flex-start;padding:9px 0;font-size:12.5px;line-height:1.6;
  border-bottom:1px solid rgba(0,0,0,.05)}
.chk:last-child{border-bottom:0}
.chk input{width:19px;height:19px;flex:none;margin-top:2px;appearance:none;border-radius:6px;
  border:1.5px solid rgba(0,0,0,.2);background:#fff;position:relative;cursor:pointer}
.chk input:checked{background:linear-gradient(135deg,var(--main2),var(--main));border-color:transparent}
.chk input:checked::after{content:"";position:absolute;left:6px;top:2.5px;width:5px;height:10px;
  border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.chk label{flex:1;cursor:pointer}
.grp{font-size:11.5px;font-weight:700;letter-spacing:1px;color:var(--main);margin:14px 0 4px}
.grp:first-of-type{margin-top:0}
.fab{position:fixed;right:16px;bottom:18px;z-index:50;display:flex;flex-direction:column;gap:8px}
.fab a{padding:14px 18px;border-radius:999px;font-size:13px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--main2),var(--main));box-shadow:0 10px 24px rgba(216,37,88,.35)}

  /* 모바일 — 긴 글자가 화면을 밀어내지 않도록 */
  @media(max-width:640px){
    body{overflow-x:hidden}
    .msg,.hint,p,li,td,th,.rb,.ib,.sb,.d{word-break:keep-all;overflow-wrap:anywhere}
    [style*="nowrap"],.nowrap{white-space:normal !important}
    .acts,.chips,.tabs,.sug,.eps,.kinds{overflow-x:auto;-webkit-overflow-scrolling:touch;
      scrollbar-width:none;padding-bottom:2px}
    .acts::-webkit-scrollbar,.chips::-webkit-scrollbar,
    .tabs::-webkit-scrollbar,.sug::-webkit-scrollbar{display:none}
    .out,pre,code{overflow-x:auto;word-break:break-all}
  }

  .devs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .devs button{padding:9px 14px;border-radius:999px;font-size:12px;font-weight:600;
    background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.9);
    color:#5a5a62;cursor:pointer;font-family:inherit}
  .devs button.on{background:linear-gradient(135deg,#E95073,#D82558);
    color:#fff;border-color:transparent}
  #fr{transition:width .3s cubic-bezier(.2,.7,.3,1),height .3s cubic-bezier(.2,.7,.3,1)}
</style>
<link rel="stylesheet" href="assets/glass.css">
<link rel="stylesheet" href="assets/ui.css">
<link rel="stylesheet" href="assets/stable.css">
<link rel="stylesheet" href="assets/admin-ui.css">
<link rel="stylesheet" href="assets/popup.css">
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Mobile Preview</h1>
    <div class="s">모바일 화면 확인 · 버그 리포트</div>
  </div>

  <div class="panel">
    <h2>화면 선택</h2>
    <div class="bar">
      <select id="pg" onchange="go()">
        <optgroup label="고객 화면">
          <option value="index.html">메인</option>
          <option value="index.html#all">전체 상품</option>
          <option value="about.html">브랜드 소개</option>
          <option value="product.html?no=18">상품 상세</option>
          <option value="cart.html">장바구니</option>
          <option value="checkout.html">주문서</option>
          <option value="subscribe.html">정기구독</option>
          <option value="reports.html">고객 리포트</option>
          <option value="join.html">회원가입</option>
          <option value="login.html">로그인</option>
          <option value="mypage.html">마이페이지</option>
          <option value="notice.html">공지사항</option>
          <option value="review.html">후기</option>
          <option value="qna.html">상품 문의</option>
          <option value="faq.html">자주묻는질문</option>
          <option value="guide.html">이용안내</option>
          <option value="tracking.html">배송조회</option>
          <option value="wish.html">위시리스트</option>
        </optgroup>
        <optgroup label="관리 화면">
          <option value="console.html">관리자 홈</option>
          <option value="orders.html">주문 · 배송</option>
          <option value="stock.html">재고 · 품절</option>
          <option value="subs-admin.html">정기구독 관리</option>
          <option value="reports-admin.html">고객 리포트 관리</option>
          <option value="help.html">도움말 창구</option>
          <option value="dev.html">AI 개발 도우미</option>
          <option value="github.html">개발 현황</option>
          <option value="cafe24.html">카페24 API</option>
          <option value="issue.html">이슈 보드</option>
        </optgroup>
      </select>
      <button class="btn" onclick="reload()">새로고침</button>
      <a class="btn ghost" id="openNew" href="index.html#all" target="_blank" rel="noopener">새 창</a>
    </div>
    <div class="chips" id="sizes">
      <button class="on" data-w="390" data-h="780">아이폰 390</button>
      <button data-w="360" data-h="740">안드로이드 360</button>
      <button data-w="430" data-h="860">큰 화면 430</button>
      <button data-w="768" data-h="900">태블릿 768</button>
    </div>
  </div>

  <div class="frame-wrap">
    <div class="device" id="device" style="width:406px;height:794px">
      <iframe id="fr" src="index.html#all" title="미리보기"></iframe>
    </div>
  </div>

  <div class="panel">
    <div class="warn">
      <b>화면이 비어 보이면</b> 브라우저가 미리보기 표시를 막은 것입니다.
      위 <b>[새 창]</b> 버튼으로 열어 확인해 주세요. 실제 동작은 동일합니다.
    </div>
    <div class="note">
      휴대폰에서는 이 페이지보다 <b>[새 창]</b>으로 직접 여는 편이 정확합니다.
      미리보기 틀은 화면 크기만 흉내 낼 뿐, 실제 터치 동작·키보드 반응은 기기에서 확인해야 합니다.
    </div>
  </div>

  <div class="panel">
    <h2>모바일 점검 항목</h2>
    <div id="chks"></div>
    <div class="note" id="chkMsg"></div>
  </div>
</div>

<div class="fab">
  <a href="issue.html" target="_blank" rel="noopener">버그 등록</a>
</div>

<script>
const $=id=>document.getElementById(id);
function go(){
  const p=$('page').value;
  $('fr').src=p; $('openNew').href=p;
}
function reload(){ const s=$('fr').src; $('fr').src='about:blank'; setTimeout(()=>$('fr').src=s,60); }
document.querySelectorAll('#sizes button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#sizes button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  const d=$('device');
  d.style.width=(+b.dataset.w+16)+'px';
  d.style.height=(+b.dataset.h+14)+'px';
});

const LIST=[
 ['메뉴','햄버거 메뉴가 열리고 항목이 모두 보인다'],
 ['메뉴','하단 탭바가 화면을 가리지 않는다'],
 ['메인','히어로 배너가 잘리지 않고 자동 전환된다'],
 ['메인','상품 카드가 2열로 정렬되고 이미지가 다 보인다'],
 ['메인','팝업을 닫은 뒤 스크롤이 정상 동작한다'],
 ['상품','상품을 누르면 상세창이 화면에 맞게 열린다'],
 ['상품','구성 선택 시 가격이 바뀐다'],
 ['상품','BUY NOW·ADD TO CART 버튼이 한 줄에 들어간다'],
 ['장바구니','수량 ＋/− 와 삭제가 눌린다'],
 ['주문','주소 검색 창이 정상적으로 열린다'],
 ['주문','키보드가 올라와도 입력칸이 가려지지 않는다'],
 ['주문','무통장입금 계좌 정보가 보인다'],
 ['회원','가입 시 인증 메일 버튼이 눌린다'],
 ['회원','소셜 로그인 버튼이 화면에 맞게 보인다'],
 ['공통','가로 스크롤이 생기지 않는다'],
 ['공통','글자가 잘리거나 겹치지 않는다'],
 ['공통','이미지가 깨지지 않는다']
];
(function(){
  let g='',html='';
  LIST.forEach((m,i)=>{
    if(m[0]!==g){g=m[0];html+='<div class="grp">'+g+'</div>';}
    html+='<div class="chk"><input type="checkbox" id="c'+i+'" onchange="cnt()">'
      +'<label for="c'+i+'">'+m[1]+'</label></div>';
  });
  $('chks').innerHTML=html; cnt();
})();
function cnt(){
  const all=document.querySelectorAll('#chks input').length;
  const on=document.querySelectorAll('#chks input:checked').length;
  $('chkMsg').textContent='확인 '+on+' / '+all+'항목' + (on===all?' · 모두 정상입니다.':'');
}
</script>
<script src="assets/lite.js" defer></script>
<script src="assets/nav.js" defer>
function setDev(b){
  document.querySelectorAll('.devs button').forEach(function(x){x.classList.remove('on');});
  b.classList.add('on');
  var f=document.getElementById('fr');
  if(!f) return;
  f.style.width=b.dataset.w+'px';
  f.style.maxWidth='100%';
  f.style.height=Math.min(+b.dataset.h, Math.round(window.innerHeight*0.72))+'px';
}
function go(){
  var s=document.getElementById('pg'), f=document.getElementById('fr');
  if(s&&f) f.src=s.value+(s.value.indexOf('?')>-1?'&':'?')+'t='+Date.now();
}
</script>
<script src="assets/sheet.js" defer></script>
</body>
</html>
