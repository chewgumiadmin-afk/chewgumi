<script>
const FAQ = [
  { c:'쿠폰', q:'쿠폰을 어떻게 사용하나요?', a:'주문서 작성 화면의 <b>쿠폰 사용</b> 항목에서 [쿠폰 적용] 버튼을 눌러 보유 쿠폰을 선택하시면 할인이 적용됩니다. 쿠폰은 상품별·주문별로 적용 조건이 다를 수 있으며, 최소 주문금액이나 사용 기한이 설정된 경우 조건을 충족해야 사용하실 수 있습니다.' },
  { c:'쿠폰', q:'발급 받은 쿠폰은 어디서 확인할 수 있나요?', a:'공식몰 로그인 후 <b>마이쇼핑 → 쿠폰</b> 메뉴에서 보유 쿠폰과 사용 기한을 확인하실 수 있습니다. 회원가입 시 지급되는 2,000원 할인쿠폰도 이곳에서 확인됩니다.<br><a href="mypage.html">마이쇼핑 바로가기 →</a>' },
  { c:'반품', q:'상품 반품/교환 진행 시, 배송비가 부과되나요?', a:'<b>상품 하자나 오배송</b>인 경우에는 배송비가 부과되지 않습니다. 다만 단순 변심으로 인한 교환·반품은 왕복 배송비를 고객님께서 부담하셔야 합니다.<br>식품 특성상 <b>미개봉 상태에 한해 수령 후 7일 이내</b> 신청 가능하며, 개봉하셨거나 사용하신 경우에는 반품이 어려운 점 양해 부탁드립니다.' },
  { c:'주문', q:'주문 내역 조회는 어디서 하나요?', a:'공식몰 로그인 후 <b>마이쇼핑 → 주문조회</b>에서 주문 상태와 배송 현황을 확인하실 수 있습니다. 송장이 등록되면 배송 조회도 함께 가능합니다.<br><a href="mypage.html">주문조회 바로가기 →</a>' },
  { c:'회원', q:'아이디, 비밀번호가 기억이 나지 않습니다.', a:'로그인 화면의 <b>아이디 찾기 / 비밀번호 찾기</b>를 이용해 주세요. 가입 시 등록하신 이메일 또는 휴대전화로 본인 확인 후 안내해 드립니다.<br><a href="login.html">로그인 화면으로 →</a>' },
  { c:'회원', q:'회원정보를 수정하고 싶습니다.', a:'로그인 후 <b>마이쇼핑 → 회원정보 수정</b>에서 배송지, 연락처, 수신 동의 여부 등을 변경하실 수 있습니다. 보안을 위해 비밀번호를 다시 입력하는 절차가 있습니다.' },
  { c:'회원', q:'회원 탈퇴는 어떻게 하나요?', a:'로그인 후 <b>마이쇼핑 → 회원정보 수정</b> 하단의 회원 탈퇴 메뉴에서 진행하실 수 있습니다.<br>탈퇴 시 보유하신 <b>적립금과 쿠폰은 모두 소멸</b>되며 복구되지 않습니다. 배송이 진행 중인 주문이 있다면 배송 완료 후 탈퇴해 주세요.' },
  { c:'비회원', q:'비회원 구매 후 주문번호(비밀번호)가 기억나지 않습니다.', a:'비회원 주문은 주문번호와 주문 시 설정하신 비밀번호로 조회합니다. 두 정보를 모두 잊으셨다면 <b>주문자 성함과 연락처, 대략적인 주문일</b>을 chewgumi24@gmail.com으로 보내주시면 확인해 드리겠습니다.' },
  { c:'비회원', q:'비회원의 주문 내역 조회는 어떻게 하나요?', a:'공식몰 상단의 <b>주문조회</b> 메뉴에서 <b>비회원 주문조회</b>를 선택하고, 주문번호와 주문 시 입력하신 비밀번호를 넣으시면 조회됩니다.<br><a href="mypage.html">주문조회 바로가기 →</a>' },
  { c:'비회원', q:'비회원 구매 가능한가요?', a:'네, 회원가입 없이도 구매하실 수 있습니다. 주문서에서 <b>비회원 주문</b>을 선택하고 배송 정보를 입력하시면 됩니다.<br>다만 회원으로 가입하시면 <b>2,000원 할인쿠폰</b>과 적립금, 간편한 주문조회 혜택이 있어 회원 구매를 권해드립니다. <a href="join.html">회원가입하기 →</a>' },
  { c:'배송', q:'배송은 얼마나 걸리나요?', a:'평일 <b>오후 2시 이전 결제</b> 완료 건은 당일 출고되며, 출고 후 보통 1~2일 내 수령하실 수 있습니다. 주말·공휴일 주문은 다음 영업일에 순차 출고됩니다. 도서·산간 지역은 1~2일 더 소요될 수 있습니다. 배송비는 <b>무료</b>입니다.' },
  { c:'상품', q:'하루에 몇 개까지 먹어도 되나요?', a:'트래블잇은 <b>1일 1팩</b>, 듀잇은 <b>1일 2~3알</b>을 권장합니다. 자일리톨 특성상 한 번에 많이 드시면 배가 불편할 수 있으니 권장량을 지켜주세요. 임신·수유 중이거나 질환이 있으신 경우 전문가와 상담 후 드시기를 권합니다.' },
  { c:'상품', q:'보관은 어떻게 하나요?', a:'직사광선을 피해 <b>서늘하고 건조한 곳</b>에 보관해 주세요. 여름철에는 젤리가 다소 말랑해질 수 있으나 품질에는 이상이 없습니다. 개봉 후에는 밀봉하여 가능한 빨리 드시는 것을 권합니다.' },
  { c:'주문', q:'대량 구매(단체·행사)도 가능한가요?', a:'가능합니다. 수량과 일정에 따라 견적을 안내해 드리니 <b>chewgumi24@gmail.com</b>으로 문의해 주세요. 기업 행사, 답례품, 단체 구매 모두 상담 가능합니다.' }
];

let cat = '전체';
const CATS = ['전체', ...new Set(FAQ.map(f => f.c))];
document.getElementById('tabs').innerHTML = CATS.map(c =>
  '<button data-c="' + c + '"' + (c === cat ? ' class="on"' : '') + ' onclick="setCat(\'' + c + '\')">' + c + '</button>').join('');

function setCat(c){
  cat = c;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.c === c));
  render();
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[ch]); }

function render(){
  const kw = document.getElementById('q').value.trim().toLowerCase();
  const rows = FAQ.filter(f =>
    (cat === '전체' || f.c === cat) &&
    (!kw || f.q.toLowerCase().includes(kw) || f.a.toLowerCase().includes(kw) || f.c.toLowerCase().includes(kw)));
  const box = document.getElementById('list');
  if (!rows.length) { box.innerHTML = '<div class="none">검색 결과가 없습니다. 다른 검색어를 입력해 보세요.</div>'; return; }
  box.innerHTML = rows.map((f, i) =>
    '<div class="item"><div class="q" onclick="this.parentElement.classList.toggle(\'open\')">' +
    '<span class="mark">Q</span><span class="t">' + esc(f.q) + '</span>' +
    '<span class="cat">' + esc(f.c) + '</span><span class="arw">▾</span></div>' +
    '<div class="a">' + f.a + '</div></div>').join('');
}
render();
</script>
